<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>مدينتي الآمنة 🏙️ المهارات الحياتيَّة والأُسريَّة · الفصل الدراسي الأوَّل</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مدينتي الآمنة">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF7FA; --card:#FFFFFF; --ink:#3E2E46; --leaf:#8E5BA6; --leafD:#6E4185;
  --sun:#F5C544; --rose:#EF7FA8; --soil:#8A5A3B; --sky:#F0E8F6; --line:#E6DCEC; --teal:#3E8E8E;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Baloo Bhaijaan 2','Segoe UI',Tahoma,sans-serif;
  background:linear-gradient(180deg,var(--sky) 0%, var(--paper) 40%);
  color:var(--ink); min-height:100vh;}
#app{max-width:640px;margin:0 auto;padding:12px 14px 60px}
/* topbar */
#top{display:flex;justify-content:space-between;align-items:center;background:var(--card);
  border-radius:18px;padding:8px 14px;box-shadow:0 3px 0 var(--line);margin-bottom:12px;
  font-weight:800;color:var(--leafD)}
#top button{border:none;background:#F6EFFA;border-radius:12px;padding:6px 14px;font-size:15px}
/* cards & type */
.chip{display:inline-block;background:var(--leaf);color:#fff;font-weight:800;font-size:13px;
  border-radius:999px;padding:3px 14px;margin-bottom:10px}
.chip.story{background:var(--soil)}
.chip.prep{background:var(--teal)}
.card{background:var(--card);border-radius:24px;padding:22px 18px;box-shadow:0 4px 0 var(--line);text-align:center}
h1{font-size:25px;margin:6px 0 4px}
h2{font-size:20px;margin:4px 0 14px;line-height:1.5}
p.sub{margin:0 0 14px;font-size:15px;color:#6B5B75;line-height:1.8}
.big{font-size:50px;margin:4px 0}
button{font-family:inherit;font-weight:800;font-size:17px;color:var(--ink);
  background:#F6EFFA;border:2px solid var(--line);border-radius:18px;
  padding:13px 16px;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.96)}
.go{background:var(--leaf);border-color:var(--leafD);color:#fff;font-size:18px;padding:13px 30px;
  box-shadow:0 4px 0 var(--leafD)}
.go:disabled{opacity:.4;box-shadow:none}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.opts button.ok{background:#EDE0F5;border-color:var(--leaf);color:var(--leafD)}
.opts button.locked{pointer-events:none}
.wrong{animation:wig .35s}
@keyframes wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.hintPulse{animation:pul 1s infinite}
@keyframes pul{50%{box-shadow:0 0 0 6px rgba(245,197,68,.45)}}
/* map */
.uhead{margin:20px 4px 8px;font-size:18px;font-weight:800;color:var(--leafD)}
.chead{margin:2px 8px 8px;font-size:13.5px;font-weight:700;color:#8B7A96}
.lrow{background:var(--card);border-radius:20px;box-shadow:0 3px 0 var(--line);
  padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.lrow .lic{font-size:30px;width:44px;text-align:center;filter:grayscale(.7);opacity:.75;position:relative}
.lrow.done{background:#F5EDFA;box-shadow:0 3px 0 #D6C2E4}
.lrow .tick{position:absolute;top:-8px;right:-10px;background:var(--leaf);color:#fff;border-radius:50%;width:24px;height:24px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;filter:none;opacity:1}
.lrow .tick.gold{background:var(--sun);color:#5A4300}
.opts button.bad,.pool button.bad,.mcol button.bad{background:#FBE3E3;border-color:#E39B9B;color:#9B3B3B}
.hs.hint{animation:hsP .8s infinite}
@keyframes hsP{50%{stroke-width:7;fill:rgba(245,197,68,.6)}}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) scale(.6);background:var(--leaf);color:#fff;font-weight:800;font-size:19px;padding:10px 26px;border-radius:999px;box-shadow:0 6px 0 var(--leafD);z-index:70;opacity:0;pointer-events:none;transition:all .25s}
#toast.show{opacity:1;transform:translateX(-50%) scale(1)}
.lrow.done .lic{filter:none;opacity:1}
.lrow .lt{flex:1;text-align:right}
.lrow .lt b{font-size:16px;display:block;line-height:1.4}
.lrow .lt small{color:#8B7A96;font-weight:700;font-size:12px}
.lbtns{display:flex;flex-direction:column;gap:6px}
.lbtns button{font-size:13px;padding:7px 12px;border-radius:12px;white-space:nowrap}
.lbtns .bprep{background:#E6F3F3;border-color:#BFDDDD;color:var(--teal)}
.lbtns .bprep.done{background:#D2ECEC;border-color:var(--teal)}
.lbtns .btest{background:#FFF3D6;border-color:#F0DBA0;color:#9A7A17}
.lbtns .btest.done{background:#EDE0F5;border-color:var(--leaf);color:var(--leafD)}
.lbtns .bthink{background:#F3EEFA;border-color:#D9CCEC;color:#6B4FA0}
.lbtns .bthink.done{background:#E9E0F6;border-color:#6B4FA0}
.lockrow{opacity:.65}
/* vocab flip */
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.vcard{background:#FAF5FD;border:2px solid var(--line);border-radius:16px;padding:14px 10px;
  min-height:92px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-weight:800;font-size:17px;line-height:1.5}
.vcard.open{background:#FFF9E3;border-color:var(--sun);font-weight:700;font-size:13.5px;line-height:1.7}
.vcard.seen{box-shadow:0 0 0 2px #EDE0F5 inset}
/* pools, bins, match, order (engine) */
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.pool button{font-size:17px}
.bins{display:flex;gap:10px}
.bin{flex:1;background:#F6EFFA;border:2px dashed var(--leaf);border-radius:18px;min-height:110px;padding:8px}
.bin h3{margin:2px 0 6px;font-size:15px;color:var(--leafD)}
.bin .got{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bin .got span{background:#fff;border-radius:12px;padding:4px 10px;font-size:14px;font-weight:700;border:1px solid var(--line)}
.pool button.sel{background:#FFF3D6;border-color:var(--sun)}
.mcols{display:flex;gap:10px;margin-top:8px}
.mcol{flex:1;display:flex;flex-direction:column;gap:8px}
.mcol button{font-size:14px;padding:11px 8px;line-height:1.5}
.mcol button.pick{background:#FFF3D6;border-color:var(--sun)}
.mcol button.done{background:#EDE0F5;border-color:var(--leaf);color:var(--leafD);pointer-events:none}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.slot{min-width:66px;min-height:50px;border:2px dashed #D3C4DC;border-radius:14px;
  display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:800;
  color:#BDACC6;padding:4px 8px}
.slot.fill{border-style:solid;border-color:var(--leaf);background:#EDE0F5;color:var(--leafD)}
.arrow{align-self:center;color:#BDACC6;font-size:15px}
.qbox{background:#FAF5FD;border:2px solid var(--line);border-radius:18px;padding:16px;font-size:18px;line-height:1.8;margin-bottom:12px}
.ans{background:#FFF9E3;border:2px solid var(--sun);border-radius:18px;padding:14px;font-size:16px;line-height:1.8;margin:12px 0;display:none;text-align:right}
.ans.show{display:block}
.marks{display:none;gap:10px;justify-content:center;flex-wrap:wrap}
.marks.show{display:flex}
.hs{fill:rgba(245,197,68,.25);stroke:var(--sun);stroke-width:2.5;cursor:pointer}
.hs.done{fill:rgba(78,155,87,.35);stroke:var(--leaf);pointer-events:none}
.hlabel{font-family:inherit;font-weight:800;font-size:15px;fill:var(--leafD)}
/* overlay + confetti */
#ovl{position:fixed;inset:0;background:rgba(46,74,48,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#ovl.show{display:flex}
#ovl .inner{background:var(--card);border-radius:28px;padding:30px 24px;text-align:center;max-width:420px;animation:pop .45s}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#ovl .bicon{font-size:62px}
.conf{position:fixed;font-size:24px;z-index:60;animation:fall 1.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.2}}
.nav{margin-top:18px}
footer{text-align:center;font-size:12px;color:#A798AF;margin-top:26px}
footer button{border:none;background:none;color:#C3B4CB;font-size:11px;text-decoration:underline;padding:4px}

/* ---- farm animations ---- */
.an-walk,.an-walk-s{transform-box:fill-box;transform-origin:center;animation:walk 16s ease-in-out infinite}
.an-walk-s{animation:walks 26s ease-in-out infinite}
@keyframes walk{0%{transform:translateX(0) scaleX(1)}48%{transform:translateX(110px) scaleX(1)}52%{transform:translateX(110px) scaleX(-1)}98%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
@keyframes walks{0%{transform:translateX(0) scaleX(1)}48%{transform:translateX(60px) scaleX(1)}52%{transform:translateX(60px) scaleX(-1)}98%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
.an-bob{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.an-tail{transform-box:fill-box;transform-origin:left bottom;animation:tail 1.6s ease-in-out infinite alternate}
@keyframes tail{from{transform:rotate(-12deg)}to{transform:rotate(18deg)}}
.an-fly{animation:fly 20s linear infinite}
@keyframes fly{0%{transform:translate(-40px,0)}50%{transform:translate(300px,-30px)}100%{transform:translate(700px,10px)}}
.an-flutter{animation:flutter 7s ease-in-out infinite alternate}
@keyframes flutter{0%{transform:translate(0,0)}33%{transform:translate(26px,-18px)}66%{transform:translate(-12px,-32px)}100%{transform:translate(32px,-8px)}}
.an-wing{transform-box:fill-box;transform-origin:center;animation:wing .28s ease-in-out infinite alternate}
@keyframes wing{from{transform:scaleX(1)}to{transform:scaleX(.25)}}
.an-hop{animation:hop 4.5s ease-in-out infinite}
@keyframes hop{0%,72%,100%{transform:translateY(0)}80%{transform:translateY(-24px)}88%{transform:translateY(0)}}
.an-spin{animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.an-orbit{animation:spin 24s linear infinite}
.an-sway{transform-box:fill-box;transform-origin:bottom center;animation:sway 4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.an-drift{animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(70px)}}
.an-rain{stroke-dasharray:7 11;animation:rain .55s linear infinite}
@keyframes rain{to{stroke-dashoffset:-18}}
.an-flow{stroke-dasharray:16 20;animation:flow 2.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-36}}
.an-worm{animation:worm 3s ease-in-out infinite alternate}
@keyframes worm{to{transform:translateX(16px)}}
.an-shine{animation:shine 3s ease-in-out infinite alternate}
@keyframes shine{to{opacity:.35}}
@media (prefers-reduced-motion:reduce){[class^="an-"],[class*=" an-"]{animation:none}}
.qbox,.ans,.vcard,.opts button,.pool button,.mcol button,.slot,.lt b,.lt small,.xq,.xopts button,.xmatch button,.xbank button,.xslot,.xblankrow,.dcard,.da,.fitem{unicode-bidi:plaintext}
.an-hour{animation:spin 43200s linear infinite}
.an-min{animation:spin 3600s linear infinite}
.an-car{animation:cardrive 14s linear infinite}
@keyframes cardrive{0%{transform:translateX(0)}100%{transform:translateX(760px)}}
.an-walk2{animation:walk2 18s ease-in-out infinite}
@keyframes walk2{0%{transform:translateX(0) scaleX(1)}48%{transform:translateX(150px) scaleX(1)}52%{transform:translateX(150px) scaleX(-1)}98%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
.pbar{height:8px;background:#F2EAF7;border-radius:99px;margin:0 0 14px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .4s}
.credit{margin-top:10px;font-size:12px;color:#93A0B7;font-weight:600}.credit a{color:#0A66C2;text-decoration:none}</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button id="backB" style="visibility:hidden" onclick="goMap()">🏡 الخريطة</button>
    <button id="sndB" onclick="toggleSound()" style="font-size:18px">🔊</button><span>⭐ <span id="stars">0</span></span>
  </div>
  <div id="stage"></div>
  <footer>المهارات الحياتيّة والأُسريّة · الصّفّ الثّالث · الفصل الدّراسيّ الأوّل · ط١٤٤٨<br><button onclick="profAsk(true)">👧 تغيير الاسم</button> · <button onclick="exLog()">📊 سجل الاختبارات</button> · <button onclick="exportProgress()">حفظ نسخة</button> · <button onclick="importProgress()">استرجاع نسخة</button> · <button onclick="hardReset()">بداية جديدة (يمسح التَّقدُّم)</button><div class="credit">© ٢٠٢٦ Dr. Asma Khattala · جميع الحقوق محفوظة · All rights reserved · <a href="https://www.linkedin.com/in/dr-asma-khattala/" target="_blank" rel="noopener">LinkedIn</a></div></footer>
<input type="file" id="impF" accept=".json,application/json" style="display:none">
</div>
<div id="ovl"><div class="inner"></div></div>
<div id="toast"></div>

<script>
/* ==================== بيانات الدروس ==================== */
const U1='الوحدة الأولى: صِحَّتي وسَلامَتي', U2='الوحدة الثَّانية: شَخْصِيَّتي', U3='الوحدة الثَّالثة: وَقْتي';

const LESSONS=[
/* ---------- 1 ---------- */
{u:U1,ch:'الدَّرس الأوَّل',name:'مَعاني الرُّموز الإرْشادِيَّة',ic:'🚸',
 idea:'الرُّموز الإرْشادِيَّة صُورٌ صغيرة تُخبرنا بشيء مُهِمّ دون كلام، ولها ثلاثة أشكال: لوحة تحذيريَّة ولوحة إلزاميَّة ولوحة إرشاديَّة.',
 eq:'ما أشكال الرُّموز الإرْشادِيَّة؟ وماذا يحدُث عند تجاهُلها؟',
 vocab:[
  ['اللَّوحة التَّحذيريَّة ⚠️','شكلها مُثلَّث بإطار أحمر، تُحذِّرني من خطر قادم مثل: أعمال حفر، عُبور مُشاة، طريق غير مُستوٍ.'],
  ['اللَّوحة الإلزاميَّة ⛔','شكلها دائرة، تُلزمني بأمر أو تمنعني منه مثل: قِف، ممنوع التَّدخين، ممنوع استعمال المُنبِّه.'],
  ['اللَّوحة الإرشاديَّة 🅿️','شكلها مُربَّع أو مُستطيل، تدُلُّني على مكان أو خدمة مثل: مُستشفى، مطعم، محطَّة وقود، مخرج الطَّوارئ.'],
  ['الرُّموز موحَّدة 🌍','الرُّموز الإرْشادِيَّة موحَّدة ومُتشابهة في جميع أنحاء العالم، فيفهمها كلُّ النَّاس.']],
 guess:[['ماذا يحدُث عند تجاهُل الرُّموز الإرْشادِيَّة؟','حُدوث الحوادث والتَّعرُّض للخطر.'],
        ['رمز فيه شوكة ومِلعقة 🍴 على ماذا يدُلّ؟','على وُجود مطعم.']],
 test:[
  {t:'match',q:'صِلي كلّ رمز بمعناه الصَّحيح.',
   pairs:[['🚭','ممنوع التَّدخين'],['🅷','مُستشفى'],['♻️','إعادة التَّدوير'],['🍴','مطعم']]},
  {t:'mcq',q:'الرُّموز الإرْشادِيَّة ذات الشَّكل المُثلَّث:',o:['تحذيريَّة','إلزاميَّة','إرشاديَّة'],c:0},
  {t:'mcq',q:'الرَّمز الَّذي يحوي رسم شوكة ومِلعقة يدُلُّ على:',o:['مدرسة','مسجد','مطعم'],c:2},
  {t:'mcq',q:'الرَّمز الَّذي فيه صُورة سيجارة وعليها خطٌّ أحمر يعني:',o:['مكان مُخصَّص للتَّدخين','ممنوع التَّدخين','التَّدخين مسموح للجميع'],c:1},
  {t:'tf',q:'الرُّموز الإرْشادِيَّة موحَّدة في جميع أنحاء العالم.',c:true,fix:'صحيح: لذلك يفهمها كلُّ النَّاس في كلّ بلد.'},
  {t:'tf',q:'اتِّباع مدلولات الرُّموز الإرْشادِيَّة يدُلُّ على الوَعي.',c:true,fix:'صحيح: الواعية تقرأ الرَّمز وتعمل به.'},
  {t:'multi',q:'اختاري ما تدُلُّ عليه اللَّوحة الإرشاديَّة، ثمّ اضغطي «تحقّقي».',
   items:['🏥 مُستشفى','⛽ محطَّة وقود','🚌 محطَّة حافلات','📞 هاتف','⚠️ خطر قادم','⛔ ممنوع المُرور'],correct:[0,1,2,3]}],
 think:[
  {t:'create',q:'صمِّمي رمزًا إرشاديًّا جديدًا لغُرفتكِ أو لمدرستكِ.',
   hints:'اختاري الشَّكل أوَّلًا: مُثلَّث للتَّحذير، دائرة للإلزام، مُربَّع للإرشاد. ثمّ ارسمي بداخله صُورةً بسيطةً واشرحيها لأهلكِ.'},
  {t:'open',q:'تخيَّلي لو كانت هذه الرُّموز تتكلَّم: ♻️ و 🧯 و 🗑️ ماذا ستقول؟',
   a:'♻️ «أعِيدي استعمالي لا ترميني»، 🧯 «أنا هنا إن شبَّ حريق»، 🗑️ «ضعي النِّفايات في داخلي».'}]},
/* ---------- 2 ---------- */
{u:U1,ch:'الدَّرس الثَّاني',name:'السَّلامة في تَناوُل الدَّواء',ic:'💊',
 idea:'الله هو الشَّافي، وإنَّما الدَّواء سبب للشِّفاء. وللدَّواء مِقدار مُعيَّن ووقت مُحدَّد يجب الالتزام بهما، ونشربه بإشراف الكِبار.',
 eq:'كيف أتناول الدَّواء بأمان؟ وكيف أتخلَّص منه بعد الانتهاء؟',
 vocab:[
  ['الوَصفة الطِّبِّيَّة 📝','ورقة يكتُب فيها الطَّبيب الدَّواء المُناسب ومِقداره ومواعيده، وأتَّبعها بدِقَّة.'],
  ['الصَّيدليَّة 💊','المكان الَّذي آخُذ منه الدَّواء بعد وَصفة الطَّبيب.'],
  ['أشكال الأدوية 🥄','شَراب، وحُبوب، وإبرة (حُقنة)، وقطرة، ومَرهم.'],
  ['المُضادّ الحيويّ 🧊','مسحوق يُضاف إليه الماء قبل الاستعمال، ويُوضَع بعدها في الثَّلَّاجة.']],
 guess:[['لماذا يُضاف الماء إلى مسحوق المُضادِّ الحيويِّ قبل استعماله؟','ليتحوَّل إلى شَراب يسهُل شُربه ويعمل مفعوله، ثمّ يُحفَظ في الثَّلَّاجة.'],
        ['مَن الشَّافي حقيقةً؟','الله سُبحانه، والدَّواء سبب من أسباب الشِّفاء.']],

   else if(s.t==='multi')out.push({t:'mcq',q:s.q.replace(/، ثمّ اضغطي «تحقّقي».|، ثم اضغطي «تحقّقي»./,''),o:s.items.slice(0,3).map(x=>String(x)),a:s.correct.includes(0)?0:1});});
  if(Ls.vocab&&Ls.vocab.length>=3){const v=xsh(Ls.vocab).slice(0,3);
   out.push({t:'fill',q:'أضع المصطلح المناسب في الفراغ:',bank:v.map(x=>String(x[0]).replace(/[^؀-ۿ\s]/g,'').trim()),
    items:v.map(x=>[String(x[1]).split('،')[0]+' ...',String(x[0]).replace(/[^؀-ۿ\s]/g,'').trim()])});}
  return out;}};

/* ==================== 📝 اختبار تجريبي · محرك مشترك (يُضمَّن داخل كل تطبيق) ====================
   يعتمد على: EXAM_BANK (بنك الأوراق الحقيقية) و EXAM_CFG (إعدادات المادة) و دوال التطبيق: addStar, save, goMap,
   stage, applause, tada, confetti, ST.  لا أصوات ولا نجوم أثناء الاختبار؛ احتفال واحد في النهاية.           */
const EX={sec:[],ans:[],timer:null,left:0,kind:'',on:false};
const XAR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const XLAT=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const XORD=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'];
const XLET=['أ','ب','ج','د','هـ','و'];
const xsh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const xnorm=s=>String(s||'').replace(/[ً-ْٰـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/[^؀-ۿ0-9a-zA-Z\s]/g,' ').replace(/\s+/g,' ').trim();
const xesc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const XTITLE0={tf:'ضعي علامة ✓ أو ✗ أمام كل عبارة',mcq:'اختاري الإجابة الصحيحة',match:'صلي كل عبارة بما يناسبها',fill:'أكملي الفراغ من الكلمات التالية (كل كلمة تُستعمل مرة واحدة)',order:'رتّبي',label:'حدّدي على الرسم',short:'اكتبي الإجابة',num:'أكملي',word:'حلّي المسألة بالخطوات الأربع',passage:'اقرئي النص ثم أجيبي',dictation:'إملاء منظور',sort:'صنّفي',extract:'استخرجي من النص'};
const XTITLE=Object.assign({},XTITLE0,(typeof EXAM_CFG!=='undefined'&&EXAM_CFG.titles)||{});

/* ---------- قواعد «استخرجي من النص» (كما في الأوراق) ---------- */
const XSUN='تثدذرزسشصضطظلن',XMOON='ءابجحخعغفقكمهوي';
const xstrip=w=>String(w||'').replace(/[،؛:.!؟()«»"'\-\[\]]/g,'');
function xRule(rule,w){w=xstrip(w);if(!w)return false;const bare=w.replace(/[ً-ْٰ]/g,'');const voc=/[ً-ْ]/.test(w);const core=bare.replace(/^[وفبك]?ال/,'');
 switch(rule){
 case 'sun':{const m=bare.match(/^[وفبك]?ال(.)/);return !!m&&XSUN.includes(m[1])&&!/^[وفبك]?الله/.test(bare);}
 case 'moon':{const m=bare.match(/^[وفبك]?ال(.)/);return !!m&&XMOON.includes(m[1]);}
 case 'ta_marbuta':return /ة$/.test(bare);
 case 'ta_maftuha':return /ت$/.test(bare)&&bare.length>2;
 case 'tanween_fath':return /ً/.test(w);case 'tanween_kasr':return /ٍ/.test(w);case 'tanween_damm':return /ٌ/.test(w);
 case 'hamza_qat':return /^[وف]?[أإآ]/.test(bare);
 case 'hamza_wasl':return /^[وف]?ا(?!ل)/.test(bare);
 case 'shadda':return /ّ/.test(w);
 case 'madd_alif':{for(let i=1;i<w.length;i++){if(w[i]!=='ا'||w[i-1]==='ً')continue;const before=w.slice(0,i).replace(/[ً-ْٰ]/g,'');if(/^[وفبك]?$/.test(before))continue;return true;}return false;}
 case 'madd_waw':return voc?/ُو(?![ً-ْ])/.test(w):core.slice(1).includes('و');
 case 'madd_ya':return voc?/ِي(?![ً-ْ])/.test(w):core.slice(1).includes('ي');}
 return false;}
const XRULE_NAME={sun:'كلمة تحتوي (ال) الشمسية',moon:'كلمة تحتوي (ال) القمرية',ta_marbuta:'كلمة مختومة بتاء مربوطة',ta_maftuha:'كلمة مختومة بتاء مفتوحة',tanween_fath:'كلمة مختومة بتنوين الفتح',tanween_kasr:'كلمة مختومة بتنوين الكسر',tanween_damm:'كلمة مختومة بتنوين الضم',hamza_qat:'كلمة تبدأ بهمزة قطع',hamza_wasl:'كلمة تبدأ بهمزة وصل',shadda:'كلمة بها حرف مضعف (شدة)',madd_alif:'كلمة بها مد بالألف',madd_waw:'كلمة بها مد بالواو',madd_ya:'كلمة بها مد بالياء'};
function xFirstMatch(text,rule){return (String(text||'').split(/\s+/).map(xstrip).find(w=>xRule(rule,w)))||'';}

/* ---------- تجميع الأسئلة المتاحة ---------- */
function exMergeAttempts(x,y){const m={};[...(x||[]),...(y||[])].forEach(a=>{if(a&&a.d)m[a.d]=a;});return Object.values(m).sort((p,q)=>p.d<q.d?-1:1);}
function exPool(lessons){const pool={};const add=it=>{(pool[it.t]=pool[it.t]||[]).push(it);};
 EXAM_BANK.filter(b=>lessons.includes(b.L)).forEach(b=>{let it=Object.assign({},b);if(it.t==='label'&&!it.targets&&EXAM_CFG.label)it=Object.assign(it,EXAM_CFG.label(it.fig));add(it);});
 lessons.forEach(L=>{try{(EXAM_CFG.gen(L)||[]).forEach(it=>{it.L=L;add(it);});}catch(e){}});
 return pool;}
function exDraw(pool,t,n){const src=xsh(pool[t]||[]);const out=[];const seen=new Set();
 for(const it of src){if(out.length>=n)break;const k=xnorm(it.q||it.text||'')+(it.seq||it.pairs||it.items||'');if(seen.has(k))continue;seen.add(k);out.push(it);}
 return out;}
function exBuild(lessons,short){const plan=short?EXAM_CFG.plan10:EXAM_CFG.plan20;const pool=exPool(lessons);const secs=[];let deficit=0;
 plan.forEach(p=>{let items=exDraw(pool,p.t,p.n);
  if(p.t==='passage'){items=items.slice(0,1);if(items.length){const ps=items[0];const sub=xsh(ps.items).slice(0,p.m);secs.push({t:'passage',title:XTITLE.passage,text:ps.text,L:ps.L,items:sub.map(s=>Object.assign({},s,{L:ps.L,m:1})),marks:sub.length});deficit+=p.m-sub.length;}else deficit+=p.m;return;}
  if(items.length<p.n)deficit+=(p.n-items.length)*p.m;
  if(items.length)secs.push({t:p.t,title:p.title||XTITLE[p.t],items:items.map(it=>Object.assign({},it,{m:p.m})),marks:items.length*p.m});});
 if(deficit>0){const extra=exDraw(pool,'mcq',deficit*3).filter(it=>!secs.some(s=>s.items.some(x=>x.q===it.q))).slice(0,deficit);
  const more=deficit-extra.length;const tfx=more>0?exDraw(pool,'tf',more):[];
  if(extra.length)secs.push({t:'mcq',title:XTITLE.mcq,items:extra.map(it=>Object.assign({},it,{m:1})),marks:extra.length});
  if(tfx.length)secs.push({t:'tf',title:XTITLE.tf,items:tfx.map(it=>Object.assign({},it,{m:1})),marks:tfx.length});}
 return secs;}

/* ---------- النماذج الثابتة ---------- */
function exNorm(it){it=Object.assign({},it);if(it.t==='label'&&!it.targets&&EXAM_CFG.label)it=Object.assign(it,EXAM_CFG.label(it.fig,it));return it;}
function exPaperBest(id){const A=(ST.exams||[]).filter(a=>a.pid===id);if(!A.length)return null;return A.reduce((b,a)=>a.m>b.m?a:b);}
function exStartPaper(id){const P=(typeof EXAM_PAPERS!=='undefined'?EXAM_PAPERS:[]).find(x=>x.id===id);if(!P)return;
 EX.kind=P.kind;EX.short=false;EX.pid=P.id;EX.pname=P.name;
 EX.sec=P.secs.map(sec=>{const items=sec.items.map(it=>Object.assign(exNorm(it),{m:sec.m}));const o={t:sec.t,title:sec.title||XTITLE[sec.t],items,marks:items.length*sec.m};if(sec.t==='passage'){o.text=sec.text;o.L=sec.L;}return o;});
 EX.ans=EX.sec.map(s=>s.items.map(()=>null));exIntro();}

/* ---------- اختيار نوع الاختبار ---------- */
function exChoose(){EX.on=false;document.getElementById('backB').style.visibility='visible';if(typeof cur!=='undefined')cur=-1;if(typeof curLesson!=='undefined')curLesson=-1;
 const n=EXAM_CFG.nLessons,half=Math.ceil(n/2);const done=ST.after||[];const PAP=(typeof EXAM_PAPERS!=='undefined'?EXAM_PAPERS:[]);
 const kinds=[{k:'p1',n:'اختبار الفترة الأولى',rng:[...Array(half).keys()]},{k:'p2',n:'اختبار الفترة الثانية',rng:[...Array(n-half).keys()].map(i=>i+half)},{k:'fin',n:'اختبار نهاية الفصل',rng:[...Array(n).keys()]}];
 stage.innerHTML=`${chip('📝 اختبار تجريبي')}<div class="card"><div class="big">📝✏️</div><h1 style="font-size:22px">اختبارات ${EXAM_CFG.subject} التجريبية</h1>
  <p class="sub">كل ورقة مثل ورقة المدرسة: ${XAR(20)} درجة و ${XAR(15)} دقيقة. لا نجوم ولا أصوات أثناء الاختبار، وفي النهاية تظهر الدرجة فورًا ثم الورقة المصحّحة 🎉</p>
  ${kinds.map(K=>{const el=K.rng.filter(i=>done.includes(i));const few=el.length<Math.ceil(K.rng.length/2);const papers=PAP.filter(p=>p.kind===K.k);
   return `<div style="background:#F7F9FC;border:2px solid #E1E7F0;border-radius:16px;padding:12px;margin:10px 0;text-align:right">
    <b style="font-size:17px">${K.n}</b><div style="font-size:13px;color:#5B6B85;margin:4px 0 8px">الدروس المنجزة (✏️ بعد الحصة): ${XAR(el.length)} من ${XAR(K.rng.length)}${few?' · <span style="color:#9A7A17">يُفضَّل إكمال دروس هذه الفترة أولًا</span>':''}</div>
    ${papers.map(p=>{const b=exPaperBest(p.id);return `<div style="display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap"><button class="go" style="font-size:14px;padding:8px 16px" onclick="exStartPaper('${p.id}')">${b?'🔁 ':'📄 '}${p.name}</button><span style="font-size:13px;color:${b?'#227A63':'#9AA9BE'}">${b?'أفضل درجة: '+XAR(b.m)+' / '+XAR(b.max)+' ✓':'لم تُحلّ بعد'}</span></div>`;}).join('')}
    ${el.length?`<div style="margin-top:6px"><button style="font-size:13px;padding:7px 14px" onclick="exStart('${K.k}',${JSON.stringify(el)},${el.length<EXAM_CFG.minLessons})">🎲 ورقة عشوائية جديدة من الدروس المنجزة (${XAR(el.length<EXAM_CFG.minLessons?10:20)} درجة)</button></div>`:''}
   </div>`;}).join('')}
  <button onclick="goMap()" style="margin-top:6px">الخريطة 🏡</button></div>`;window.scrollTo({top:0});}

/* ---------- بدء الورقة ---------- */
function exStart(kind,lessons,short){EX.kind=kind;EX.short=!!short;EX.pid=null;EX.pname=null;EX.sec=exBuild(lessons,short);EX.ans=EX.sec.map(s=>s.items.map(()=>null));exIntro();}
function exIntro(){EX.on=false;const total=EX.sec.reduce((a,s)=>a+s.marks,0);
 stage.innerHTML=`<div class="xpaper"><div class="xhead"><div><b>المادة:</b> ${EXAM_CFG.subject}</div><div><b>الصف:</b> الثالث الابتدائي</div><div><b>الزمن:</b> ${XAR(15)} دقيقة</div><div><b>الدرجة:</b> ${XAR(total)}</div></div>
  <div class="xtitle">${EX.pname||exKindName(EX.kind)}</div>
  <div class="xsec"><div class="xsech">تعليمات الاختبار</div><ul class="xinstr"><li>اقرئي السؤال جيدًا قبل البدء في الإجابة.</li><li>أجيبي بهدوء، ولا تتركي سؤالًا بدون إجابة.</li><li>راجعي إجاباتكِ أكثر من مرة قبل التسليم.</li><li>الأسئلة: ${EX.sec.map((s,i)=>'السؤال '+(XORD[i]||XAR(i+1))+' ('+XAR(s.marks)+')').join(' · ')}</li></ul></div>
  <div style="text-align:center;margin-top:14px"><button class="go" onclick="exBegin()">نستعين بالله ونبدأ ✍️</button><div style="height:8px"></div><button onclick="goMap()" style="font-size:13px">رجوع</button></div></div>`;window.scrollTo({top:0});}
function exBegin(){EX.on=true;EX.left=15*60;clearInterval(EX.timer);EX.timer=setInterval(()=>{EX.left--;const t=document.getElementById('xtimer');if(t)t.textContent='⏱ '+XAR(String(Math.floor(EX.left/60)).padStart(2,'0'))+':'+XAR(String(EX.left%60).padStart(2,'0'));if(EX.left<=0){clearInterval(EX.timer);exSubmit(true);}},1000);exRender();}
function exKindName(k){return k==='p1'?'اختبار الفترة الأولى':k==='p2'?'اختبار الفترة الثانية':'اختبار نهاية الفصل';}
function exRender(){const total=EX.sec.reduce((a,s)=>a+s.marks,0);
 let html=`<div class="xpaper">
  <div class="xhead"><div><b>الصف:</b> الثالث الابتدائي</div><div><b>المادة:</b> ${EXAM_CFG.subject}</div><div><b>اسم الطالبة:</b> ماريا</div><div><b>الدرجة:</b> ____ / ${XAR(total)}</div></div>
  <div class="xtitle">${EX.pname||exKindName(EX.kind)} · الفصل الدراسي الأول </div><div class="xfloat"><span id="xtimer" class="xtimer">⏱ ١٥:٠٠</span></div>`;
 EX.sec.forEach((s,si)=>{const part=s.part||(EXAM_CFG.partOf?EXAM_CFG.partOf(s.t):'');html+=`<div class="xsec"><div class="xsech">السؤال ${XORD[si]||XAR(si+1)}${part?' ('+part+')':''}: ${s.title} <span class="xmarks">(${s.marks===1?'درجة واحدة':s.marks===2?'درجتان':XAR(s.marks)+' درجات'})</span></div>`;
  if(s.t==='passage'){const tap=s.items.some(it=>it.t==='extract');html+=`<div class="xpass ${tap?'xtap':''}" data-pass="${si}">${tap?String(s.text).split(/(\s+)/).map(tok=>/^\s+$/.test(tok)||!tok?tok:`<span class="xw">${xesc(tok)}</span>`).join(''):xesc(s.text)}</div>${tap?'<div class="xhint">لأسئلة «استخرجي»: اضغطي زر السؤال ثم اضغطي الكلمة المناسبة في النص 👆</div>':''}`;}
  s.items.forEach((it,ii)=>{html+=`<div class="xitem" id="xi_${si}_${ii}">${exItemHtml(it,si,ii)}</div>`;});
  html+='</div>';});
 html+=`<div style="text-align:center;margin-top:14px"><button class="go" onclick="exSubmit(false)">سلّمي الورقة ✅</button><div style="height:8px"></div><button onclick="if(confirm('تخرجين من الاختبار دون تسليم؟')){clearInterval(EX.timer);EX.on=false;goMap();}" style="font-size:13px">خروج بدون تسليم</button></div></div>`;
 stage.innerHTML=html;window.scrollTo({top:0});
 EX.sec.forEach((s,si)=>s.items.forEach((it,ii)=>exBind(it,si,ii)));}

/* ---------- عرض كل نوع ---------- */
function exItemHtml(it,si,ii){const id=`${si}_${ii}`;const num=`<span class="xn">${XAR(ii+1)}</span>`;
 switch(it.t){
 case 'tf':return `<div class="xrow">${num}<div class="xq">${xesc(it.q)}</div><div class="xtf"><button data-v="1">✓</button><button data-v="0">✗</button></div></div>`;

 case 'fill':{const bank=xsh(it.bank||it.items.map(x=>x[1]));return `${num}<div class="xq">${xesc(it.q)}</div><div class="xbank">${bank.map((w,k)=>`<button data-w="${k}">${xesc(w)}</button>`).join('')}</div>${it.items.map((x,k)=>`<div class="xblankrow"><span class="xn">${XAR(k+1)}</span> ${xesc(x[0]).replace(/\.{3,}|◯|_{2,}/,'<span class="xblank" data-b="'+k+'"></span>')}${/\.{3,}|◯|_{2,}/.test(x[0])?'':' <span class="xblank" data-b="'+k+'"></span>'}</div>`).join('')}`;}
 case 'sort':return `${num}<div class="xq">${xesc(it.q)}</div><div class="xbank">${xsh(it.items.map((x,k)=>k)).map(k=>`<button data-w="${k}">${xesc(it.items[k][0])}</button>`).join('')}</div><div class="xbins">${it.bins.map((b,k)=>`<div class="xbin" data-bin="${k}"><h4>${xesc(b)}</h4><div class="xgot"></div></div>`).join('')}</div>`;
 case 'order':return `${num}<div class="xq">${xesc(it.q)}</div><div class="xslots">${it.seq.map((_,k)=>`<div class="xslot" data-s="${k}">${XAR(k+1)}</div>`).join('')}</div><div class="xbank">${xsh(it.seq.map((x,k)=>k)).map(k=>`<button data-w="${k}">${xesc(it.seq[k])}</button>`).join('')}</div><div style="text-align:left"><button class="xreset" style="font-size:12px;padding:4px 10px">إعادة ↺</button></div>`;
 case 'label':return `${num}<div class="xq">${xesc(it.q)}</div><div class="xbank">${it.chips.map((c,k)=>`<button data-w="${k}">${xesc(c)}</button>`).join('')}</div><div class="xfig">${it.html}</div>`;

 case 'num':return `${num}<div class="xq">${xesc(it.q)}</div><div class="xnum"><div class="xdisp">&nbsp;</div><div class="xkb">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-d="${d}">${XAR(d)}</button>`).join('')}<button data-d="del">⌫</button><button data-d="0">٠</button><button data-d="clr">مسح</button></div></div>`;
 case 'word':return `${num}<div class="xq">${xesc(it.q)}</div><div class="xsteps">

   <div class="xstep"><b>٤ أتحقق:</b> هل الجواب معقول؟ <button class="xchk" style="font-size:13px;padding:5px 12px">راجعتُ جوابي ✔</button></div></div>`;

 default:return `${num}<div class="xq">${xesc(it.q||'')}</div>`;}}

/* ---------- ربط التفاعل وتخزين الإجابات ---------- */
function exBind(it,si,ii){const el=document.getElementById(`xi_${si}_${ii}`);if(!el)return;const set=v=>{EX.ans[si][ii]=v;};
 const pickOne=(sel,attr)=>{el.querySelectorAll(sel).forEach(b=>b.onclick=()=>{el.querySelectorAll(sel).forEach(x=>x.classList.remove('xsel'));b.classList.add('xsel');set(b.dataset[attr]);});};
 switch(it.t){
 case 'tf':pickOne('.xtf button','v');break;
 case 'mcq':pickOne('.xopts button','k');break;
 case 'match':{let pick=null;const map={};set(map);
  el.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{el.querySelectorAll('[data-l]').forEach(x=>x.classList.remove('xsel'));b.classList.add('xsel');pick=+b.dataset.l;});
  el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(pick===null)return;const r=+b.dataset.r;Object.keys(map).forEach(k=>{if(map[k]===r)delete map[k];});map[pick]=r;
   el.querySelectorAll('[data-l]').forEach(x=>{x.classList.remove('xsel');const m=map[x.dataset.l];x.querySelector('.xtag')?.remove();if(m!==undefined)x.insertAdjacentHTML('beforeend',`<span class="xtag">${XAR(+x.dataset.l+1)}</span>`);});
   el.querySelectorAll('[data-r]').forEach(x=>{x.querySelector('.xtag')?.remove();const l=Object.keys(map).find(k=>map[k]===+x.dataset.r);if(l!==undefined)x.insertAdjacentHTML('beforeend',`<span class="xtag">${XAR(+l+1)}</span>`);});pick=null;});break;}
 case 'fill':{let pick=null;const map={};set(map);const words=el.querySelectorAll('.xbank button');
  words.forEach(b=>b.onclick=()=>{if(b.classList.contains('xused'))return;words.forEach(x=>x.classList.remove('xsel'));b.classList.add('xsel');pick=b;});
  el.querySelectorAll('.xblank').forEach(bl=>bl.onclick=()=>{const k=bl.dataset.b;if(map[k]!==undefined){const old=[...words].find(w=>w.textContent===map[k]);if(old)old.classList.remove('xused');delete map[k];bl.textContent='';bl.classList.remove('xfilled');if(!pick)return;}
   if(!pick)return;map[k]=pick.textContent;bl.textContent=pick.textContent;bl.classList.add('xfilled');pick.classList.add('xused');pick.classList.remove('xsel');pick=null;});break;}
 case 'sort':{let pick=null;const map={};set(map);const words=el.querySelectorAll('.xbank button');
  words.forEach(b=>b.onclick=()=>{words.forEach(x=>x.classList.remove('xsel'));b.classList.add('xsel');pick=b;});
  el.querySelectorAll('.xbin').forEach(bin=>bin.onclick=()=>{if(!pick)return;const k=+pick.dataset.w;map[k]=+bin.dataset.bin;bin.querySelector('.xgot').insertAdjacentHTML('beforeend',`<span>${xesc(it.items[k][0])}</span>`);pick.remove();pick=null;});break;}
 case 'order':{const arr=[];set(arr);const words=el.querySelectorAll('.xbank button');
  words.forEach(b=>b.onclick=()=>{if(arr.length>=it.seq.length)return;arr.push(+b.dataset.w);const sl=el.querySelector(`.xslot[data-s="${arr.length-1}"]`);sl.textContent=it.seq[+b.dataset.w];sl.classList.add('xfilled');b.classList.add('xused');});
  el.querySelector('.xreset').onclick=()=>{arr.length=0;el.querySelectorAll('.xslot').forEach((s,k)=>{s.textContent=XAR(k+1);s.classList.remove('xfilled');});words.forEach(b=>b.classList.remove('xused'));};break;}
 case 'label':{let pick=null;const map={};set(map);const chips=el.querySelectorAll('.xbank button');
  chips.forEach(b=>b.onclick=()=>{if(b.classList.contains('xused'))return;chips.forEach(x=>x.classList.remove('xsel'));b.classList.add('xsel');pick=b;});
  el.querySelectorAll('.xtarget').forEach(t=>t.addEventListener('click',()=>{if(!pick)return;const k=t.dataset.t;if(map[k]!==undefined&&!it.reuse){const old=[...chips].find(c=>+c.dataset.w===map[k]);if(old)old.classList.remove('xused');}
   map[k]=+pick.dataset.w;const lab=t.querySelector('.xtl')||t;if(t.tagName==='DIV'||t.tagName==='SPAN')lab.textContent=it.chips[map[k]];else{const tx=t.parentNode.querySelector(`[data-tl="${k}"]`);if(tx)tx.textContent=it.chips[map[k]];}
   t.classList.add('xfilled');if(!it.reuse)pick.classList.add('xused');pick.classList.remove('xsel');pick=null;}));break;}
 case 'short':el.querySelector('.xta').oninput=e=>set(e.target.value);break;
 case 'extract':{const btn=el.querySelector('.xpickbtn');btn.onclick=()=>{document.querySelectorAll('.xpickbtn').forEach(b=>b.classList.remove('xsel'));btn.classList.add('xsel');EX.active={si,ii};const ps=document.querySelector(`.xpass[data-pass="${si}"]`);if(ps){document.querySelectorAll('.xpass').forEach(p=>p.classList.remove('xactive'));ps.classList.add('xactive');ps.scrollIntoView({behavior:'smooth',block:'center'});}};
  const ps=document.querySelector(`.xpass[data-pass="${si}"]`);if(ps&&!ps.dataset.bound){ps.dataset.bound='1';ps.querySelectorAll('.xw').forEach(w=>w.onclick=()=>{if(!EX.active||EX.active.si!==si)return;const a=EX.active;EX.ans[a.si][a.ii]=w.textContent;const item=document.getElementById(`xi_${a.si}_${a.ii}`);if(item){item.querySelector('.xchosen').textContent=w.textContent;item.querySelector('.xpickbtn').classList.remove('xsel');}ps.querySelectorAll('.xw').forEach(x=>x.classList.remove('xhit'));w.classList.add('xhit');ps.classList.remove('xactive');EX.active=null;});}break;}
 case 'num':case 'word':{let v='';const disp=el.querySelector('.xdisp');el.querySelectorAll('.xkb button').forEach(b=>b.onclick=()=>{const d=b.dataset.d;if(d==='del')v=v.slice(0,-1);else if(d==='clr')v='';else if(v.length<6)v+=d;disp.textContent=v?XAR(v):' ';set(v);});
  if(it.t==='word'){el.querySelectorAll('.xplan button').forEach(b=>b.onclick=()=>{el.querySelectorAll('.xplan button').forEach(x=>x.classList.remove('xsel'));b.classList.add('xsel');});const c=el.querySelector('.xchk');c.onclick=()=>c.classList.toggle('xsel');}break;}
 case 'dictation':{let n=30;const cnt=el.querySelector('.xdcount'),tx=el.querySelector('.xdtext'),ta=el.querySelector('.xta');const iv=setInterval(()=>{n--;cnt.textContent='⏳ '+XAR(n);if(n<=0){clearInterval(iv);tx.textContent='(اختفت الجملة… اكتبيها الآن ✍️)';tx.classList.add('xhidden');cnt.textContent='';ta.disabled=false;ta.focus();}},1000);ta.oninput=e=>set(e.target.value);break;}}}

/* ---------- التصحيح ---------- */
function exGrade(it,v){const m=it.m||1;const R=(got,c,g)=>({got:Math.round(got*2)/2,max:m,c,g,q:it.q||it.text||''});
 switch(it.t){
 case 'tf':{const g=v===null?'—':v==='1'?'✓':'✗';return R(v!==null&&(v==='1')===!!it.a?m:0,it.a?'✓':'✗',g);}
 case 'mcq':{const k=v===null?-1:+v;return R(k===it.a?m:0,it.o[it.a],k>=0?it.o[k]:'—');}
 case 'match':{const map=v||{};let ok=0;it.pairs.forEach((p,k)=>{if(map[k]===k)ok++;});return R(m*ok/it.pairs.length,it.pairs.map(p=>p[0]+' ← '+p[1]).join(' ؛ '),it.pairs.map((p,k)=>p[0]+' ← '+(map[k]!==undefined?it.pairs[map[k]][1]:'—')).join(' ؛ '));}
 case 'fill':{const map=v||{};let ok=0;it.items.forEach((x,k)=>{if(xnorm(map[k])===xnorm(x[1]))ok++;});return R(m*ok/it.items.length,it.items.map(x=>x[1]).join(' ، '),it.items.map((x,k)=>map[k]||'—').join(' ، '));}
 case 'sort':{const map=v||{};let ok=0;it.items.forEach((x,k)=>{if(map[k]===x[1])ok++;});return R(m*ok/it.items.length,it.items.map(x=>x[0]+' ← '+it.bins[x[1]]).join(' ؛ '),it.items.map((x,k)=>x[0]+' ← '+(map[k]!==undefined?it.bins[map[k]]:'—')).join(' ؛ '));}
 case 'order':{const arr=v||[];let ok=0;it.seq.forEach((s,k)=>{if(arr[k]===k)ok++;});return R(m*ok/it.seq.length,it.seq.join(' ← '),arr.length?arr.map(k=>it.seq[k]).join(' ← '):'—');}
 case 'label':{const map=v||{};let ok=0;it.targets.forEach((t,k)=>{if(map[k]===t.c)ok++;});return R(m*ok/it.targets.length,it.targets.map(t=>t.n+': '+it.chips[t.c]).join(' ؛ '),it.targets.map((t,k)=>t.n+': '+(map[k]!==undefined?it.chips[map[k]]:'—')).join(' ؛ '));}
 case 'extract':{const w=v?xstrip(v):'';const ok=!!w&&(xRule(it.rule,w)||(it.accept||[]).map(xnorm).includes(xnorm(w)));const sec=EX.sec.find(x=>x.items.includes(it));const ex=(it.accept&&it.accept[0])||xFirstMatch(sec&&sec.text,it.rule)||'';return R(ok?m:0,'مثال: '+ex,w||'—');}
 case 'short':{const txt=xnorm(v||'');const keys=(it.keys||[]).map(xnorm);const hit=keys.filter(k=>k&&txt.includes(k)).length;const need=Math.max(1,Math.ceil(keys.length/2));const frac=!keys.length?(txt.length>2?1:0):Math.min(1,hit/need);return R(m*frac,it.a,v||'—');}
 case 'num':case 'word':{const g=v?parseInt(v,10):NaN;return R(g===it.ans?m:0,XAR(it.ans)+(it.why?' ('+it.why+')':''),v?XAR(v):'—');}
 case 'dictation':{const want=xnorm(it.text).split(' ').filter(Boolean),got=xnorm(v||'').split(' ').filter(Boolean);let ok=0;const used=new Set();want.forEach(w=>{const i=got.findIndex((g,idx)=>!used.has(idx)&&g===w);if(i>=0){used.add(i);ok++;}});return R(m*ok/Math.max(1,want.length),it.text,v||'—');}
 default:return R(0,'',v||'—');}}
function exSubmit(auto){if(!EX.on)return;if(!auto){const empty=EX.ans.flat().filter(a=>a===null||a===''||(typeof a==='object'&&!Array.isArray(a)&&!Object.keys(a).length)||(Array.isArray(a)&&!a.length)).length;if(empty&&!confirm(`تركتِ ${XAR(empty)} من الأسئلة بلا إجابة. تسلّمين الورقة؟`))return;}
 clearInterval(EX.timer);EX.on=false;
 const total=EX.sec.reduce((a,s)=>a+s.marks,0);let mark=0,stars=0;const rows=[];
 EX.sec.forEach((s,si)=>s.items.forEach((it,ii)=>{const r=exGrade(it,EX.ans[si][ii]);mark+=r.got;if(r.got>=r.max)stars++;const Lname=EXAM_CFG.lessonName(it.L);rows.push(Object.assign(r,{ok:r.got>=r.max,tag:Lname,type:it.t}));}));
 mark=Math.round(mark*2)/2;
 const attempt={d:new Date().toISOString(),k:EX.kind,pid:EX.pid||null,pn:EX.pname||null,short:EX.short,m:mark,max:total,stars,missed:rows.filter(r=>!r.ok).map(r=>({q:r.q.slice(0,120),c:String(r.c).slice(0,140),g:String(r.g).slice(0,140),tag:r.tag,type:r.type}))};
 if(!Array.isArray(ST.exams))ST.exams=[];ST.exams.push(attempt);save();
 EX.last={rows,mark,total,stars};exCelebrate(mark,total,stars);}
function exShowCorrected(rows,mark,total,stars){const wrong=rows.filter(r=>!r.ok);
 stage.innerHTML=`<div class="xpaper"><div class="xtitle">📄 الورقة المصحّحة · الدرجة: <b>${XAR(mark)}</b> / ${XAR(total)}</div>
  ${wrong.length?`<p style="font-size:14px;color:#5B6B85;margin:6px 0 10px">هذه الأسئلة راجعيها مع ماما (إجابتكِ ← الصحيح):</p>`+wrong.map(r=>`<div class="xwrong"><div class="xq">${xesc(r.q)}</div><div class="xgiven">✗ إجابتكِ: ${xesc(r.g)}</div><div class="xcorrect">✓ الصحيح: ${xesc(r.c)}</div><div class="xtagl">📚 ${xesc(r.tag)}</div></div>`).join(''):`<p style="font-size:17px;text-align:center;margin:14px 0">كل الإجابات صحيحة! 🌟 ورقة كاملة!</p>`}
  <div style="text-align:center;margin-top:14px"><button class="go" onclick="goMap()">الخريطة 🏡</button> <button onclick="exLog()" style="font-size:14px">📊 السجل</button></div></div>`;window.scrollTo({top:0});}
function exCelebrate(mark,total,stars){if(stars>0)addStar(stars);try{applause(mark>=total*0.75);tada();confetti();}catch(e){}const wrongN=(EX.last&&EX.last.rows)?EX.last.rows.filter(r=>!r.ok).length:0;
 const pct=mark/total;const msg=pct>=0.9?'ممتازة يا ماريا! ورقة تفتخر بها 🏆':pct>=0.7?'أحسنتِ يا ماريا! نتيجة جميلة 🌟':pct>=0.5?'جيدة! راجعي الأسئلة المصحّحة وستكونين أفضل 💪':'لا بأس يا بطلة، المراجعة مع ماما ستصنع الفرق 🌱';
 stage.innerHTML=`<div class="card"><div class="big">🎉📝</div><h1>${XAR(mark)} من ${XAR(total)}</h1><p class="sub">${msg}</p><p class="sub">⭐ كسبتِ ${XAR(stars)} ${stars===1?'نجمة':stars===2?'نجمتين':stars<=10?'نجوم':'نجمة'} (نجمة لكل إجابة صحيحة)</p>
  <button class="go" onclick="exShowCorrected(EX.last.rows,EX.last.mark,EX.last.total,EX.last.stars)">${wrongN?'شاهدي الورقة المصحّحة ('+XAR(wrongN)+') 📄':'شاهدي الورقة 📄'}</button><div style="height:8px"></div><button onclick="goMap()">الخريطة 🏡</button> <button onclick="exLog()" style="font-size:14px">📊 السجل</button></div>`;window.scrollTo({top:0});}

/* ---------- سجل الاختبارات (لوليّ الأمر) ---------- */
function exLog(){document.getElementById('backB').style.visibility='visible';if(typeof cur!=='undefined')cur=-1;if(typeof curLesson!=='undefined')curLesson=-1;
 const A=(ST.exams||[]).slice().reverse();const byTag={};(ST.exams||[]).forEach(a=>(a.missed||[]).forEach(mi=>{const t=byTag[mi.tag]=byTag[mi.tag]||{n:0,qs:[]};t.n++;if(t.qs.length<3&&!t.qs.some(q=>q.q===mi.q))t.qs.push(mi);}));
 const tags=Object.entries(byTag).sort((a,b)=>b[1].n-a[1].n).slice(0,8);
 const fmt=d=>{try{const x=new Date(d);return XAR(x.getDate())+'/'+XAR(x.getMonth()+1)+' '+XAR(String(x.getHours()).padStart(2,'0'))+':'+XAR(String(x.getMinutes()).padStart(2,'0'));}catch(e){return '';}};
 stage.innerHTML=`${chip('📊 سجل الاختبارات · لوليّ الأمر')}<div class="card" style="text-align:right">
  <h2 style="text-align:center">📊 سجل اختبارات ماريا · ${EXAM_CFG.subject}</h2>
  ${A.length?`<table class="xlog"><tr><th>التاريخ</th><th>الاختبار</th><th>الدرجة</th><th>أخطاء</th></tr>${A.map(a=>`<tr><td>${fmt(a.d)}</td><td>${a.pn||exKindName(a.k)}${a.short?' (قصير)':''}</td><td><b>${XAR(a.m)}</b>/${XAR(a.max)}</td><td>${XAR((a.missed||[]).length)}</td></tr>`).join('')}</table>`:'<p class="sub" style="text-align:center">لا توجد محاولات بعد. ابدئي أول اختبار تجريبي من الخريطة 📝</p>'}
  ${tags.length?`<h3 style="margin:16px 0 6px">🔎 أكثر ما تحتاج مراجعته (حسب عدد الأخطاء)</h3>${tags.map(([t,v])=>`<div class="xtagbox"><b>${xesc(t)}</b> <span style="color:#9A3B3B;font-weight:800">✗ ${XAR(v.n)}</span>${v.qs.map(q=>`<div class="xtagq">• ${xesc(q.q)}<br><span style="color:#227A63">✓ ${xesc(q.c)}</span></div>`).join('')}</div>`).join('')}`:''}
  <div style="text-align:center;margin-top:14px"><button class="go" onclick="goMap()">الخريطة 🏡</button> ${A.length?`<button onclick="if(confirm('تمسحين سجل الاختبارات؟ (لا يؤثر في النجوم والدروس)')){ST.exams=[];save();exLog();}" style="font-size:12px">مسح السجل</button>`:''}</div></div>`;window.scrollTo({top:0});}
