<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ألعاب ماريا 🌟</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:'Baloo Bhaijaan 2','Segoe UI',Tahoma,sans-serif;
 background:linear-gradient(180deg,#E6F0FC 0%,#F7FAEE 100%);color:#2B3A55;
 display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
h1{font-size:34px;margin:0 0 6px}
p.sub{color:#5B6B85;font-size:16px;margin:0 0 28px}
.games{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;width:100%;max-width:640px}
a.game{flex:1 1 240px;max-width:290px;text-decoration:none;color:inherit;background:#fff;border-radius:24px;
 padding:26px 18px;box-shadow:0 6px 18px rgba(43,58,85,.12);border:3px solid transparent;transition:transform .15s}
a.game:active{transform:scale(.97)}
a.maths{border-color:#7FB3E6}
a.science{border-color:#4E9B57}
.big{font-size:56px;margin-bottom:8px}
a.game h2{font-size:22px;margin:0 0 4px}
a.game small{color:#5B6B85;font-size:14px;font-weight:600}
footer{margin-top:34px;color:#93A0B7;font-size:12.5px}
</style>
</head>
<body>
<h1>أهلًا يا ماريا! 🌟</h1>
<p class="sub">اختاري لُعبتكِ</p>
<div class="games">
 <a class="game maths" href="maths/">
  <div class="big">🏙️🔢</div>
  <h2>برج ماريا</h2>
  <small>الرِّياضيَّات · الصَّفّ الثَّالث</small>
 </a>
 <a class="game science" href="science/">
  <div class="big">🔬🌱</div>
  <h2>مُغامرة العالمة ماريا</h2>
  <small>العُلوم · الصَّفّ الثَّالث</small>
 </a>
</div>
<footer>الفصل الدِّراسيّ الأوَّل · بالتَّوفيق يا بطلة! 💛</footer>
</body>
</html>
