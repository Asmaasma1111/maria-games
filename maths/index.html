<html lang="ar" dir="rtl">
<head>

<style>
:root{--paper:#F5F7FB;--card:#fff;--ink:#2B3A55;--blue:#3F7CC9;--blueD:#2C5E9E;--sun:#F5C544;--rose:#EF7FA8;--mint:#4EB39A;--line:#D9E2EF;--violet:#7A63C9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Baloo Bhaijaan 2','Segoe UI',Tahoma,sans-serif;background:linear-gradient(180deg,#E6F0FC 0%,var(--paper) 40%);color:var(--ink);min-height:100vh}
#app{max-width:640px;margin:0 auto;padding:12px 14px 60px}
#top{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:18px;padding:8px 14px;box-shadow:0 3px 0 var(--line);margin-bottom:12px;font-weight:800;color:var(--blueD)}
#top button{border:none;background:#EEF3FA;border-radius:12px;padding:6px 14px;font-size:15px}
.chip{display:inline-block;background:var(--blue);color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:3px 14px;margin-bottom:10px}
.chip.prep{background:var(--mint)}.chip.think{background:var(--violet)}
.card{background:var(--card);border-radius:24px;padding:20px 18px;box-shadow:0 4px 0 var(--line);text-align:center}
h1{font-size:24px;margin:6px 0 4px}h2{font-size:20px;margin:4px 0 12px;line-height:1.5}
p.sub{margin:0 0 12px;font-size:15px;color:#5B6B85;line-height:1.7}
.big{font-size:48px;margin:2px 0}
button{font-family:inherit;font-weight:800;font-size:17px;color:var(--ink);background:#EEF3FA;border:2px solid var(--line);border-radius:18px;padding:12px 16px;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.96)}
.go{background:var(--blue);border-color:var(--blueD);color:#fff;font-size:18px;padding:12px 30px;box-shadow:0 4px 0 var(--blueD)}
.go:disabled{opacity:.4;box-shadow:none}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.opts button.ok,.kb .ok{background:#DDF3EC;border-color:var(--mint);color:#227A63}
.opts button.bad,.pool button.bad{background:#FBE3E3;border-color:#E39B9B;color:#9B3B3B}
.locked{pointer-events:none}
.wrong{animation:wig .35s}@keyframes wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.hintPulse{animation:pul 1s infinite}@keyframes pul{50%{box-shadow:0 0 0 6px rgba(245,197,68,.45)}}
.qbox{background:#F4F8FD;border:2px solid var(--line);border-radius:18px;padding:14px;font-size:19px;line-height:1.8;margin-bottom:12px}
.expr{font-size:34px;font-weight:800;letter-spacing:1px;color:var(--blueD);direction:rtl;unicode-bidi:isolate;margin:6px 0}
.ans{background:#FFF9E3;border:2px solid var(--sun);border-radius:18px;padding:12px;font-size:16px;line-height:1.8;margin:12px 0;display:none;text-align:right}
.ans.show{display:block}
.marks{display:none;gap:10px;justify-content:center;flex-wrap:wrap}.marks.show{display:flex}
/* keypad */
.disp{font-size:38px;font-weight:800;min-height:56px;background:#fff;border:3px solid var(--blue);border-radius:16px;margin:8px auto;max-width:260px;color:var(--blueD);letter-spacing:3px}
.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:8px auto}
.kb button{font-size:24px;padding:10px 0}
.kb .del{background:#FBE3E3;border-color:#E39B9B}.kb .chk{background:var(--blue);color:#fff;border-color:var(--blueD)}
/* map */
.uhead{margin:20px 4px 8px;font-size:18px;font-weight:800;color:var(--blueD)}
.lrow{background:var(--card);border-radius:18px;box-shadow:0 3px 0 var(--line);padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.lrow.done{background:#EDF7F3;box-shadow:0 3px 0 #BFE3D7}
.lno{width:40px;height:40px;border-radius:50%;background:#EEF3FA;color:var(--blueD);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.lrow.done .lno{background:var(--mint);color:#fff}
.tick{position:absolute;top:-8px;right:-8px;background:var(--sun);color:#5A4300;border-radius:50%;width:22px;height:22px;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.lt{flex:1;text-align:right}.lt b{font-size:15px;display:block;line-height:1.35}.lt small{color:#7B8AA3;font-weight:700;font-size:12px}
.lbtns{display:flex;flex-direction:column;gap:5px}
.lbtns button{font-size:12.5px;padding:6px 10px;border-radius:12px;white-space:nowrap}
.bprep{background:#E4F4EF;border-color:#BFE3D7;color:#227A63}.bprep.done{background:#CFEDE3;border-color:var(--mint)}
.btest{background:#FFF3D6;border-color:#F0DBA0;color:#9A7A17}.btest.done{background:#DDF3EC;border-color:var(--mint);color:#227A63}
.bthink{background:#F0ECFA;border-color:#D9CCEC;color:var(--violet)}.bthink.done{background:#E3DCF5;border-color:var(--violet)}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.slot{min-width:64px;min-height:48px;border:2px dashed #C3D0E3;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#AFBBD0;padding:4px 8px}
.slot.fill{border-style:solid;border-color:var(--mint);background:#DDF3EC;color:#227A63}
.arrow{align-self:center;color:#AFBBD0}
.pbar{height:8px;background:#E9EEF6;border-radius:99px;margin:0 0 12px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .4s}
#ovl{position:fixed;inset:0;background:rgba(43,58,85,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#ovl.show{display:flex}#ovl .inner{background:var(--card);border-radius:28px;padding:28px 22px;text-align:center;max-width:420px;animation:pop .45s}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.conf{position:fixed;font-size:24px;z-index:60;animation:fall 1.6s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.2}}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) scale(.6);background:var(--mint);color:#fff;font-weight:800;font-size:19px;padding:10px 26px;border-radius:999px;box-shadow:0 6px 0 #227A63;z-index:70;opacity:0;pointer-events:none;transition:all .25s}
#toast.show{opacity:1;transform:translateX(-50%) scale(1)}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.shop button{font-size:14px;padding:10px 8px;line-height:1.5}
.shop button.owned{background:#DDF3EC;border-color:var(--mint);color:#227A63}
.an-float{animation:fl 4s ease-in-out infinite alternate}@keyframes fl{to{transform:translateY(-14px)}}
.an-wave{transform-box:fill-box;transform-origin:left center;animation:wv 1.4s ease-in-out infinite alternate}@keyframes wv{from{transform:skewY(-6deg)}to{transform:skewY(6deg)}}
.an-twinkle{animation:tw 2s ease-in-out infinite alternate}@keyframes tw{to{opacity:.2}}
.an-tail{transform-box:fill-box;transform-origin:left bottom;animation:tl 1.6s ease-in-out infinite alternate}@keyframes tl{from{transform:rotate(-12deg)}to{transform:rotate(18deg)}}
@media (prefers-reduced-motion:reduce){[class^="an-"]{animation:none}}
footer{text-align:center;font-size:12px;color:#93A0B7;margin-top:26px}footer button{border:none;background:none;color:#B9C3D6;font-size:11px;text-decoration:underline}
.credit{margin-top:10px;font-size:12px;color:#93A0B7;font-weight:600}.credit a{color:#0A66C2;text-decoration:none}</style>
</head>

<script>
/* ============ helpers ============ */
const A=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const round=(n,to)=>Math.floor(n/to+.5)*to;
const NAMES=['ماريا','سارة','نورة','أحمد','رغد','خالد'];
const THINGS=[['قلمًا','أقلام'],['تمرةً','تمرات'],['بالونًا','بالونات'],['كتابًا','كتُب'],['ورقةً','ورقات'],['حلوى','حلوى']];
const thing=n=>{const t=pick(THINGS);return n>10||n<3?t[0]:t[1];};

/* ============ generators ============ */
function gPattern(kind){
 const step=pick(kind==='try'?[5,10]:[2,3,4,5,10,25,100]),start=step*rnd(1,8);
 const seq=[0,1,2,3].map(i=>start+i*step);
 if(kind==='think')return {t:'mcq',q:`ما القاعدة؟<div class="expr">${seq.map(A).join(' ، ')} ، …</div>`,o:shuffle([`نُضيف ${A(step)}`,`نُضيف ${A(step+1)}`,`نطرح ${A(step)}`]),c:`نُضيف ${A(step)}`,why:`من ${A(seq[0])} إلى ${A(seq[1])} زاد ${A(step)}.`};
 return {t:'num',q:`ما العدد التَّالي؟<div class="expr">${seq.map(A).join(' ، ')} ، ◯</div>`,ans:start+4*step,why:`نُضيف ${A(step)} كلّ مرَّة.`};
}
function gSteps(kind){
 if(kind!=='think'&&Math.random()<.5)return {t:'order',q:'رتِّبي خُطُوات حلّ المسألة.',seq:['أفهم','أُخطِّط','أحُلّ','أتحقَّق']};
 const n=pick(NAMES),a=rnd(6,15),b=rnd(2,5);
 return {t:'mcq',q:`عند ${n} ${A(a)} ${thing(a)}، أعطت ${A(b)} لأُختها. كم بقي؟<br><small>ما الخُطوة في «أُخطِّط»؟</small>`,o:shuffle(['أطرح','أجمع','أضرب']),c:'أطرح',why:`أعطت = نقص ← نطرح: ${A(a)} − ${A(b)} = ${A(a-b)}`};
}
const PLACES=['الآحاد','العشرات','المئات','الآلاف','عشرات الآلاف'];
function distinct(d){let s;do{s=String(rnd(Math.pow(10,d-1),Math.pow(10,d)-1));}while(new Set(s).size<d||s.includes('0'));return +s;}
function gPlace(d){return kind=>{
 const n=distinct(d),s=String(n),p=rnd(0,d-1),dig=+s[d-1-p];
 const m=kind==='think'?2:rnd(0,1);
 if(m===0)return {t:'num',q:`ما الرَّقم في منزلة ${PLACES[p]}؟<div class="expr">${A(n)}</div>`,ans:dig,why:`من اليمين: آحاد، عشرات، مئات …`};
 if(m===1)return {t:'num',q:`ما قيمة الرَّقم ${A(dig)}؟<div class="expr">${A(n)}</div>`,ans:dig*Math.pow(10,p),why:`${A(dig)} في منزلة ${PLACES[p]} = ${A(dig*Math.pow(10,p))}`};
 const parts=[...s].map((c,i)=>+c*Math.pow(10,d-1-i)),ok=parts.map(A).join(' + ');
 const bad1=parts.map((v,i)=>i===0?v/10:v).map(A).join(' + '),bad2=[...s].map(A).join(' + ');
 return {t:'mcq',q:`الصِّيغة التَّحليليَّة؟<div class="expr">${A(n)}</div>`,o:shuffle([ok,bad1,bad2]),c:ok,why:'كلّ رقم × قيمة منزلته.'};};}
function gCompare(d){return kind=>{let a=rnd(Math.pow(10,d-1),Math.pow(10,d)-1),b;
 b=kind==='try'?rnd(Math.pow(10,d-1),Math.pow(10,d)-1):Math.max(1,a+pick([-1,1,-10,10,-100,100,0,rnd(-50,50)]));
 return {t:'cmp',a,b};};}
function gOrder(kind){const d=kind==='try'?3:pick([3,4,5]);const base=rnd(Math.pow(10,d-1),Math.pow(10,d)-200);
 let nums=new Set();while(nums.size<4)nums.add(base+rnd(0,150));nums=[...nums];const asc=Math.random()<.6;
 const sorted=nums.slice().sort((x,y)=>asc?x-y:y-x);
 return {t:'order',q:asc?'رتِّبي من الأصغر إلى الأكبر ⬆':'رتِّبي من الأكبر إلى الأصغر ⬇',seq:sorted.map(A)};}
function gRound(tos){return kind=>{const to=pick(tos),n=rnd(to,to*(to===1000?9:to===100?90:99));
 const name=to===10?'عشرة':to===100?'مئة':'ألف';
 return {t:'num',q:`قرِّبي إلى أقرب ${name}<div class="expr">${A(n)}</div>`,ans:round(n,to),why:`ننظر إلى الرَّقم على يمين المنزلة: ٥ أو أكثر ← نزيد.`};};}
function gAddProp(kind){const a=rnd(2,9),b=rnd(2,9),c=rnd(2,9);const m=rnd(0,2);
 if(kind==='try'||m===0){const cases=[[`${A(a)} + ${A(b)} = ${A(b)} + ${A(a)}`,'الإبدال'],[`${A(a)} + ٠ = ${A(a)}`,'العُنصر المُحايد (الصِّفر)'],[`(${A(a)} + ${A(b)}) + ${A(c)} = ${A(a)} + (${A(b)} + ${A(c)})`,'التَّجميع']];const k=pick(cases);
  return {t:'mcq',q:`ما الخاصِّيَّة؟<div class="expr">${k[0]}</div>`,o:shuffle(cases.map(x=>x[1])),c:k[1],why:k[1]==='الإبدال'?'تغيير التَّرتيب لا يُغيِّر النَّاتج.':k[1].startsWith('العُنصر')?'أيّ عدد + ٠ = العدد نفسه.':'تغيير التَّجميع لا يُغيِّر النَّاتج.'};}
 if(m===1)return {t:'num',q:`ما العدد المجهول؟<div class="expr">${A(a)} + ${A(b)} = ${A(b)} + ◯</div>`,ans:a,why:'خاصِّيَّة الإبدال.'};
 return {t:'num',q:`ما العدد المجهول؟<div class="expr">${A(a*10)} + ◯ = ${A(a*10)}</div>`,ans:0,why:'الصِّفر عُنصر مُحايد.'};}
function gEst(op){return kind=>{const d=kind==='try'?2:pick([2,3]),to=d===2?10:100;let a=rnd(Math.pow(10,d-1),Math.pow(10,d)-1),b=rnd(Math.pow(10,d-1),Math.pow(10,d)-1);
 if(op==='-'&&a<b)[a,b]=[b,a];const ra=round(a,to),rb=round(b,to),ans=op==='+'?ra+rb:ra-rb;
 return {t:'num',q:`قدِّري (قرِّبي إلى أقرب ${to===10?'عشرة':'مئة'})<div class="expr">${A(a)} ${op==='+'?'+':'−'} ${A(b)} ≈ ؟</div>`,ans,why:`${A(ra)} ${op==='+'?'+':'−'} ${A(rb)} = ${A(ans)}`};};}
const EXACT=[['ثمن المُشتريات لتدفع أُمُّكِ في المتجر','دقيق'],['تقريبًا كم شخصًا في الملعب؟','تقديريّ'],['عدد المقاعد الَّتي نحتاجها لكُلّ الضُّيوف','دقيق'],['هل يكفي ٥٠ ريالًا لشراء شيئين؟','تقديريّ'],['درجاتكِ في الاختبار','دقيق'],['كم وقتًا تقريبًا نحتاج للوُصول؟','تقديريّ']];
function gExact(){const k=pick(EXACT);return {t:'mcq',q:`جواب دقيق أم تقديريّ؟<br><b>${k[0]}</b>`,o:['دقيق','تقديريّ'],c:k[1],why:k[1]==='دقيق'?'نحتاج العدد بالضَّبط.':'«تقريبًا» أو «هل يكفي» ← تقدير.'};}
function gAdd(d,regroup){return kind=>{let a,b;do{a=rnd(Math.pow(10,d-1),Math.pow(10,d)-1);b=rnd(Math.pow(10,d-1),Math.pow(10,d)-1);}while(regroup===false&&(a%10+b%10>9||(d>2&&Math.floor(a/10)%10+Math.floor(b/10)%10>9)));
 if(kind==='think'){const n=pick(NAMES);return {t:'num',q:`عند ${n} ${A(a)} ريالًا، وحصلت على ${A(b)} ريالًا. كم صار معها؟`,ans:a+b,why:`${A(a)} + ${A(b)} = ${A(a+b)}`};}
 return {t:'num',q:`<div class="expr">${A(a)} + ${A(b)} = ؟</div>`,ans:a+b,why:`نبدأ بالآحاد. النَّاتج ${A(a+b)}`};};}
function gSub(d,mode){return kind=>{let a,b;
 do{a=rnd(Math.pow(10,d-1),Math.pow(10,d)-1);b=rnd(Math.pow(10,d-1),a-1);
  if(mode==='zeros')a=pick(d===3?[300,400,500,600,700,800,900,405,603,702,806]:[30,40,50,60,70,80,90]);
 }while(b>=a||(mode==='no'&&(a%10<b%10||(d>2&&Math.floor(a/10)%10<Math.floor(b/10)%10)))||(mode==='re'&&a%10>=b%10));
 if(kind==='think'){const n=pick(NAMES);return {t:'num',q:`كان عند ${n} ${A(a)} ${thing(a)}، أعطت ${A(b)}. كم بقي؟`,ans:a-b,why:`${A(a)} − ${A(b)} = ${A(a-b)}`};}
 return {t:'num',q:`<div class="expr">${A(a)} − ${A(b)} = ؟</div>`,ans:a-b,why:mode==='no'?`النَّاتج ${A(a-b)}`:`نُعيد التَّجميع من المنزلة المُجاورة. النَّاتج ${A(a-b)}`};};}
function gReasonable(kind){const a=rnd(120,480),b=rnd(110,400),ok=Math.random()<.5,claim=ok?a+b:a+b+pick([100,200,-100,300]);
 return {t:'mcq',q:`قال زميلكِ:<div class="expr">${A(a)} + ${A(b)} = ${A(claim)}</div>هل الجواب معقول؟`,o:['نعم','لا'],c:ok?'نعم':'لا',why:`التَّقدير: ${A(round(a,100))} + ${A(round(b,100))} = ${A(round(a,100)+round(b,100))}، والنَّاتج الصَّحيح ${A(a+b)}.`};}
function gChooseOp(kind){const n=pick(NAMES),a=rnd(12,60),b=rnd(5,11),add=Math.random()<.5;
 const q=add?`عند ${n} ${A(a)} ${thing(a)}، وأخذت ${A(b)} أُخرى. كم صار معها؟`:`عند ${n} ${A(a)} ${thing(a)}، ضاع منها ${A(b)}. كم بقي؟`;
 if(kind==='think')return {t:'num',q,ans:add?a+b:a-b,why:`${A(a)} ${add?'+':'−'} ${A(b)} = ${A(add?a+b:a-b)}`};
 return {t:'mcq',q:q+'<br><small>ما العمليَّة؟</small>',o:['جمع','طرح'],c:add?'جمع':'طرح',why:add?'«أخذت أُخرى» = زاد ← جمع.':'«ضاع» = نقص ← طرح.'};}
function gridSvg(r,c){let s=`<svg viewBox="0 0 ${c*34} ${r*34}" width="${Math.min(300,c*34)}" style="display:block;margin:6px auto">`;for(let i=0;i<r;i++)for(let j=0;j<c;j++)s+=`<circle cx="${j*34+17}" cy="${i*34+17}" r="12" fill="#3F7CC9"/>`;return s+'</svg>';}
function gArray(kind){const r=rnd(2,5),c=rnd(2,6);
 if(kind==='think'||Math.random()<.4){const ok=`${A(r)} × ${A(c)} = ${A(r*c)}`;return {t:'mcq',q:`أيّ جُملة ضرب تُمثِّل الشَّبكة؟${gridSvg(r,c)}`,o:shuffle([ok,`${A(r)} + ${A(c)} = ${A(r+c)}`,`${A(r+1)} × ${A(c)} = ${A((r+1)*c)}`]),c:ok,why:`${A(r)} صُفوف × ${A(c)} في كلّ صفّ.`};}
 return {t:'num',q:`كم دائرةً؟${gridSvg(r,c)}<div class="expr">${A(r)} × ${A(c)} = ؟</div>`,ans:r*c,why:`${A(r)} صُفوف، في كلّ صفّ ${A(c)}.`};}
function gMul(n){return kind=>{const a=kind==='try'?rnd(1,5):rnd(0,10);
 if(kind==='think'){const nm=pick(NAMES);return {t:'num',q:`عند ${nm} ${A(a||2)} عُلب، في كلّ عُلبة ${A(n)} ${thing(n)}. كم المجموع؟`,ans:(a||2)*n,why:`${A(a||2)} × ${A(n)} = ${A((a||2)*n)}`};}
 if(Math.random()<.3&&a>0)return {t:'num',q:`ما العامل المجهول؟<div class="expr">◯ × ${A(n)} = ${A(a*n)}</div>`,ans:a,why:`${A(a)} × ${A(n)} = ${A(a*n)}`};
 return {t:'num',q:`<div class="expr">${A(a)} × ${A(n)} = ؟</div>`,ans:a*n,why:`${A(n)} مُتكرِّر ${A(a)} مرَّات = ${A(a*n)}`};};}

function gMulPattern(kind){const n=pick([3,6,7,8,9]),k=rnd(1,5),seq=[0,1,2,3].map(i=>n*(k+i));

 return {t:'num',q:`<div class="expr">(${A(a)} × ${A(b)}) × ${A(c)} = ؟</div>`,ans:a*b*c,why:`${A(a*b)} × ${A(c)} = ${A(a*b*c)}`};}

const PROF_KEY='maria_games_profile';let PROFILE=null;try{PROFILE=JSON.parse(localStorage.getItem(PROF_KEY)||'null');}catch(e){}
function profName(){return (PROFILE&&PROFILE.name)||'ماريا';}
function profSuffix(){return PROFILE&&PROFILE.name&&PROFILE.name!=='ماريا'?'::'+PROFILE.name:'';}
function profURL(){return '/progress?u='+encodeURIComponent(profName());}
function profSub(v){const n=profName();return n==='ماريا'?v:String(v).replace(/ماريا/g,n);}
(function(){try{const d=Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML');const hook=el=>{if(!el)return;Object.defineProperty(el,'innerHTML',{set(v){d.set.call(this,profSub(v));},get(){return d.get.call(this);},configurable:true});};hook(document.getElementById('stage'));hook(document.querySelector('#ovl .inner'));
 const td=Object.getOwnPropertyDescriptor(Node.prototype,'textContent');const t=document.getElementById('toast');if(t)Object.defineProperty(t,'textContent',{set(v){td.set.call(this,profSub(v));},get(){return td.get.call(this);},configurable:true});document.title=profSub(document.title);}catch(e){}})();
function profKnown(base){const names=new Set();try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(base+'::'))names.add(k.slice(base.length+2));}if(localStorage.getItem(base))names.add('ماريا');}catch(e){}if(PROFILE&&PROFILE.name)names.add(PROFILE.name);return [...names];}
function profAsk(change){document.getElementById('backB').style.visibility=change?'visible':'hidden';const known=profKnown(SKEY_BASE);const cur=PROFILE?PROFILE.name:'';
 stage.innerHTML=`<div class="card"><div class="big">👧✨</div><h1 style="font-size:22px">${change?'تغيير الاسم':'أهلًا بكِ يا بطلة!'}</h1>
  <p class="sub">${change?'اكتبي اسمًا جديدًا، أو اختاري اسمًا محفوظًا على هذا الجهاز. لكل اسم تقدّمه ونجومه الخاصة.':'اكتبي اسمكِ مرة واحدة فقط؛ سيبقى محفوظًا على هذا الجهاز، وتُكملين دائمًا من حيث توقّفتِ.'}</p>
  <input id="pname" maxlength="20" placeholder="اسمكِ هنا…" value="${cur.replace(/"/g,'')}" style="font-family:inherit;font-size:22px;font-weight:800;text-align:center;width:100%;max-width:320px;border:2px solid #C9D2DE;border-radius:16px;padding:10px 14px;margin:6px 0 10px;background:#fff">
  ${known.length?`<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px">${known.map(n=>`<button style="font-size:14px;padding:6px 14px" onclick="document.getElementById('pname').value=${JSON.stringify(n)}">👧 ${n}</button>`).join('')}</div>`:''}
  <button class="go" onclick="profSave()">${change?'احفظي ✔':'هيا نبدأ ✨'}</button>${change?'<div style="height:8px"></div><button onclick="goMap()">رجوع</button>':''}</div>`;
 const inp=document.getElementById('pname');inp.onkeydown=e=>{if(e.key==='Enter')profSave();};if(!change)setTimeout(()=>inp.focus(),200);window.scrollTo({top:0});}
function profSave(){const inp=document.getElementById('pname');const n=(inp.value||'').trim().replace(/\s+/g,' ');if(!n){inp.classList.add('wrong');inp.style.borderColor='#E39B9B';setTimeout(()=>inp.classList.remove('wrong'),400);return;}
 PROFILE={name:n,d:new Date().toISOString()};try{localStorage.setItem(PROF_KEY,JSON.stringify(PROFILE));}catch(e){}location.reload();}
function profBoot(){if(PROFILE){goMap();serverLoad();}else profAsk(false);}

let ST={stars:0,before:[],after:[],think:[],bought:[]};
function load(){try{const s=localStorage.getItem(SKEY());if(s)ST={...ST,...JSON.parse(s)};}catch(e){}}
function save(){try{localStorage.setItem(SKEY(),JSON.stringify(ST));}catch(e){}serverSave();}
let __sv=null;
function serverSave(){clearTimeout(__sv);__sv=setTimeout(()=>{try{fetch(profURL(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(ST)}).catch(()=>{});}catch(e){}},250);}
function mergeST(a,b){const u=(x,y)=>Array.from(new Set([...(x||[]),...(y||[])]));const m={...a,...b};m.stars=Math.max(+a.stars||0,+b.stars||0);['before','after','think','bought'].forEach(k=>m[k]=u(a[k],b[k]));m.exams=exMergeAttempts(a.exams,b.exams);return m;}
function serverLoad(){try{fetch(profURL()).then(r=>r.ok?r.json():null).then(j=>{if(!j||typeof j!=='object'||Array.isArray(j))return;ST=mergeST(ST,j);try{localStorage.setItem(SKEY(),JSON.stringify(ST))}catch(e){};drawStars();applySound();if(cur===-1)goMap();}).catch(()=>{});}catch(e){}}
function sndOn(){return ST.sound!==false;}
function applySound(){const b=document.getElementById('sndB');if(b)b.textContent=sndOn()?'\u{1F50A}':'\u{1F507}';}

/* ============ sound ============ */
function ac(){return window.__ac||(window.__ac=new (window.AudioContext||window.webkitAudioContext)());}
function tone(f,t0,d,type,vol,dest){if(!sndOn())return;const C=ac();const o=C.createOscillator(),g=C.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+.02);g.gain.exponentialRampToValueAtTime(.0005,t0+d);o.connect(g);g.connect(dest||C.destination);o.start(t0);o.stop(t0+d+.05);}
function beepBad(){try{const C=ac();tone(200,C.currentTime,.25,'sine',.12);}catch(e){}}
function sparkle(){try{const C=ac(),t0=C.currentTime;[523,659,784,1047,1319].forEach((f,i)=>{tone(f,t0+i*.07,.4,'sine',.13);tone(f*2,t0+i*.07,.25,'sine',.035);});tone(2093,t0+.42,.6,'sine',.05);}catch(e){}}
function tada(){try{const C=ac(),t0=C.currentTime;const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;lp.connect(C.destination);const chord=(fs,t,d)=>fs.forEach(f=>{tone(f,t,d,'triangle',.085,lp);tone(f/2,t,d,'sine',.06,lp);});chord([523,659,784],t0,.34);chord([587,740,880],t0+.32,.34);chord([659,831,988],t0+.64,.4);chord([784,988,1175,1568],t0+1.0,1.3);[1568,1976,2349,3136].forEach((f,i)=>tone(f,t0+1.06+i*.08,.7,'sine',.05));}catch(e){}}
let __nz=null;function noiseBuf(){const C=ac();if(__nz)return __nz;const b=C.createBuffer(1,Math.floor(C.sampleRate*0.06),C.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);__nz=b;return b;}
function applause(big){if(!sndOn())return;try{const C=ac(),t0=C.currentTime;const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1700;const g=C.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(big?.55:.32,t0+.35);g.gain.setValueAtTime(big?.55:.32,t0+(big?1.7:.9));g.gain.exponentialRampToValueAtTime(.001,t0+(big?2.8:1.7));lp.connect(g);g.connect(C.destination);const n=big?80:40,dur=big?2.3:1.3;for(let k=0;k<n;k++){const s=C.createBufferSource();s.buffer=noiseBuf();const bp=C.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500+Math.random()*1900;bp.Q.value=.7;const cg=C.createGain();const at=t0+Math.random()*dur;cg.gain.setValueAtTime(.3+Math.random()*.3,at);cg.gain.exponentialRampToValueAtTime(.001,at+.1);s.connect(bp);bp.connect(cg);cg.connect(lp);s.start(at);}}catch(e){}}
function confetti(n){const em=['⭐','💙','🔢','✨','💛','🏙️'];for(let i=0;i<(n||18);i++){const s=document.createElement('span');s.className='conf';s.textContent=em[i%em.length];s.style.left=Math.random()*100+'vw';s.style.top='-30px';s.style.animationDelay=(Math.random()*.5)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2200);}}

function mulTable(l){const nm=l.name||'';const pre='\u0627\u0644\u0636\u0651\u064e\u0631\u0628 \u0641\u064a ';if(!nm.startsWith(pre))return '';const ch=nm.slice(pre.length);const n='\u0660\u0661\u0662\u0663\u0664\u0665\u0666\u0667\u0668\u0669'.indexOf(ch);if(n<2||n>9)return '';let rows='';for(let k=1;k<=10;k++)rows+=`<div style="background:#F4F8FD;border:2px solid var(--line);border-radius:10px;padding:6px 4px;font-weight:800;font-size:15px">${A(n)} \u00d7 ${A(k)} = ${A(n*k)}</div>`;return `<details style="margin:10px 0;text-align:right"><summary style="cursor:pointer;list-style:none;background:var(--sun);color:#5A4300;border-radius:14px;padding:10px 14px;font-weight:800;font-size:15px;text-align:center">\u{1F4CB} \u062c\u062f\u0648\u0644 \u0627\u0644\u0636\u064e\u0651\u0631\u0628 \u0641\u064a ${ch} \u2014 \u0627\u0636\u063a\u0637\u064a \u0647\u064f\u0646\u0627</summary><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;text-align:center">${rows}</div></details>`;}

 if(s.t==='ex'){stage.innerHTML=`${chip('📖 قبل الحصَّة','prep')}<div class="card"><h1 style="font-size:22px">${s.l.name}</h1><div class="qbox" style="font-size:18px">${s.l.ex}</div>${mulTable(s.l)}<button class="go" onclick="next()">جرِّبي ⬅</button></div>`;return;}
 if(s.t==='prepDone'){if(!ST.before.includes(s.i)){ST.before.push(s.i);addStar(2);}confetti();tada();
  stage.innerHTML=`${chip('📖 قبل الحصَّة','prep')}<div class="card"><div class="big">🎒✨</div><h1>مُستعدَّة يا ماريا!</h1><p class="sub">بعد الحصَّة: ٨ تمارين ← طابق جديد 🏢</p><button class="go" onclick="goMap()">الخريطة 🏡</button></div>`;return;}

   <button class="go" onclick="document.getElementById('ovl').classList.remove('show');goTower()">شاهدي البُرج 🏙️</button><div style="height:8px"></div><button onclick="document.getElementById('ovl').classList.remove('show');goMap()">الخريطة</button>`;ov.classList.add('show');return;}
 if(s.t==='thinkDone'){const first=!ST.think.includes(s.i);if(first){ST.think.push(s.i);addStar(3);}confetti();tada();

 const cls=s.prep?'prep':s.think?'think':'';
 if(s.t==='num')return rNum(s,cls);if(s.t==='mcq')return rMcq(s,cls);if(s.t==='cmp')return rCmp(s,cls);if(s.t==='order')return rOrder(s,cls);}

function rNum(s,cls){let v='';
 stage.innerHTML=`${chip(s.stage,cls)}<div class="card"><div class="qbox">${s.q}</div><div class="disp" id="disp">&nbsp;</div>
  <div class="kb">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-d="${d}">${A(d)}</button>`).join('')}<button class="del" data-d="del">⌫</button><button data-d="0">٠</button><button class="chk" data-d="ok">✓</button></div>
  <div class="ans" id="fx"></div><div class="marks" id="mk"><button class="go" onclick="next()">تابعي ⬅</button></div></div>`;
 const disp=document.getElementById('disp');
 stage.querySelectorAll('.kb button').forEach(b=>b.onclick=()=>{const d=b.dataset.d;
  if(d==='del'){v=v.slice(0,-1);}else if(d==='ok'){if(v==='')return;check();return;}else if(v.length<6){v+=d;}
  disp.textContent=v?A(v):'\u00a0';});
 function check(){stage.querySelectorAll('.kb button').forEach(b=>b.classList.add('locked'));
  if(+v===s.ans){cheer();disp.classList.add('ok');disp.style.borderColor='var(--mint)';if(!s.prep)addStar();showFix('💡 '+(s.why||''),true);}
  else{beepBad();disp.classList.add('wrong');disp.style.borderColor='#E39B9B';showFix(`❌ الإجابة الصَّحيحة: <b style="font-size:22px">${A(s.ans)}</b><br>💡 ${s.why||''}`,true);}}}

 stage.innerHTML=`${chip(s.stage,cls)}<div class="card"><div class="qbox">${s.q}</div><div class="opts">${s.o.map(o=>`<button data-o="${o}">${o}</button>`).join('')}</div><div class="ans" id="fx"></div><div class="marks" id="mk"><button class="go" onclick="next()">تابعي ⬅</button></div></div>`;
 stage.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{stage.querySelectorAll('.opts button').forEach(x=>x.classList.add('locked'));

  else{beepBad();b.classList.add('wrong','bad');showFix(`❌ الإجابة الصَّحيحة: <b>${s.c}</b><br>💡 ${s.why||''}`,true);}});}
function rCmp(s,cls){const a=s.a,b=s.b,ans=a>b?'>':a<b?'<':'=';const lab={'>':'أكبر','<':'أصغر','=':'يُساوي'};
 stage.innerHTML=`${chip(s.stage,cls)}<div class="card"><div class="qbox">قارني<div class="expr" id="ex">${A(a)} <span style="color:var(--sun)">◯</span> ${A(b)}</div></div>

  document.getElementById('ex').innerHTML=`${A(a)} <span style="color:var(--blueD)">${ans}</span> ${A(b)}`;
  const cb=stage.querySelector(`[data-k="${ans}"]`);cb.classList.add('ok');
  if(btn.dataset.k===ans){cheer();if(!s.prep)addStar();showFix(`💡 ${A(a)} ${lab[ans]} ${A(b)}`,true);}
  else{beepBad();btn.classList.add('wrong','bad');showFix(`❌ الصَّحيح: ${A(a)} <b>${lab[ans]}</b> ${A(b)}`,true);}});}
function rOrder(s,cls){let pos=0,miss=0;
 stage.innerHTML=`${chip(s.stage,cls)}<div class="card"><div class="qbox">${s.q}</div><div class="slots">${s.seq.map((_,i)=>`<div class="slot" data-s="${i}">${A(i+1)}</div>${i<s.seq.length-1?'<div class="arrow">←</div>':''}`).join('')}</div>

  if(+b.dataset.i===pos){if(miss===0&&!s.prep)addStar();const sl=stage.querySelector(`[data-s="${pos}"]`);sl.classList.add('fill');sl.textContent=s.seq[pos];b.remove();pos++;miss=0;document.getElementById('fx').classList.remove('show');

 plan.forEach(p=>{let items=exDraw(pool,p.t,p.n);
  if(p.t==='passage'){items=items.slice(0,1);if(items.length){const ps=items[0];const sub=xsh(ps.items).slice(0,p.m);secs.push({t:'passage',title:XTITLE.passage,text:ps.text,L:ps.L,items:sub.map(s=>Object.assign({},s,{L:ps.L,m:1})),marks:sub.length});deficit+=p.m-sub.length;}else deficit+=p.m;return;}
  if(items.length<p.n)deficit+=(p.n-items.length)*p.m;
  if(items.length)secs.push({t:p.t,title:p.title||XTITLE[p.t],items:items.map(it=>Object.assign({},it,{m:p.m})),marks:items.length*p.m});});
 if(deficit>0){const extra=exDraw(pool,'mcq',deficit*3).filter(it=>!secs.some(s=>s.items.some(x=>x.q===it.q))).slice(0,deficit);
  const more=deficit-extra.length;const tfx=more>0?exDraw(pool,'tf',more):[];
  if(extra.length)secs.push({t:'mcq',title:XTITLE.mcq,items:extra.map(it=>Object.assign({},it,{m:1})),marks:extra.length});
  if(tfx.length)secs.push({t:'tf',title:XTITLE.tf,items:tfx.map(it=>Object.assign({},it,{m:1})),marks:tfx.length});}
 return secs;}

function exBind(it,si,ii){const el=document.getElementById(`xi_${si}_${ii}`);if(!el)return;const set=v=>{EX.ans[si][ii]=v;};

   el.querySelectorAll('[data-r]').forEach(x=>{x.querySelector('.xtag')?.remove();const l=Object.keys(map).find(k=>map[k]===+x.dataset.r);if(l!==undefined)x.insertAdjacentHTML('beforeend',`<span class="xtag">${XAR(+l+1)}</span>`);});pick=null;});break;}
 case 'fill':{let pick=null;const map={};set(map);const words=el.querySelectorAll('.xbank button');
  words.forEach(b=>b.onclick=()=>{if(b.classList.contains('xused'))return;words.forEach(x=>x.classList.remove('xsel'));b.classList.add('xsel');pick=b;});
  el.querySelectorAll('.xblank').forEach(bl=>bl.onclick=()=>{const k=bl.dataset.b;if(map[k]!==undefined){const old=[...words].find(w=>w.textContent===map[k]);if(old)old.classList.remove('xused');delete map[k];bl.textContent='';bl.classList.remove('xfilled');if(!pick)return;}
   if(!pick)return;map[k]=pick.textContent;bl.textContent=pick.textContent;bl.classList.add('xfilled');pick.classList.add('xused');pick.classList.remove('xsel');pick=null;});break;}
 case 'sort':{let pick=null;const map={};set(map);const words=el.querySelectorAll('.xbank button');

 case 'order':{const arr=[];set(arr);const words=el.querySelectorAll('.xbank button');
  words.forEach(b=>b.onclick=()=>{if(arr.length>=it.seq.length)return;arr.push(+b.dataset.w);const sl=el.querySelector(`.xslot[data-s="${arr.length-1}"]`);sl.textContent=it.seq[+b.dataset.w];sl.classList.add('xfilled');b.classList.add('xused');});
  el.querySelector('.xreset').onclick=()=>{arr.length=0;el.querySelectorAll('.xslot').forEach((s,k)=>{s.textContent=XAR(k+1);s.classList.remove('xfilled');});words.forEach(b=>b.classList.remove('xused'));};break;}

   map[k]=+pick.dataset.w;const lab=t.querySelector('.xtl')||t;if(t.tagName==='DIV'||t.tagName==='SPAN')lab.textContent=it.chips[map[k]];else{const tx=t.parentNode.querySelector(`[data-tl="${k}"]`);if(tx)tx.textContent=it.chips[map[k]];}
   t.classList.add('xfilled');if(!it.reuse)pick.classList.add('xused');pick.classList.remove('xsel');pick=null;}));break;}

/* ---------- التصحيح ---------- */
function exGrade(it,v){const m=it.m||1;const R=(got,c,g)=>({got:Math.round(got*2)/2,max:m,c,g,q:it.q||it.text||''});
 switch(it.t){
 case 'tf':{const g=v===null?'—':v==='1'?'✓':'✗';return R(v!==null&&(v==='1')===!!it.a?m:0,it.a?'✓':'✗',g);}
