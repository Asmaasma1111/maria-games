<html lang="ar" dir="rtl">
<head>

<style>
:root{
  --paper:#FAF6EE; --card:#FFFFFF; --ink:#4A3A22; --leaf:#C08A3E; --leafD:#8E6224;
  --sun:#F5C544; --rose:#EF7FA8; --sky:#F5EAD6; --line:#E8D9BE; --ok:#227A63; --no:#C9553F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'SF Arabic','Geeza Pro','Segoe UI',Tahoma,sans-serif;
  font-size:16px;line-height:1.75;padding:10px 10px 40px;overscroll-behavior-y:contain}
.wrap{max-width:760px;margin:0 auto}
.bar{background:var(--card);border-radius:18px;padding:8px 12px;display:flex;align-items:center;
  justify-content:space-between;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:10px}
.card{background:var(--card);border-radius:22px;padding:18px 16px;box-shadow:0 4px 18px rgba(0,0,0,.07);margin-bottom:12px}
h1{font-size:23px;margin:0 0 8px;text-align:center}
h2{font-size:18px;margin:18px 0 8px;color:var(--leafD)}
p.sub{color:#7b7b8a;font-size:14.5px;margin:0 0 10px;text-align:center}
button{font-family:inherit;font-size:16px;font-weight:700;border-radius:14px;border:2px solid var(--line);
  background:var(--card);color:var(--ink);padding:9px 16px;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.96)}
button.go{background:var(--leaf);border-color:var(--leafD);color:#fff;box-shadow:0 4px 0 var(--leafD);padding:11px 26px}
button.go:active{box-shadow:0 1px 0 var(--leafD);transform:translateY(3px)}
button.dark{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
button.opt{display:block;width:100%;text-align:right;margin:7px 0;padding:12px 14px;background:var(--sky);border-color:transparent}
button.opt.sel{border-color:var(--leaf);background:var(--card)}
button.opt.good{background:#DFF3E6;border-color:var(--ok)}
button.opt.bad{background:#FBE4E0;border-color:var(--no)}
button[disabled]{opacity:.55}
.chip{display:inline-block;background:var(--leafD);color:#fff;font-size:12.5px;font-weight:800;
  border-radius:999px;padding:4px 12px;margin-bottom:8px}
.chip.t{background:var(--sun);color:#4a3a10}.chip.k{background:#7B5FA8}
.qbox{background:var(--sky);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0;font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.pbar i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .4s}
.stars{font-weight:800;font-size:15px}
.lesson{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:10px 12px;margin:7px 0;
  box-shadow:0 2px 8px rgba(0,0,0,.05)}
.lesson .ic{font-size:26px;width:38px;text-align:center;flex:none}
.lesson .nm{flex:1;font-weight:700;font-size:15.5px}
.lesson .nm small{display:block;font-weight:600;color:#8a8a98;font-size:12.5px}
.lbtns{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.lbtns button{font-size:12.5px;padding:5px 9px;border-radius:10px}
.done{color:var(--ok);font-weight:800}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}
.vcard{background:var(--sky);border:2px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;
  font-weight:700;cursor:pointer;min-height:64px;display:flex;align-items:center;justify-content:center;font-size:15px}
.vcard.open{background:var(--card);border-color:var(--leaf);font-weight:600;font-size:14px}
.bookimg{display:block;width:100%;max-width:470px;margin:12px auto 2px;border-radius:14px;
  border:2px solid var(--line);box-shadow:0 3px 0 var(--line);background:#fff;cursor:zoom-in}
.bookcap{text-align:center;font-size:12px;font-weight:700;opacity:.7;margin-bottom:10px}
.bzoom{position:fixed;inset:0;background:rgba(20,16,24,.86);z-index:99;display:flex;align-items:center;
  justify-content:center;padding:10px;cursor:zoom-out}
.bzoom img{max-width:100%;max-height:100%;border-radius:10px}
.pill{display:inline-block;background:var(--sky);border:2px solid var(--line);border-radius:999px;
  padding:7px 14px;margin:4px;font-weight:700;cursor:pointer;font-size:15px}
.pill.sel{background:var(--leaf);color:#fff;border-color:var(--leafD)}
.pill.good{background:#DFF3E6;border-color:var(--ok)}
.pill.bad{background:#FBE4E0;border-color:var(--no)}
.slot{display:inline-block;min-width:86px;border-bottom:3px dashed var(--leaf);margin:0 4px;text-align:center;font-weight:800;cursor:pointer}
.slot.filled{border-bottom-style:solid}
.bins{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bin{flex:1;min-width:120px;border:2px dashed var(--line);border-radius:14px;padding:8px;min-height:74px}
.bin b{display:block;text-align:center;font-size:13.5px;margin-bottom:5px;color:var(--leafD)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:230px;margin:10px auto}
.keys button{padding:12px 0;font-size:20px}
.fb{font-weight:800;text-align:center;margin:8px 0;font-size:16px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
footer{text-align:center;color:#9a9aa8;font-size:12.5px;margin-top:18px;line-height:2.1}
footer button{font-size:12.5px;padding:4px 9px;border:none;background:none;color:#8a8a98;text-decoration:underline}
.credit{margin-top:10px;font-size:12px;font-weight:600}
.credit a{color:#0A66C2;text-decoration:none}
svg{display:block;max-width:100%;height:auto;margin:0 auto}
.prj{background:var(--sky);border-radius:18px;padding:8px;margin:10px 0}
#pname:focus{outline:2px solid var(--leaf);border-color:var(--leaf)}
.xpaper{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 14px 20px;text-align:right}
.xhead{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;border:2px solid var(--ink);border-radius:6px;padding:8px 12px;font-size:14px}
.xfloat{position:sticky;top:6px;z-index:20;display:flex;justify-content:center;pointer-events:none;margin:-2px 0 6px}
.xtimer{font-size:15px;font-weight:800;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:3px 14px}
.xsech{background:var(--sky);border-right:5px solid var(--ink);padding:6px 12px;font-weight:800;font-size:15px;border-radius:4px;margin-top:16px}
.xitem{padding:10px 6px;border-bottom:1px solid var(--line);font-size:15.5px}
.xn{display:inline-block;min-width:24px;font-weight:800}
.xtbl{width:100%;border-collapse:collapse;font-size:14.5px}
.xtbl th,.xtbl td{border:1px solid var(--ink);padding:6px 8px;text-align:center}
.xmarks{font-weight:700;color:#8a8a98;font-size:13px}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.an-new{animation:pop .7s cubic-bezier(.2,1.4,.5,1) both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(26px)}}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flame{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.35)}}
@keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(-10px)}}
@keyframes rain{0%{transform:translateY(-8px);opacity:0}20%{opacity:1}100%{transform:translateY(30px);opacity:0}}
@keyframes flash{0%,92%,100%{opacity:0}94%,97%{opacity:1}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.sp{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.bo{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dr{animation:drift 9s ease-in-out infinite alternate}
.tw{animation:twinkle 2.4s ease-in-out infinite}
.fl{animation:flame .28s ease-in-out infinite;transform-box:fill-box;transform-origin:top center}
.wv{animation:wave 3.4s ease-in-out infinite}
.rn{animation:rain 1.1s linear infinite}
.fs{animation:flash 5s linear infinite}
.gl{animation:glow 2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes wave{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(18deg)}}
@keyframes orbit{0%{transform:translate(0,0)}25%{transform:translate(-14px,10px)}50%{transform:translate(-30px,0)}75%{transform:translate(-14px,-10px)}100%{transform:translate(0,0)}}
@keyframes shoot{0%{transform:translate(0,0);opacity:0}5%{opacity:1}30%{transform:translate(120px,50px);opacity:0}100%{transform:translate(120px,50px);opacity:0}}
@keyframes flag{0%,100%{transform:skewY(0)}50%{transform:skewY(6deg)}}
@keyframes peek{0%,80%,100%{transform:translateY(0)}90%{transform:translateY(-3px)}}
@keyframes launch{0%{transform:translateY(0)}15%{transform:translateY(2px)}100%{transform:translateY(-260px)}}
@keyframes puff{0%{transform:scale(.4) translateY(0);opacity:.9}100%{transform:scale(2.2) translate(-10px,-40px);opacity:0}}
@keyframes merc{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.7)}}
@keyframes dash{to{stroke-dashoffset:-44}}
@keyframes fly{0%{transform:translate(-40px,70px)}50%{transform:translate(200px,50px)}100%{transform:translate(440px,80px)}}
@keyframes swim{0%{transform:translateX(-40px)}100%{transform:translateX(440px)}}
@keyframes sail{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.06)}}
@keyframes rock{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(2.5deg) translateY(-4px)}}
@keyframes jump{0%,60%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-20px,-40px) rotate(-25deg)}40%{transform:translate(-40px,0) rotate(0)}}
@keyframes beam{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(25deg)}}
@keyframes cab{to{transform:rotate(-360deg)}}
@keyframes swing{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
@keyframes slide{0%{transform:translate(0,0)}60%{transform:translate(-30px,48px)}100%{transform:translate(-30px,48px)}}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-14px)}}
@keyframes ride{0%{transform:translateX(-120px)}100%{transform:translateX(300px)}}
@keyframes fount{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.35)}}
@keyframes flutter{0%{transform:translate(40px,130px)}25%{transform:translate(120px,100px)}50%{transform:translate(220px,140px)}75%{transform:translate(300px,110px)}100%{transform:translate(40px,130px)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fill{from{width:0}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.wave{animation:wave 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.orbit{animation:orbit 12s ease-in-out infinite}
.shoot{animation:shoot 7s linear infinite}
.flag{animation:flag 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.peek{animation:peek 4s ease-in-out infinite}
.launch{animation:launch 4s cubic-bezier(.5,0,.8,.4) 1.2s forwards}
.puff{animation:puff 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.merc{animation:merc 6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
.dash{animation:dash 2s linear infinite}
.fly{animation:fly 14s linear infinite}
.swim{animation:swim 10s linear infinite}
.sail{animation:sail 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.rock{animation:rock 3.6s ease-in-out infinite}
.jump{animation:jump 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.beam{animation:beam 4s ease-in-out infinite}
.cab{animation:cab 16s linear infinite}
.swing{animation:swing 2.2s ease-in-out infinite}
.slide{animation:slide 3s ease-in infinite}
.float{animation:float 4s ease-in-out infinite}
.ride{animation:ride 12s linear infinite}
.fount{animation:fount 1s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.flutter{animation:flutter 18s ease-in-out infinite}
.an-fade{animation:fadein 1.5s ease-out both}
.pbar i{animation:fill 1s ease-out}
.mini{width:100%;max-width:300px;margin:8px auto 4px;border-radius:14px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.08);cursor:pointer}
.mini svg{display:block;width:100%;height:auto}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important}}

</style>

<script>
/* ==================== ✨ مؤثِّرات الفرح (مشتركة لكلّ الألعاب) ==================== */
(function(){
 if(window.FX)return;
 const S=document.createElement('style');
 S.textContent=`
 #fxc{position:fixed;inset:0;pointer-events:none;z-index:9998}
 .fx-star{position:fixed;font-weight:900;font-size:22px;color:#E3A400;text-shadow:0 2px 0 #fff;
   pointer-events:none;z-index:9999;animation:fxrise 1.3s ease-out forwards}
 @keyframes fxrise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-8px) scale(1.2)}100%{transform:translateY(-70px) scale(1);opacity:0}}
 .fx-bump{animation:fxbump .5s cubic-bezier(.2,1.6,.4,1)}
 @keyframes fxbump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
 .fx-spark{transform-box:fill-box;transform-origin:center;animation:fxspark 1.2s ease-out forwards}
 @keyframes fxspark{0%{opacity:0;transform:scale(.2) rotate(0)}30%{opacity:1}100%{opacity:0;transform:scale(1.6) rotate(90deg)}}
 .fx-ring{transform-box:fill-box;transform-origin:center;animation:fxring 1s ease-out forwards}
 @keyframes fxring{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(2.2)}}
 .fx-banner{position:fixed;left:50%;top:18%;transform:translateX(-50%) scale(.6);background:#fff;color:#2B2450;
   font-weight:900;font-size:24px;padding:14px 28px;border-radius:999px;box-shadow:0 10px 40px rgba(0,0,0,.25);
   z-index:9999;pointer-events:none;animation:fxban 3.2s cubic-bezier(.2,1.4,.4,1) forwards;white-space:nowrap}
 .fxdr{animation:fxdrift 14s ease-in-out infinite alternate}
 @keyframes fxdrift{from{transform:translateX(-14px)}to{transform:translateX(18px)}}
 .fxbob{animation:fxbob 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes fxbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
 .fxtw{animation:fxtw 2.2s ease-in-out infinite}
 @keyframes fxtw{0%,100%{opacity:.35}50%{opacity:1}}
 @keyframes fxban{0%{opacity:0;transform:translateX(-50%) scale(.5)}12%{opacity:1;transform:translateX(-50%) scale(1.05)}18%{transform:translateX(-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(.9)}}
 `;
 document.head.appendChild(S);
 let cv=null,ctx=null,parts=[],raf=0;
 function canvas(){if(cv)return cv;cv=document.createElement('canvas');cv.id='fxc';document.body.appendChild(cv);ctx=cv.getContext('2d');
  const rs=()=>{cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);};
  rs();addEventListener('resize',rs);return cv;}
 const COL=['#FF5E7E','#FFC53D','#4FA3C7','#6FBF73','#B678D8','#FF8A3D','#fff'];
 function burst(x,y,n,spread,grav){canvas();
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(2+Math.random()*spread);
   parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:grav,life:1,c:COL[i%COL.length],r:3+Math.random()*4,rot:Math.random()*6,vr:(Math.random()-.5)*.3,sq:Math.random()<.5});}
  if(!raf)raf=requestAnimationFrame(tick);}
 function tick(){ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.985;p.life-=.012;p.rot+=p.vr;
   ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
   if(p.sq)ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);else{ctx.beginPath();ctx.arc(0,0,p.r*.7,0,7);ctx.fill();}
   ctx.restore();}
  raf=parts.length?requestAnimationFrame(tick):0;if(!raf)ctx.clearRect(0,0,innerWidth,innerHeight);}
 function confetti(){burst(innerWidth/2,innerHeight*.35,110,7,.16);}
 function fireworks(){let k=0;const go=()=>{burst(innerWidth*(.2+Math.random()*.6),innerHeight*(.15+Math.random()*.35),70,6,.07);if(++k<6)setTimeout(go,380);};go();}
 function starFloat(el,txt){try{const r=el.getBoundingClientRect();const d=document.createElement('div');d.className='fx-star';d.textContent=txt||'+⭐';
  d.style.left=(r.left+r.width/2-16)+'px';d.style.top=(r.top-4)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1400);
  el.classList.remove('fx-bump');void el.offsetWidth;el.classList.add('fx-bump');}catch(e){}}
 function banner(txt){const d=document.createElement('div');d.className='fx-banner';d.textContent=txt;document.body.appendChild(d);setTimeout(()=>d.remove(),3300);}
 /* بريق حول قطعة جديدة في المشروع (SVG) */
 function sparkle(g){try{const svg=g.ownerSVGElement;if(!svg)return;const b=g.getBBox();if(!b.width)return;
  const cx=b.x+b.width/2,cy=b.y+b.height/2,R=Math.max(b.width,b.height)/2+6;
  const ns='http://www.w3.org/2000/svg';const ring=document.createElementNS(ns,'circle');
  ring.setAttribute('cx',cx);ring.setAttribute('cy',cy);ring.setAttribute('r',R);ring.setAttribute('fill','none');
  ring.setAttribute('stroke','#FFD75E');ring.setAttribute('stroke-width','4');ring.setAttribute('class','fx-ring');svg.appendChild(ring);
  for(let i=0;i<8;i++){const a=i*Math.PI/4;const t=document.createElementNS(ns,'text');t.textContent='✦';
   t.setAttribute('x',cx+Math.cos(a)*R);t.setAttribute('y',cy+Math.sin(a)*R+5);t.setAttribute('font-size','14');t.setAttribute('fill',i%2?'#FFD75E':'#fff');
   t.setAttribute('text-anchor','middle');t.setAttribute('class','fx-spark');t.style.animationDelay=(i*.06)+'s';svg.appendChild(t);
   setTimeout(()=>t.remove(),1400);}
  setTimeout(()=>ring.remove(),1100);}catch(e){}}
 /* مراقبة تلقائيَّة: عدَّاد النُّجوم ، القطع الجديدة ، اكتمال المشروع */
 let lastStars=null,fwDone='';
 function watch(){
  const st=document.getElementById('starTop')||document.getElementById('stars');
  if(st){const read=()=>st.textContent.replace(/[^\d٠-٩]/g,'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
   lastStars=+read()||0;
   new MutationObserver(()=>{const v=+read()||0;if(v>lastStars){starFloat(st,'+'+String(v-lastStars).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d])+' ⭐');}lastStars=v;}).observe(st,{childList:true,characterData:true,subtree:true});}
  const stage=document.getElementById('stage');
  if(stage)new MutationObserver(()=>{
   stage.querySelectorAll('.an-new[data-new="1"],g.an-new:not([data-fx])').forEach(g=>{g.setAttribute('data-fx','1');setTimeout(()=>sparkle(g),350);});
   const t=stage.textContent||'';const done=t.includes('🏆');
   if(done&&fwDone!==location.hash+t.length){fwDone=location.hash+t.length;fireworks();setTimeout(fireworks,900);}
  }).observe(stage,{childList:true,subtree:true});
 }
 if(document.readyState==='loading')addEventListener('DOMContentLoaded',watch);else watch();

const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- صور من الكتاب ---------- */
function bimg(k,pg){return (typeof BIMG!=='undefined'&&BIMG[k])?`<img class="bookimg" src="${BIMG[k]}" alt="صورة من الكتاب" loading="lazy">${pg?`<div class="bookcap">📘 من كتابي · صفحة ${pg}</div>`:''}`:'';}
function bgal(L){return (L.pics||[]).map(x=>bimg(x[0],x[1])).join('');}
function bzoom(src){const o=document.createElement('div');o.className='bzoom';const i=document.createElement('img');i.src=src;o.appendChild(i);o.onclick=()=>o.remove();document.body.appendChild(o);}
document.addEventListener('click',e=>{const t=e.target;if(t&&t.classList&&t.classList.contains('bookimg'))bzoom(t.src);});

/* ---------- الصوت ---------- */
let SND=true;let AC=null;
function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,t){if(!SND)return;const c=actx();if(!c)return;const o=c.createOscillator(),g=c.createGain();
 o.type=t||'sine';o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();
 g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d);}
const beep=()=>tone(660,.12);
function tada(){try{if(window.FX)FX.confetti();}catch(e){}if(!SND)return;[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.22),i*90));}
const buzz=()=>tone(180,.2,'triangle');
function toggleSound(){SND=!SND;localStorage.setItem('snd_t2',SND?'1':'0');applySound();}
function applySound(){const b=document.getElementById('sndB');if(b)b.textContent=SND?'🔊':'🔇';}
try{SND=localStorage.getItem('snd_t2')!=='0';}catch(e){}

const profSuffix=()=>(PROFILE&&PROFILE.name)?'::'+PROFILE.name:'';
const NAME=()=>(PROFILE&&PROFILE.name)?PROFILE.name:'بطلتي';
function profKnown(){try{return JSON.parse(localStorage.getItem(PROF_KEY+'_all')||'[]');}catch(e){return[];}}
function profAsk(change){
 const cur=(PROFILE&&PROFILE.name)||'';const known=profKnown();
 document.getElementById('backB').style.visibility='hidden';
 stage.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:44px">✨👧</div>
  <h1>${change?'تغيير الاسم':'أهلًا بكِ يا بطلة!'}</h1>
  <p class="sub">اكتبي اسمكِ مرة واحدة فقط؛ سيبقى محفوظًا على هذا الجهاز، وتُكملين دائمًا من حيث توقّفتِ.</p>
  <input id="pname" maxlength="20" placeholder="اسمكِ هنا…" value="${esc(cur)}"

    border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin:6px 0 10px;background:#fff">
  ${known.length?`<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px">${known.map(n=>`<button style="font-size:14px;padding:6px 14px" onclick="document.getElementById('pname').value=${JSON.stringify(n).replace(/"/g,'&quot;')}">👧 ${esc(n)}</button>`).join('')}</div>`:''}
  <button class="go" onclick="profSave()">هيا نبدأ ✨</button></div>`;
 const inp=document.getElementById('pname');
 inp.onkeydown=e=>{if(e.key==='Enter')profSave();};
 if(!change)setTimeout(()=>inp.focus(),200);
 window.scrollTo({top:0});

function profSave(){
 const inp=document.getElementById('pname');const n=(inp.value||'').trim().replace(/\s+/g,' ');
 if(!n){inp.style.borderColor='#E39B9B';return;}
 PROFILE={name:n};
 try{localStorage.setItem(PROF_KEY,JSON.stringify(PROFILE));

 }catch(e){}
 load();goMap();

function profBoot(){if(!PROFILE||!PROFILE.name){profAsk(false);}else{load();goMap();}}

/* ---------- الحفظ ---------- */
const SKEY=()=>SKEY_BASE+profSuffix();
let ST={stars:0,prep:[],test:[],think:[],exams:[]};
function save(){try{localStorage.setItem(SKEY(),JSON.stringify(ST));}catch(e){}}
function load(){try{const r=localStorage.getItem(SKEY());if(r){const o=JSON.parse(r);
  ST={stars:o.stars||0,prep:o.prep||[],test:o.test||[],think:o.think||[],exams:o.exams||[]};}
  else ST={stars:0,prep:[],test:[],think:[],exams:[]};}catch(e){}drawStars();}
function drawStars(){const e=document.getElementById('starTop');if(e)e.textContent=A(ST.stars)+' ⭐';}
function addStars(n){ST.stars+=n;save();drawStars();}
function exportProgress(){
 const blob=new Blob([JSON.stringify({key:SKEY(),data:ST},null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download=SKEY().replace(/[^\w-]/g,'_')+'.json';a.click();
}
function importProgress(){
 const i=document.createElement('input');i.type='file';i.accept='application/json';
 i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);const d=o.data||o;
   ST.stars=Math.max(ST.stars,d.stars||0);
   ['prep','test','think'].forEach(k=>{(d[k]||[]).forEach(x=>{if(!ST[k].includes(x))ST[k].push(x);});});
   (d.exams||[]).forEach(x=>ST.exams.push(x));
   save();goMap();alert('تمّ دمج النُّسخة ✔');}catch(e){alert('الملفّ غير صالح');}};
  r.readAsText(f);};
 i.click();
}
function hardReset(){
 if(!confirm('هل تريدين مسح كلّ التقدُّم والبدء من جديد؟'))return;
 ST={stars:0,prep:[],test:[],think:[],exams:[]};save();goMap();
}

let cur=-1,Q=[],qi=0;
function chip(t,k){return `<div class="chip ${k||''}">${t}</div>`;}
function pct(){const n=L.length*3;const d=ST.prep.length+ST.test.length+ST.think.length;return Math.round(d*100/n);}

function goMap(){
 cur=-1;document.getElementById('backB').style.visibility='hidden';

 Object.keys(units).forEach(u=>{
  h+=`<h2>${esc(u)}</h2>`;
  units[u].forEach(i=>{
   const l=L[i],p=ST.prep.includes(i),t=ST.test.includes(i),k=ST.think.includes(i);
   h+=`<div class="lesson"><div class="ic">${l.ic}</div>
    <div class="nm">${esc(l.name)}${t?'<small class="done">✓ تمّ الدَّرس</small>':'<small>'+esc(l.sub||'')+'</small>'}</div>
    <div class="lbtns">
     <button onclick="startPrep(${i})" style="${p?'border-color:var(--ok)':''}">📖 قبل</button>
     <button onclick="startTest(${i})" style="${t?'border-color:var(--ok)':''}">✏️ بعد</button>
     <button onclick="startThink(${i})" style="${k?'border-color:var(--ok)':''}">🧠 أكثر</button>
    </div></div>`;
  });
 });
 stageEl.innerHTML=h;window.scrollTo({top:0});
}

/* ---------- قبل الحصّة ---------- */
function startPrep(i){cur=i;document.getElementById('backB').style.visibility='visible';
 Q=[{t:'idea',l:L[i]},{t:'vocab',l:L[i]},{t:'prepDone',i}];qi=0;render();}
function startTest(i){cur=i;document.getElementById('backB').style.visibility='visible';
 const l=L[i];Q=l.test.map((s,k)=>({...s,stage:`✏️ ${A(k+1)}/${A(l.test.length)} · ${l.name}`}));
 Q.push({t:'testDone',i});qi=0;render();}
function startThink(i){cur=i;document.getElementById('backB').style.visibility='visible';
 const l=L[i];Q=l.think.map((s,k)=>({...s,stage:`🧠 ${A(k+1)}/${A(l.think.length)}`}));
 Q.push({t:'thinkDone',i});qi=0;render();}
function next(){qi++;if(qi>=Q.length){goMap();return;}render();}

 const s=Q[qi],el=stageEl;
 if(s.t==='idea'){const l=s.l;
  el.innerHTML=`${chip('📖 قبل الحصَّة · '+l.name)}<div class="card">

   ${bgal(l)}
   <div style="text-align:center"><button class="go" onclick="next()">الكلمات ⬅</button></div></div>`;
  return;}
 if(s.t==='vocab'){const l=s.l;let seen=0;
  el.innerHTML=`${chip('📖 قبل الحصَّة · '+l.name)}<div class="card">
   <p class="sub">اضغطي على البطاقة لتري معناها.</p>
   <div class="vgrid">${l.vocab.map((v,k)=>`<div class="vcard" data-k="${k}">${v[0]}</div>`).join('')}</div>

 if(s.t==='prepDone'){if(!ST.prep.includes(s.i)){ST.prep.push(s.i);addStars(1);tada();}
  el.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:48px">🌟</div>
   <h1>أحسنتِ يا ${esc(NAME())}!</h1><p class="sub">أنتِ جاهزة للحصَّة. بعد الحصَّة عودي وجرّبي الاختبار.</p>
   <button class="go" onclick="goMap()">إلى الخريطة 🗺️</button></div>`;return;}
 if(s.t==='testDone'){const first=!ST.test.includes(s.i);
  if(first){ST.test.push(s.i);addStars(3);if(window.FX)setTimeout(()=>FX.banner('🧩 قطعة جديدة في مشروعكِ!'),250);}
  tada();
  el.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:48px">🏅</div>
   <h1>${first?'قطعة جديدة في مشروعكِ!':'أحسنتِ!'}</h1>
   <p class="sub">${first?APP.pdone:'راجعتِ الدَّرس مرَّة أخرى، ممتاز!'}</p>
   <button class="go" onclick="goProject()">${APP.pic} ${APP.pbtn}</button>
   <div style="margin-top:8px"><button onclick="goMap()">إلى الخريطة 🗺️</button></div></div>`;return;}
 if(s.t==='thinkDone'){if(!ST.think.includes(s.i)){ST.think.push(s.i);addStars(2);}tada();
  el.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:48px">🧠</div>
   <h1>تفكير رائع!</h1><p class="sub">هكذا يفكِّر العُلماء الصِّغار.</p>
   <button class="go" onclick="goMap()">إلى الخريطة 🗺️</button></div>`;return;}
 renderQ(s,el);
}

function shell(s,body,extra){
 return `${chip(s.stage||'',s.stage&&s.stage[0]==='🧠'?'k':'t')}<div class="card">
  <div class="qbox">${s.q}</div>${body}<div id="fb"></div>
  <div style="text-align:center;margin-top:10px">${extra||'<button class="go" id="okB">تحقّقي ✔</button>'}</div></div>`;
}
function good(msg){const f=document.getElementById('fb');f.className='fb ok';f.innerHTML='✅ '+(msg||'إجابة صحيحة!');tada();}
function bad(msg){const f=document.getElementById('fb');f.className='fb no';f.innerHTML='❌ '+msg;buzz();}
function nextBtn(){const f=document.getElementById('fb');
 f.insertAdjacentHTML('afterend','<div style="text-align:center;margin-top:8px"><button class="go" onclick="next()">التَّالي ⬅</button></div>');
 const b=document.getElementById('okB');if(b)b.remove();}

function renderQ(s,el){
 if(s.t==='mcq'){
  el.innerHTML=shell(s,s.o.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join(''),'&nbsp;');
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   const k=+b.dataset.k;el.querySelectorAll('.opt').forEach(x=>x.disabled=true);
   if(k===s.c){b.classList.add('good');good(s.why);}else{b.classList.add('bad');
    el.querySelectorAll('.opt')[s.c].classList.add('good');bad('الصَّحيح: '+s.o[s.c]+(s.why?' — '+s.why:''));}
   nextBtn();});
  return;}
 if(s.t==='tf'){
  el.innerHTML=shell(s,`<div class="grid"><button class="opt" style="text-align:center" data-v="1">✔ صحيحة</button>
   <button class="opt" style="text-align:center" data-v="0">✘ خاطئة</button></div>`,'&nbsp;');
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   const v=b.dataset.v==='1';el.querySelectorAll('.opt').forEach(x=>x.disabled=true);
   if(v===!!s.a){b.classList.add('good');good(s.why);}else{b.classList.add('bad');bad((s.a?'صحيحة':'خاطئة')+(s.why?' — '+s.why:''));}
   nextBtn();});
  return;}
 if(s.t==='match'){
  const right=shuffle(s.pairs.map((p,i)=>({t:p[1],i})));
  let selL=null;const donePairs=[];
  el.innerHTML=shell(s,`<div class="grid">
   <div id="mL">${s.pairs.map((p,i)=>`<button class="opt" data-i="${i}" style="text-align:center">${p[0]}</button>`).join('')}</div>
   <div id="mR">${right.map(r=>`<button class="opt" data-i="${r.i}" style="text-align:center">${r.t}</button>`).join('')}</div></div>`,'&nbsp;');
  const fin=()=>{if(donePairs.length===s.pairs.length){good();nextBtn();}};
  el.querySelectorAll('#mL .opt').forEach(b=>b.onclick=()=>{
   el.querySelectorAll('#mL .opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selL=+b.dataset.i;});
  el.querySelectorAll('#mR .opt').forEach(b=>b.onclick=()=>{
   if(selL===null)return;const i=+b.dataset.i;
   if(i===selL){const lb=el.querySelector(`#mL .opt[data-i="${selL}"]`);
    lb.classList.add('good');lb.disabled=true;b.classList.add('good');b.disabled=true;
    lb.classList.remove('sel');donePairs.push(i);beep();selL=null;fin();}
   else{b.classList.add('bad');buzz();setTimeout(()=>b.classList.remove('bad'),450);}});
  return;}
 if(s.t==='sort2'){
  const items=shuffle(s.items.map((x,i)=>({x,i})));let placed=0;
  el.innerHTML=shell(s,`<div id="pool" style="text-align:center">${items.map(o=>`<span class="pill" data-i="${o.i}">${o.x[0]}</span>`).join('')}</div>
   <div class="bins">${s.bins.map((b,k)=>`<div class="bin" data-b="${k}"><b>${b}</b><div class="drop"></div></div>`).join('')}</div>`,'&nbsp;');
  let sel=null;
  el.querySelectorAll('#pool .pill').forEach(p=>p.onclick=()=>{
   el.querySelectorAll('#pool .pill').forEach(x=>x.classList.remove('sel'));p.classList.add('sel');sel=p;});
  el.querySelectorAll('.bin').forEach(bn=>bn.onclick=()=>{
   if(!sel)return;const i=+sel.dataset.i,b=+bn.dataset.b;
   if(s.items[i][1]===b){sel.classList.remove('sel');sel.classList.add('good');
    bn.querySelector('.drop').appendChild(sel);sel.onclick=null;sel=null;placed++;beep();
    if(placed===s.items.length){good();nextBtn();}}
   else{bn.style.borderColor='var(--no)';buzz();setTimeout(()=>bn.style.borderColor='',450);}});
  return;}
 if(s.t==='fill'){
  const bank=shuffle(s.bank||s.items.map(x=>x[1]));let sel=null,done=0;
  el.innerHTML=shell(s,`<div style="text-align:center;margin-bottom:8px">${bank.map(w=>`<span class="pill w" data-w="${esc(w)}">${w}</span>`).join('')}</div>
   <div>${s.items.map((it,k)=>`<div style="margin:8px 0">${A(k+1)}. ${it[0].replace('___',`<span class="slot" data-k="${k}">…</span>`)}</div>`).join('')}</div>`,'&nbsp;');
  el.querySelectorAll('.w').forEach(p=>p.onclick=()=>{
   el.querySelectorAll('.w').forEach(x=>x.classList.remove('sel'));p.classList.add('sel');sel=p;});
  el.querySelectorAll('.slot').forEach(sl=>sl.onclick=()=>{
   if(!sel)return;const k=+sl.dataset.k;
   if(sel.dataset.w===s.items[k][1]){sl.textContent=sel.dataset.w;sl.classList.add('filled');
    sl.style.color='var(--ok)';sel.classList.add('good');sel.onclick=null;sel.classList.remove('sel');sel=null;done++;beep();
    if(done===s.items.length){good();nextBtn();}}
   else{sl.style.color='var(--no)';buzz();setTimeout(()=>sl.style.color='',450);}});
  return;}
 if(s.t==='order'){
  const sh=shuffle(s.seq.map((x,i)=>({x,i})));let nextI=0;
  el.innerHTML=shell(s,`<div id="pool">${sh.map(o=>`<div><button class="opt" data-i="${o.i}">${o.x}</button></div>`).join('')}</div>
   <div id="seq" style="margin-top:8px"></div>`,'&nbsp;');
  el.querySelectorAll('#pool .opt').forEach(b=>b.onclick=()=>{
   if(+b.dataset.i===nextI){b.classList.add('good');b.disabled=true;
    document.getElementById('seq').insertAdjacentHTML('beforeend',`<div class="pill good">${A(nextI+1)}. ${b.textContent}</div>`);
    nextI++;beep();if(nextI===s.seq.length){good();nextBtn();}}
   else{b.classList.add('bad');buzz();setTimeout(()=>b.classList.remove('bad'),450);}});
  return;}
 if(s.t==='multi'){
  el.innerHTML=shell(s,s.o.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join(''));
  const chosen=new Set();
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   const k=+b.dataset.k;if(chosen.has(k)){chosen.delete(k);b.classList.remove('sel');}else{chosen.add(k);b.classList.add('sel');}});
  document.getElementById('okB').onclick=()=>{
   const want=new Set(s.a);let okAll=want.size===chosen.size;chosen.forEach(k=>{if(!want.has(k))okAll=false;});
   el.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;b.classList.remove('sel');
    if(want.has(k))b.classList.add('good');else if(chosen.has(k))b.classList.add('bad');});
   okAll?good(s.why):bad('الصَّحيح مُظلَّل بالأخضر'+(s.why?' — '+s.why:''));nextBtn();};
  return;}
 if(s.t==='num'){
  el.innerHTML=shell(s,`<div style="text-align:center"><div id="disp" style="font-size:34px;font-weight:800;min-height:46px;letter-spacing:3px">…</div>
   <div class="keys">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-d="${d}">${A(d)}</button>`).join('')}
    <button data-d="c">⌫</button><button data-d="0">٠</button><button data-d="ok" class="go" style="padding:12px 0">✔</button></div></div>`,'&nbsp;');
  let v='';const disp=document.getElementById('disp');
  el.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{
   const d=b.dataset.d;
   if(d==='c'){v=v.slice(0,-1);}
   else if(d==='ok'){if(!v)return;el.querySelectorAll('.keys button').forEach(x=>x.disabled=true);
    if(+v===s.a)good(s.why);else bad('الجواب: '+A(s.a)+(s.why?' — '+s.why:''));nextBtn();return;}
   else if(v.length<6){v+=d;}
   disp.textContent=v?A(v):'…';});
  return;}

function pparts(n,total,parts){
 let out='';
 parts.forEach((p,i)=>{const need=Math.max(1,Math.ceil(p[0]*total));
  if(n>=need)out+=`<g class="${n===need?'an-new':''}" ${n===need?'data-new="1"':''}>${p[1]}</g>`;});
 return out;
}

const XTITLE={tf:'أضع علامة (✓) أمام العبارة الصَّحيحة و(✗) أمام الخاطئة',
 mcq:'أختار الإجابة الصَّحيحة',match:'أصِل بين العمودين',sort2:'أصنِّف ما يأتي',
 fill:'أكمل الفراغ بالكلمة المُناسبة',order:'أرتِّب ما يأتي',num:'أحسب وأكتب الجواب',
 short:'أُجيب بإجابة قصيرة',multi:'أختار كلّ الإجابات الصَّحيحة'};
const XMARK=n=>n===1?'درجة واحدة':n===2?'درجتان':A(n)+' درجات';
const XORD=['الأوَّل','الثَّاني','الثَّالث','الرَّابع','الخامس','السَّادس','السَّابع','الثَّامن'];
let EX={on:false,sec:[],ans:[],kind:'',pid:null,pname:null,t0:0,timer:null,last:null};

function xseed(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%100000)/100000;};}
function xshuf(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* جمع كلّ أسئلة الدُّروس المطلوبة */
function exPool(idx){
 const out=[];
 idx.forEach(i=>{(L[i].test||[]).forEach(s=>{
  if(['mcq','tf','match','sort2','fill','order','num','short','multi'].includes(s.t))
   out.push({...s,L:i,q:String(s.q).replace(/<[^>]*>/g,'').trim()});});});
 return out;
}
/* ورقة من ٢٠ درجة */
function exBuild(idx,seedStr){
 const r=xseed(seedStr||('s'+Math.random()));
 const pool=exPool(idx);
 const by={};pool.forEach(p=>{(by[p.t]=by[p.t]||[]).push(p);});
 Object.keys(by).forEach(k=>by[k]=xshuf(by[k],r));
 const plan=[['tf',4,1],['mcq',5,1],['match',1,3],['fill',1,3],['sort2',1,3],['order',1,2],['num',2,1],['short',2,1]];
 const secs=[];let total=0;
 plan.forEach(([t,n,m])=>{
  const av=by[t]||[];if(!av.length)return;
  const take=av.splice(0,n);if(!take.length)return;
  const items=take.map(it=>({...it,m:m}));
  const got=items.reduce((a,b)=>a+b.m,0);
  if(total+got>20){const room=20-total;const keep=[];let acc=0;
   items.forEach(it=>{if(acc+it.m<=room){keep.push(it);acc+=it.m;}});
   if(!keep.length)return;secs.push({t,title:XTITLE[t],items:keep});total+=acc;}
  else{secs.push({t,title:XTITLE[t],items});total+=got;}
 });
 /* أكمل إلى ٢٠ بأسئلة صواب/خطأ أو اختيار */
 let guard=0;
 while(total<20&&guard++<40){
  const t=(by.tf&&by.tf.length)?'tf':((by.mcq&&by.mcq.length)?'mcq':null);
  if(!t)break;const it={...by[t].shift(),m:1};
  let sec=secs.find(s=>s.t===t);
  if(!sec){sec={t,title:XTITLE[t],items:[]};secs.push(sec);}
  sec.items.push(it);total++;
 }
 return secs;
}
function exMax(sec){return sec.reduce((a,s)=>a+s.items.reduce((x,y)=>x+y.m,0),0);}

/* ---------- العجلة ---------- */
const COLS=['#F2C14E','#F08A4B','#E84A5F','#C73E6B','#A83279','#E8A1C4','#F5B971','#EE6C4D','#D6457A','#F7A072'];
const CATS={riddle:{t:'لغز 🧩',c:'#A83279'},mcq:{t:'اختاري 🔘',c:'#E84A5F'},tf:{t:'صح أم خطأ ⚖️',c:'#F08A4B'},
 write:{t:SUBJ==='maths'?'احسبي 🔢':'اكتبي ✏️',c:'#C73E6B'},bonus:{t:'مفاجأة 🎁 ×٢',c:'#F2C14E'}};
let POOL=null,SEGS=[],ROT=0,SPIN=false,SESSION={stars:0,streak:0,won:0},CUR=null;
const esc2=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

function makeSegs(){
 const avail=['riddle','mcq','tf','write'].filter(k=>POOL[k].length);
 let s=[];avail.forEach(k=>{s.push(k,k);});
 if(s.length<6)s=s.concat(s);
 s.push('bonus');if(s.length>=10)s.push('bonus');
 s=shuf(s);
 /* لا يتجاور قسمان متشابهان */
 for(let i=1;i<s.length;i++){if(s[i]===s[i-1]){for(let j=i+1;j<s.length;j++){if(s[j]!==s[i]&&s[j]!==s[i-1]){[s[i],s[j]]=[s[j],s[i]];break;}}}}
 return s;
}
function wheelSVG(){
 const n=SEGS.length,R=190,cx=200,cy=200,seg=360/n;
 const pt=(deg,r)=>{const a=(deg-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
 let g='';
 SEGS.forEach((k,i)=>{
  const a0=i*seg,a1=(i+1)*seg,[x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R);
  const col=k==='bonus'?'#F2C14E':COLS[(i*3)%COLS.length];
  g+=`<path id="whs${i}" d="M${cx} ${cy} L${x0} ${y0} A${R} ${R} 0 0 1 ${x1} ${y1}Z" fill="${col}" stroke="#fff" stroke-width="3"/>`;
  const mid=a0+seg/2,[tx,ty]=pt(mid,R*.62),flip=mid>180;
  const rot=flip?mid+90:mid-90;
  g+=`<text x="${tx}" y="${ty}" transform="rotate(${rot} ${tx} ${ty})" text-anchor="middle" dominant-baseline="middle"
   font-size="${n>10?15:17}" font-weight="900" fill="#fff" font-family="inherit" style="paint-order:stroke;stroke:rgba(0,0,0,.18);stroke-width:2px">${CATS[k].t}</text>`;
 });
 /* حلقة خارجيَّة بمصابيح */
 let bulbs='';for(let i=0;i<24;i++){const [bx,by]=pt(i*15,R+5);bulbs+=`<circle cx="${bx}" cy="${by}" r="3.4" fill="${i%2?'#FFF3B0':'#fff'}" class="fxtw" style="animation-delay:${(i%4)*.3}s"/>`;}
 return `<svg viewBox="0 0 400 400" role="img" aria-label="عجلة الألغاز">
  <circle cx="200" cy="200" r="199" fill="#F9C9D6"/><circle cx="200" cy="200" r="196" fill="#fff" opacity=".6"/>
  <g class="wh-rot" id="whrot" style="transform:rotate(${ROT}deg)">${g}</g>
  ${bulbs}
  <g class="wh-hub" id="whhub">
   <path d="M200 132 L214 170 A36 36 0 1 1 186 170 Z" fill="#141414"/>
   <circle cx="200" cy="200" r="36" fill="#141414" stroke="#fff" stroke-width="4"/>
   <text x="200" y="202" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="900" fill="#fff" font-family="inherit">لُفِّي</text>
  </g></svg>`;
}
function top(){return `<div class="wh-top"><b>🎡 ${UNIT?esc2(UNIT.name):'عجلة الألغاز'}</b>
 <span class="wh-sc">⭐ ${AR(SESSION.stars)} · 🔥 ${AR(SESSION.streak)}</span>
 <button class="wh-x" onclick="wheelClose()" aria-label="إغلاق">✖</button></div>`;}
function showWheel(){
 SEGS=makeSegs();
 const ov=document.getElementById('whov');
 ov.innerHTML=top()+`<div class="wh-box"><div class="wh-wrap">${wheelSVG()}</div>
  <p class="wh-tip">كلُّ الألغاز من دُروس هذه الوحدة 📚<br>اضغطي «لُفِّي» يا ${who()}، وأجيبي عن سُؤال الجزء الَّذي يقف عنده السَّهم! 🎯</p>
  <button class="wh-btn" onclick="wheelSpin()">🎡 لُفِّي العجلة</button></div>`;
 document.getElementById('whhub').onclick=()=>window.wheelSpin();
}
window.wheelSpin=function(){
 if(SPIN)return;SPIN=true;
 const n=SEGS.length,seg=360/n,i=Math.floor(Math.random()*n);
 const jitter=(Math.random()-.5)*seg*.6;
 const base=Math.ceil(ROT/360)*360;
 ROT=base+360*(5+Math.floor(Math.random()*3))+(360-(i*seg+seg/2+jitter));
 const el=document.getElementById('whrot');el.style.transform=`rotate(${ROT}deg)`;
 /* طقطقة تتباطأ */
 let t=0,d=40;const tick=()=>{tk(900+Math.random()*200,.03,.04);t+=d;d*=1.09;if(t<4300)setTimeout(tick,d);};tick();
 setTimeout(()=>{SPIN=false;const p=document.getElementById('whs'+i);if(p)p.classList.add('wh-land');
  tk(1318,.2,.1,'sine');setTimeout(()=>ask(SEGS[i]),900);},4700);
};

/* ---------- السُّؤال: ننتظر الإجابة الصَّحيحة ---------- */
function ask(cat){
 let bonus=false,k=cat;
 if(cat==='bonus'){bonus=true;const av=['riddle','mcq','tf','write'].filter(x=>POOL[x].length);k=av[Math.floor(Math.random()*av.length)];}
 const item=draw(POOL[k]);if(!item){showWheel();return;}
 CUR={item,cat:k,bonus,tries:0,hints:0};
 let body='';
 if(item.k==='mcq'){
  const order=shuf(item.o.map((x,j)=>j));
  body=order.map(j=>`<button class="wh-o" dir="auto" data-j="${j}">${item.o[j]}</button>`).join('');
 }else if(item.k==='tf'){
  body=`<button class="wh-o" data-v="1" style="text-align:center">✔ صحيحة</button><button class="wh-o" data-v="0" style="text-align:center">✘ خاطئة</button>`;
 }else{
  body=`<input class="wh-in" id="whin" ${item.num?'inputmode="numeric"':''} placeholder="${item.num?'اكتبي العدد…':'اكتبي إجابتكِ…'}" autocomplete="off">
   <div style="text-align:center;margin-top:10px"><button class="wh-btn" id="whok">تحقَّقي ✔</button></div>`;
 }
 const ov=document.getElementById('whov');
 ov.innerHTML=top()+`<div class="wh-box">
  ${bonus?'<div class="wh-big">🎁</div><p class="wh-tip">مفاجأة! نُجوم هذا السُّؤال مُضاعفة ×٢</p>':''}
  <div class="wh-card" id="whcard">
   <span class="wh-cat" style="background:${CATS[k].c}">${item.rid?'لغز 🧩':CATS[k].t}</span>
   <div class="wh-q" dir="auto">${item.q}</div>${body}
   <div class="wh-fb" id="whfb"></div><div id="whhint"></div>
   <div style="text-align:center"><button class="wh-btn alt" id="whhb" style="display:none">💡 مُساعدة</button></div>
  </div></div>`;
 const card=document.getElementById('whcard');
 if(item.k==='mcq'){card.querySelectorAll('.wh-o').forEach(b=>b.onclick=()=>{
   if(b.classList.contains('no'))return;
   if(+b.dataset.j===item.c){b.classList.add('ok');right();}else{b.classList.add('no');wrong();}});}
 else if(item.k==='tf'){card.querySelectorAll('.wh-o').forEach(b=>b.onclick=()=>{
   if(b.classList.contains('no'))return;
   if((b.dataset.v==='1')===item.tf){b.classList.add('ok');right();}else{b.classList.add('no');wrong();}});}
 else{const inp=document.getElementById('whin'),ok=document.getElementById('whok');
  const go=()=>{const v=inp.value.trim();if(!v)return;if(match(v,item)){inp.style.borderColor='#227A63';right();}else{wrong();inp.select();}};
  ok.onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go();};setTimeout(()=>inp.focus(),300);}
 document.getElementById('whhb').onclick=hint;
}
const clean=s=>String(s==null?'':s).toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')
 .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[.,!?؟،"'«»()\-]/g,' ').replace(/\s+/g,' ').trim();
const core=s=>clean(s).replace(/^(ال|the |a |an )/,'').replace(/ /g,'');
function match(v,item){
 if(item.num)return +clean(v).replace(/[^\d.]/g,'')===+item.a&&clean(v).replace(/[^\d.]/g,'')!=='';
 const list=[].concat(item.accept||[],item.a!==undefined?[item.a]:[]);
 const cv=core(v);return list.some(x=>core(x)===cv);
}
function wrong(){
 CUR.tries++;SESSION.streak=0;oops();
 const c=document.getElementById('whcard');c.classList.remove('wh-shake');void c.offsetWidth;c.classList.add('wh-shake');
 const msgs=['حاولي مرَّة أُخرى 💪','قريبة! فكِّري قليلًا 🤔','لا تستسلمي، أنتِ قادرة 🌟','جرِّبي من جديد 💖'];
 document.getElementById('whfb').innerHTML=`<span style="color:#C9553F">${msgs[(CUR.tries-1)%msgs.length]}</span>`;
 const top=document.querySelector('.wh-sc');if(top)top.textContent=`⭐ ${AR(SESSION.stars)} · 🔥 ${AR(SESSION.streak)}`;
 if(CUR.tries>=1)document.getElementById('whhb').style.display='inline-block';
}
function hint(){
 const it=CUR.item;CUR.hints++;const box=document.getElementById('whhint');
 if(it.k==='mcq'){const wrongs=[...document.querySelectorAll('#whcard .wh-o:not(.no)')].filter(b=>+b.dataset.j!==it.c);
  if(wrongs.length){wrongs[0].classList.add('no');box.innerHTML='<div class="wh-hint">💡 أزلتُ إجابةً خاطئة، اختاري من الباقي.</div>';}
  else box.innerHTML='<div class="wh-hint">💡 بقيت إجابة واحدة… إنَّها هي!</div>';}
 else if(it.k==='tf'){box.innerHTML=`<div class="wh-hint">💡 اقرئي العبارة كلمةً كلمة، وتذكَّري درسكِ.${it.why?'<br>'+it.why:''}</div>`;}
 else{const ans=String(it.num?AR(it.a):it.a).trim();
  if(it.num){const ds=[...ans];box.innerHTML=`<div class="wh-hint">💡 الجواب عددٌ من ${AR(ds.length)} ${ds.length<=2?'رقم':'أرقام'}، يبدأ بـ <b>${ds.slice(0,Math.min(ds.length-1,CUR.hints)||1).join('')}</b></div>`;return;}
  const words=ans.split(/\s+/),letters=[...ans.replace(/\s+/g,'')];
  const shown=[...ans].slice(0,Math.min(ans.length-1,CUR.hints+(ans.startsWith('ال')?2:0))).join('');
  box.innerHTML=`<div class="wh-hint">💡 تبدأ الإجابة بـ «<b dir="auto">${shown}</b>» · عدد حروفها ${AR(letters.length)}${words.length>1?' · '+(words.length===2?'كلمتان':AR(words.length)+' كلمات'):''}</div>`;}
}
function right(){
 const it=CUR.item;let n=CUR.tries===0?3:CUR.tries===1?2:1;if(CUR.bonus)n*=2;
 SESSION.stars+=n;SESSION.streak++;SESSION.won++;
 markSeen(it.q);giveStars(n);win();
 try{if(window.FX){FX.confetti();if(CUR.tries===0)FX.fireworks();
  FX.banner((SESSION.streak>=3?'🔥 سلسلة '+AR(SESSION.streak)+'! ':'🎉 ')+'أحسنتِ يا '+who()+'! +'+AR(n)+' ⭐');}}catch(e){}
 const praise=['رائعة! 🌟','عبقريَّة! 🧠','ممتاز! 🏆','مُبدعة! 🎨','بطلة! 👑'];
 document.getElementById('whcard').querySelectorAll('.wh-o,.wh-in,#whok,#whhb').forEach(x=>x.disabled=true);
 document.getElementById('whfb').innerHTML=`<div class="wh-big" style="font-size:52px">${CUR.tries===0?'🏆':'⭐'}</div>
  <span style="color:#227A63;font-size:19px">${praise[Math.floor(Math.random()*praise.length)]} +${AR(n)} ⭐</span>
  ${it.why?`<div style="font-weight:600;color:#5b5b6b;font-size:14px;margin-top:6px">${it.why}</div>`:''}
  <div><button class="wh-btn" onclick="wheelAgain()">🎡 لفَّة جديدة</button></div>`;
 document.getElementById('whhb').style.display='none';document.getElementById('whhint').innerHTML='';
 const top=document.querySelector('.wh-sc');if(top)top.textContent=`⭐ ${AR(SESSION.stars)} · 🔥 ${AR(SESSION.streak)}`;
}
window.wheelDebug=function(k){const U=k==null?null:(typeof k==='number'?units()[k]:units().find(u=>u.k===String(k)));const p=buildPool(U);if(arguments[1])return p[arguments[1]].slice(0,arguments[2]||4).map(x=>x.q.replace(/<br>/g,' / ')+(x.o?'  ['+x.o.join(' | ')+']':''));const o={};for(const k in p)o[k]=p[k].length;return o;};
window.wheelAgain=function(){POOL=buildPool(UNIT);showWheel();};
window.wheelOpen=function(k){
 ensureCss();const U=typeof k==='number'?units()[k]:units().find(u=>u.k===String(k));UNIT=U?{k:U.k,idx:U.idx,name:U.name||unitName(U)}:null;POOL=buildPool(UNIT);SESSION={stars:0,streak:0,won:0};
 let ov=document.getElementById('whov');if(!ov){ov=document.createElement('div');ov.id='whov';document.body.appendChild(ov);}
 ov.style.display='block';document.body.style.overflow='hidden';showWheel();
};
window.wheelClose=function(){const ov=document.getElementById('whov');if(ov){ov.style.display='none';ov.innerHTML='';}
 document.body.style.overflow='';
 try{if(typeof goMap==='function'&&document.querySelector('#stage [onclick^="exChoose"]'))goMap();}catch(e){}};

/* ---------- عجلة بعد كلِّ وحدة على الخريطة (تُضاف تلقائيًّا) ---------- */
function addBtn(){const st=document.getElementById('stage');if(!st)return;
 if(!st.querySelector('[onclick^="exChoose"]')||st.querySelector('.wh-unit'))return;
 ensureCss();
 units().forEach((U,n)=>{const last=rowOf(U.idx[U.idx.length-1]);if(!last)return;U.name=unitName(U);
  const lessonsTxt=U.idx.map(i=>lessons()[i].name).filter(Boolean);
  const d=document.createElement('div');d.className='wh-unit';
  d.innerHTML=`<button class="wh-open" onclick="wheelOpen(${n})">🎡 عجلة ألغاز ${U.idx.length>1?'الوحدة':'الدَّرس'}</button>
   <div class="wh-unitsub">${lessonsTxt.length>3?'من '+AR(lessonsTxt.length)+' دُروس: '+esc2(lessonsTxt.slice(0,3).join('، '))+'…':'من دُروس: '+esc2(lessonsTxt.join('، '))}</div>`;
  last.parentNode.insertBefore(d,last.nextSibling);});}
function boot(){const st=document.getElementById('stage');if(!st)return;addBtn();new MutationObserver(addBtn).observe(st,{childList:true,subtree:true});}
if(document.readyState==='loading')addEventListener('DOMContentLoaded',boot);else setTimeout(boot,0);
})();

drawStars();applySound();profBoot();
</script>
</body>
</html>
