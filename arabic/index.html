<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#B0553C">
<title>قرية القصص 🏘️ لُغتي · الفصل الدراسي الأوّل</title>
<meta name="apple-mobile-web-app-title" content="قرية القصص">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF6EE;--card:#fff;--ink:#4A2E24;--terra:#B0553C;--terraD:#8A3F2B;--sun:#F5C544;--rose:#EF7FA8;--mint:#4EB39A;--line:#EADFD3;--violet:#7A63C9;--sky:#7FB3E6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Baloo Bhaijaan 2','Segoe UI',Tahoma,sans-serif;background:linear-gradient(180deg,#F6E7DA 0%,var(--paper) 40%);color:var(--ink);min-height:100vh}
#app{max-width:640px;margin:0 auto;padding:12px 14px 60px}
#top{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:18px;padding:8px 14px;box-shadow:0 3px 0 var(--line);margin-bottom:12px;font-weight:800;color:var(--terraD)}
#top button{border:none;background:#F7EFE6;border-radius:12px;padding:6px 14px;font-size:15px}
.chip{display:inline-block;background:var(--terra);color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:3px 14px;margin-bottom:10px}
.chip.prep{background:var(--mint)}.chip.think{background:var(--violet)}
.card{background:var(--card);border-radius:24px;padding:20px 18px;box-shadow:0 4px 0 var(--line);text-align:center}
h1{font-size:24px;margin:6px 0 4px}h2{font-size:20px;margin:4px 0 12px;line-height:1.5}
p.sub{margin:0 0 12px;font-size:15px;color:#7A5F52;line-height:1.7}
.big{font-size:48px;margin:2px 0}
button{font-family:inherit;font-weight:800;font-size:17px;color:var(--ink);background:#F7EFE6;border:2px solid var(--line);border-radius:18px;padding:12px 16px;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.96)}
.go{background:var(--terra);border-color:var(--terraD);color:#fff;font-size:18px;padding:12px 30px;box-shadow:0 4px 0 var(--terraD)}
.go:disabled{opacity:.4;box-shadow:none}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.opts button.ok,.pool button.ok,.mcol button.done{background:#DDF3EC;border-color:var(--mint);color:#227A63}
.opts button.bad,.pool button.bad,.mcol button.bad{background:#FBE3E3;border-color:#E39B9B;color:#9B3B3B}
.locked{pointer-events:none}
.wrong{animation:wig .35s}@keyframes wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.hintPulse{animation:pul 1s infinite}@keyframes pul{50%{box-shadow:0 0 0 6px rgba(245,197,68,.45)}}
.qbox{background:#FBF6EE;border:2px solid var(--line);border-radius:18px;padding:14px;font-size:19px;line-height:1.9;margin-bottom:12px}
.txt{font-size:22px;line-height:2;font-weight:700;color:var(--terraD)}
.ans{background:#FFF9E3;border:2px solid var(--sun);border-radius:18px;padding:12px;font-size:16px;line-height:1.8;margin:12px 0;display:none;text-align:right}
.ans.show{display:block}
.marks{display:none;gap:10px;justify-content:center;flex-wrap:wrap}.marks.show{display:flex}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.pool button{font-size:17px}.pool button.sel{background:#FFF3D6;border-color:var(--sun)}
.bins{display:flex;gap:8px}
.bin{flex:1;background:#FBF6EE;border:2px dashed var(--terra);border-radius:18px;min-height:100px;padding:8px}
.bin h3{margin:2px 0 6px;font-size:14px;color:var(--terraD)}
.bin .got{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bin .got span{background:#fff;border-radius:12px;padding:4px 10px;font-size:14px;font-weight:700;border:1px solid var(--line)}
.mcols{display:flex;gap:10px;margin-top:8px}.mcol{flex:1;display:flex;flex-direction:column;gap:8px}
.mcol button{font-size:15px;padding:11px 8px;line-height:1.5}.mcol button.pick{background:#FFF3D6;border-color:var(--sun)}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.slot{min-width:60px;min-height:48px;border:2px dashed #DCC9B8;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#C9B4A2;padding:4px 8px}
.slot.fill{border-style:solid;border-color:var(--mint);background:#DDF3EC;color:#227A63}
.arrow{align-self:center;color:#C9B4A2}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.vcard{background:#FBF6EE;border:2px solid var(--line);border-radius:16px;padding:14px 10px;min-height:86px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800;font-size:18px;line-height:1.5}
.vcard.open{background:#FFF9E3;border-color:var(--sun);font-weight:700;font-size:14px;line-height:1.7}
/* map */
.uhead{margin:20px 4px 8px;font-size:18px;font-weight:800;color:var(--terraD)}
.lrow{background:var(--card);border-radius:18px;box-shadow:0 3px 0 var(--line);padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.lrow.done{background:#F2F8F3;box-shadow:0 3px 0 #BFE3D7}
.lic{font-size:28px;width:44px;text-align:center;position:relative;filter:grayscale(.7);opacity:.75}
.lrow.done .lic{filter:none;opacity:1}
.tick{position:absolute;top:-8px;right:-8px;background:var(--mint);color:#fff;border-radius:50%;width:22px;height:22px;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;filter:none;opacity:1}
.lt{flex:1;text-align:right}.lt b{font-size:15px;display:block;line-height:1.35}.lt small{color:#9A8172;font-weight:700;font-size:12px}
.lbtns{display:flex;flex-direction:column;gap:5px}
.lbtns button{font-size:12.5px;padding:6px 10px;border-radius:12px;white-space:nowrap}
.bprep{background:#E4F4EF;border-color:#BFE3D7;color:#227A63}.bprep.done{background:#CFEDE3;border-color:var(--mint)}
.btest{background:#FFF3D6;border-color:#F0DBA0;color:#9A7A17}.btest.done{background:#DDF3EC;border-color:var(--mint);color:#227A63}
.bthink{background:#F0ECFA;border-color:#D9CCEC;color:var(--violet)}.bthink.done{background:#E3DCF5;border-color:var(--violet)}
.pbar{height:8px;background:#F1E7DC;border-radius:99px;margin:0 0 12px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--terra);border-radius:99px;transition:width .4s}
/* book */
.page{background:#FFFDF8;border:2px solid var(--line);border-radius:18px;padding:18px;min-height:300px;text-align:right;box-shadow:inset 8px 0 14px -10px rgba(0,0,0,.15)}
.page h2{color:var(--terraD)}
.stk{display:flex;gap:10px;justify-content:center;margin:8px 0}.stk button{font-size:26px;padding:6px 14px}.stk button.on{background:#FFF3D6;border-color:var(--sun)}
textarea{width:100%;font-family:inherit;font-size:17px;border:2px solid var(--line);border-radius:14px;padding:10px;min-height:70px;resize:vertical}

.an-plane{animation:plane 22s linear infinite}@keyframes plane{0%{transform:translate(-160px,0)}50%{transform:translate(280px,-18px)}100%{transform:translate(760px,6px)}}
.an-cabin{animation:cabin 14s ease-in-out infinite alternate}@keyframes cabin{to{transform:translate(104px,-80px)}}
.an-sway{transform-box:fill-box;transform-origin:bottom center;animation:sway 4s ease-in-out infinite alternate}@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.an-wave{transform-box:fill-box;transform-origin:left center;animation:wv 1.4s ease-in-out infinite alternate}@keyframes wv{from{transform:skewY(-6deg)}to{transform:skewY(6deg)}}
.an-spin{animation:spin 50s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.an-orbit{animation:spin 12s linear infinite}
.an-drop{stroke-dasharray:4 8;animation:drop .5s linear infinite}@keyframes drop{to{stroke-dashoffset:-12}}
.an-bob{animation:bob 1.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.an-twinkle{animation:tw 2s ease-in-out infinite alternate}@keyframes tw{to{opacity:.25}}
.an-bus{animation:bus 18s linear infinite}@keyframes bus{0%{transform:translateX(-140px)}100%{transform:translateX(700px)}}
@media (prefers-reduced-motion:reduce){[class^="an-"]{animation:none}}
#ovl{position:fixed;inset:0;background:rgba(74,46,36,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#ovl.show{display:flex}#ovl .inner{background:var(--card);border-radius:28px;padding:28px 22px;text-align:center;max-width:420px;animation:pop .45s}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.conf{position:fixed;font-size:24px;z-index:60;animation:fall 1.6s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.2}}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) scale(.6);background:var(--mint);color:#fff;font-weight:800;font-size:19px;padding:10px 26px;border-radius:999px;box-shadow:0 6px 0 #227A63;z-index:70;opacity:0;pointer-events:none;transition:all .25s}
#toast.show{opacity:1;transform:translateX(-50%) scale(1)}
footer{text-align:center;font-size:12px;color:#B39A8B;margin-top:26px}footer button{border:none;background:none;color:#C9B4A2;font-size:11px;text-decoration:underline;padding:4px 6px}
</style>
</head>
<body>
<div id="app">
 <div id="top"><button id="backB" style="visibility:hidden" onclick="goMap()">🏡 الخريطة</button><button id="sndB" onclick="toggleSound()" style="font-size:18px">🔊</button><span>⭐ <span id="stars">0</span></span></div>
 <div id="stage"></div>
 <footer>لُغتي · الصفّ الثالث · الفصل الدراسي الأوّل<br>
  <button onclick="exLog()">📊 سجل الاختبارات</button> · <button onclick="exportP()">حفظ نسخة من تقدّمي</button> · <button onclick="document.getElementById('imp').click()">استرجاع نسخة</button> · <button onclick="hardReset()">بداية جديدة</button>
  <input type="file" id="imp" accept="application/json" style="display:none" onchange="importP(this)"></footer>
</div>
<div id="ovl"><div class="inner"></div></div><div id="toast"></div>

<script>
/* ==================== الدروس ==================== */
const U=['مراجعة','الوحدة الأولى: التعامل مع الآخرين','الوحدة الثانية: رُبوع من بلادي','الوحدة الثالثة: أخلاق المسلم','الوحدة الرابعة: وسائل الاتّصالات'];
const L=[
{u:0,name:'مراجعة المكتسبات',ic:'🔤',st:'أعرف ال الشَّمسية وال القمرية والتنوين.',
 words:[['ال الشَّمسية','لا نلفظ اللام: الشَّمس، الرَّبيع'],['ال القمرية','نلفظ اللام: القمر، البيت'],['التنوين','ــٌ ــً ــٍ في آخر الكلمة']],
 guess:['في كلمة «الشَّمس»، هل نلفظ اللام؟','لا. هي ال شمسية: نلفظ الشين مشدّدة.'],
 test:[
  {t:'sort2',q:'ال شمسية أم قمرية؟',bins:['ال الشَّمسية ☀️','ال القمرية 🌙'],items:[['السَّماء',0],['البيت',1],['الدِّين',0],['الحجّ',1],['الرَّبيع',0],['الكوثر',1]]},
  {t:'sort2',q:'ما نوع التنوين؟',bins:['تنوين ضمّ ــٌ','تنوين فتح ــً','تنوين كسر ــٍ'],items:[['سبّورةٌ',0],['فناءً',1],['صيفٍ',2],['بدرٌ',0],['حديقةً',1],['طالبٍ',2]]},
  {t:'mcq',q:'كلمة فيها ال شمسية:',o:['الشَّجرة','القلم','الكتاب'],c:0,why:'الشين بعد ال مشدّدة ولا نلفظ اللام.'},
  {t:'mcq',q:'كلمة فيها ال قمرية:',o:['الجَمل','النَّمل','الصَّلاة'],c:0,why:'نلفظ اللام في «الجمل».'},
  {t:'tf',q:'«في ال الشمسية لا نلفظ اللام.»',c:true,fix:'صحيح! ونضع شدّة على الحرف بعدها.'},
  {t:'mcq',q:'تنوين الفتح يُكتب غالبًا مع ألف:',o:['كتابًا','كتابٌ','كتابٍ'],c:0,why:'ــً + ألف.'},
  {t:'mcq',q:'العلامة ( ــٍ ) اسمها:',o:['تنوين كسر','تنوين ضمّ','شدّة'],c:0},
  {t:'read',q:'السَّماءُ صافيةٌ، والشَّمسُ مُشرقةٌ.'}],
 think:[
  {t:'sort2',q:'صنّفي بسرعة!',bins:['ال الشَّمسية ☀️','ال القمرية 🌙'],items:[['الطَّريق',0],['اللَّيل',0],['القدر',1],['المنارة',1],['الزَّكاة',0],['الهُدهُد',1]]},
  {t:'order',q:'رتّبي الكلمات لتكوّني جملة.',seq:['أحبُّ','لغتي','الجميلةَ']},
  {t:'mcq',q:'أيّ الكلمات فيها تنوين ضمّ؟',o:['مدرسةٌ','مدرسةً','مدرسةٍ'],c:0},
  {t:'open',q:'قولي جملة فيها كلمة بتنوين فتح.',a:'مثال: قرأتُ كتابًا جديدًا.'}]},
/* ---------- 1 ---------- */
{u:1,name:'عادل في الطَّائرة',ic:'✈️',st:'تعلّمتُ من عادل حُسن التصرّف في الطائرة.',
 words:[['يتأمّل','يُطيل النَّظر'],['ضجيجًا','صوتًا عاليًا مزعجًا'],['مُشرِّفة','حسنة وجميلة'],['إقلاع الطَّائرة','انطلاقها وارتفاعها']],
 guess:['ماذا تفعلين لو رأيتِ امرأة تحمل طفلًا ولا تجد مقعدًا؟','أقوم لها عن مقعدي، مثل عادل.'],
 test:[
  {t:'mcq',q:'لماذا فرحت أسرة عادل؟',o:['جاء الوالد بتذاكر السفر','اشتروا سيّارة','انتهت المدرسة'],c:0},
  {t:'mcq',q:'ماذا فعل عادل مع المرأة التي لم تجد مقعدًا؟',o:['قام عن مقعده وأجلسها','تركها واقفة','نادى المضيف'],c:0},
  {t:'mcq',q:'من أرشد عادلًا إلى مقعده؟',o:['المُضيف','المهندس','الوالد'],c:0},
  {t:'mcq',q:'لماذا ربط عادل حزام الأمان؟',o:['استعدادًا لإقلاع الطَّائرة','ليلعب','لينام'],c:0},
  {t:'mcq',q:'قال الأب: الطَّائرة ...',o:['وسيلة للسَّفر','مكان للّعب','ملعب'],c:0},
  {t:'match',q:'الكلمة وضدّها.',pairs:[['أقلعت','هبطت'],['استقبل','ودّع'],['أرشد','أضلّ'],['اهتمّ','أهمل']]},
  {t:'sort2',q:'تاء مربوطة أم مفتوحة؟',bins:['تاء مربوطة ة','تاء مفتوحة ت'],items:[['الطَّائرة',0],['المجلَّات',1],['أسرة',0],['تعليمات',1],['حقيبة',0],['البنت',1]]},
  {t:'sort2',q:'من النصّ: ال شمسية أم قمرية؟',bins:['ال الشَّمسية ☀️','ال القمرية 🌙'],items:[['السَّلامة',0],['المطار',1],['الطَّائرة',0],['الجميع',1],['الرِّحلة',0],['المُضيف',1]]},
  {t:'mcq',q:'جهّز أفراد الأسرة حقائبهم ... عادلًا.',o:['إلَّا','ثمَّ','و'],c:0,why:'نستثني بـ «إلّا».'},
  {t:'read',q:'صعد عادلٌ إلى الطَّائرة بهدوء، ووجد المُضيفَ في استقباله.'}],
 think:[
  {t:'order',q:'رتّبي أحداث القصّة.',seq:['جاء الوالد بالتذاكر','وصلت الأسرة إلى المطار','صعد عادل إلى الطَّائرة','ربط حزام الأمان','طالع مجلَّة','رأى الأطفال يركضون']},
  {t:'mcq',q:'صعد المسافرون بهدوء إلَّا ...',o:['طفلًا','الطَّائرة','بهدوء'],c:0},
  {t:'mcq',q:'كلمة فيها مدّ بالواو:',o:['صُعود','عادل','كبيرة'],c:0,why:'صُعُود: واو ساكنة بعد ضمّة.'},
  {t:'open',q:'كيف تتصرّفين لو رأيتِ أطفالًا يركضون في ممرّات الطَّائرة؟',a:'أنصحهم بلطف أن يجلسوا؛ الطَّائرة ليست مكانًا للّعب.'}]},
/* ---------- 2 ---------- */
{u:1,name:'عامٌ دراسيٌّ جديد',ic:'🎒',st:'أتمنّى أن تسود المحبّة بيني وبين زميلاتي.',
 words:[['تسود','تكثر وتعمّ'],['المُشاحنات','العداوات'],['خِيارُكم','أفاضلكم'],['محطّ أنظار','موضع اهتمام']],
 guess:['ماذا تتمنّين مع بداية العام الدراسي؟','أن أكون متفوّقة، وأن تسود المحبّة بيننا.'],
 test:[
  {t:'mcq',q:'ماذا طلب المعلّم من التلاميذ أوّلًا؟',o:['أن يعرّفوا بأنفسهم','أن يكتبوا واجبًا','أن يخرجوا'],c:0},
  {t:'mcq',q:'ماذا تمنّى أحمد؟',o:['أن يكون من المتفوّقين','أن ينام أكثر','أن يلعب'],c:0},
  {t:'mcq',q:'حلّ مشكلة الاستيقاظ صباحًا:',o:['أن أنام مبكّرًا','ألّا أذهب للمدرسة','أن أنام في الصفّ'],c:0},
  {t:'mcq',q:'ماذا تمنّى فوّاز؟',o:['أن تسود روح المحبّة','أن يكون الأوّل','أن يسافر'],c:0},
  {t:'match',q:'الكلمة ومعناها.',pairs:[['تسود','تكثر وتعمّ'],['المشاحنات','العداوات'],['خيارُكم','أفاضلكم'],['يُسْر','سهولة']]},
  {t:'sort2',q:'بماذا تنتهي الكلمة؟',bins:['تاء مربوطة ة','تاء مفتوحة ت','هاء ه'],items:[['المدرسة',0],['بيت',1],['وجهه',2],['المحبّة',0],['إجابات',1],['أنظاره',2]]},
  {t:'sort2',q:'همزة وصل أم قطع؟',bins:['همزة وصل ا','همزة قطع أ'],items:[['استيقاظ',0],['أسعد',1],['اكتمل',0],['أحسنت',1],['انتباه',0],['أخلاق',1]]},
  {t:'mcq',q:'حضر التلاميذ ... تلميذٍ.',o:['غيرَ','إلى','في'],c:0,why:'نستثني بـ «غير».'},
  {t:'mcq',q:'لوّن الرسّام الغزال غير ...',o:['الرَّأس','الغزال','لوّن'],c:0},
  {t:'read',q:'يا أبنائي، ما أجملَ حُسنَ الخُلق!'}],
 think:[
  {t:'order',q:'كوّني جملة.',seq:['تسودُ','المحبّةُ','بين','الجميعِ']},
  {t:'sort2',q:'صباحًا أم مساءً؟',bins:['صباحًا 🌅','مساءً 🌙'],items:[['أستيقظ للّحاق بالمدرسة',0],['أخلد إلى النَّوم',1],['تخرج الطُّيور من أعشاشها',0],['تعود الطُّيور إلى أعشاشها',1]]},

/* ==================== الصوت والتشجيع ==================== */
function ac(){return window.__ac||(window.__ac=new (window.AudioContext||window.webkitAudioContext)());}
function tone(f,t0,d,type,vol,dest){if(!sndOn())return;const C=ac();const o=C.createOscillator(),g=C.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+.02);g.gain.exponentialRampToValueAtTime(.0005,t0+d);o.connect(g);g.connect(dest||C.destination);o.start(t0);o.stop(t0+d+.05);}
function beepBad(){try{tone(200,ac().currentTime,.25,'sine',.12);}catch(e){}}
function sparkle(){try{const C=ac(),t0=C.currentTime;[523,659,784,1047,1319].forEach((f,i)=>{tone(f,t0+i*.07,.4,'sine',.13);tone(f*2,t0+i*.07,.25,'sine',.035);});tone(2093,t0+.42,.6,'sine',.05);}catch(e){}}
function tada(){try{const C=ac(),t0=C.currentTime;const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;lp.connect(C.destination);const chord=(fs,t,d)=>fs.forEach(f=>{tone(f,t,d,'triangle',.085,lp);tone(f/2,t,d,'sine',.06,lp);});chord([523,659,784],t0,.34);chord([587,740,880],t0+.32,.34);chord([659,831,988],t0+.64,.4);chord([784,988,1175,1568],t0+1.0,1.3);[1568,1976,2349,3136].forEach((f,i)=>tone(f,t0+1.06+i*.08,.7,'sine',.05));}catch(e){}}
let __nz=null;function noiseBuf(){const C=ac();if(__nz)return __nz;const b=C.createBuffer(1,Math.floor(C.sampleRate*0.06),C.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);__nz=b;return b;}
function applause(big){if(!sndOn())return;try{const C=ac(),t0=C.currentTime;const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1700;const g=C.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(big?.55:.32,t0+.35);g.gain.setValueAtTime(big?.55:.32,t0+(big?1.7:.9));g.gain.exponentialRampToValueAtTime(.001,t0+(big?2.8:1.7));lp.connect(g);g.connect(C.destination);const n=big?80:40,dur=big?2.3:1.3;for(let k=0;k<n;k++){const s=C.createBufferSource();s.buffer=noiseBuf();const bp=C.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500+Math.random()*1900;bp.Q.value=.7;const cg=C.createGain();const at=t0+Math.random()*dur;cg.gain.setValueAtTime(.3+Math.random()*.3,at);cg.gain.exponentialRampToValueAtTime(.001,at+.1);s.connect(bp);bp.connect(cg);cg.connect(lp);s.start(at);}}catch(e){}}
function confetti(n){const em=['⭐','📖','✨','🌸','💛','✒️'];for(let i=0;i<(n||18);i++){const s=document.createElement('span');s.className='conf';s.textContent=em[i%em.length];s.style.left=Math.random()*100+'vw';s.style.top='-30px';s.style.animationDelay=(Math.random()*.5)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2200);}}
const PRAISE=['أحسنتِ يا ماريا! 🌟','رائع! 👏','ممتاز يا قارئة! 📖','صحيح! برافو 🎉','لُغتكِ جميلة! ✨','أنتِ نجمة! ⭐'];let __ts=null;
function cheer(){const tt=document.getElementById('toast');tt.textContent=PRAISE[Math.floor(Math.random()*PRAISE.length)];tt.classList.add('show');clearTimeout(__ts);__ts=setTimeout(()=>tt.classList.remove('show'),1300);sparkle();confetti(8);}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

function goMap(){cur=-1;document.getElementById('backB').style.visibility='hidden';
 const doneN=ST.after.length;
 let html=`<div class="card" style="padding:16px"><div class="big" style="font-size:40px">🏘️✒️</div>

  <div class="pbar"><i style="width:${Math.round(doneN/L.length*100)}%"></i></div>

 let lastU=-1;
 L.forEach((l,i)=>{if(l.u!==lastU){html+=`<div class="uhead">${U[l.u]}</div>`;lastU=l.u;}
  const bd=ST.before.includes(i),ad=ST.after.includes(i),td=ST.think.includes(i);

   <div class="lt"><b>${l.name}</b><small>${ad&&bd&&td?'✓ مكتمل بالكامل':ad?'✓ تمّ · 🏘️ مكان':bd?'مستعدّة ✔':''}</small></div>

 stage.innerHTML=html;window.scrollTo({top:0});drawStars();}

 if(s.t==='vocab'){const l=s.l;let seen=0;
  stage.innerHTML=`${chip('📖 قبل الحصّة · '+l.name,'prep')}<div class="card"><p class="sub">اضغطي على الكلمة لتري معناها.</p>
   <div class="vgrid">${l.words.map((v,k)=>`<div class="vcard" data-k="${k}">${v[0]}</div>`).join('')}</div>
   <div class="nav" style="margin-top:14px"><button class="go" id="vn" disabled>عرفتُ الكلمات (0/${l.words.length})</button></div></div>`;

  stage.querySelectorAll('.vcard').forEach(c=>{const k=+c.dataset.k;c.onclick=()=>{const o=c.classList.toggle('open');c.textContent=o?l.words[k][1]:l.words[k][0];
   if(o&&!c.dataset.s){c.dataset.s=1;seen++;try{tone(660,ac().currentTime,.15,'sine',.08);}catch(e){}vn.textContent=`عرفتُ الكلمات (${seen}/${l.words.length})`;if(seen===l.words.length)vn.disabled=false;}};});
  vn.onclick=next;return;}

  stage.innerHTML=`${chip('📖 قبل الحصّة','prep')}<div class="card"><div class="big">🎒✨</div><h1>مستعدّة يا ماريا!</h1><p class="sub">بعد الحصّة: اختبار ← مكان جديد في القرية 🏘️</p><button class="go" onclick="goMap()">الخريطة 🏡</button></div>`;return;}
 if(s.t==='badge'){const first=!ST.after.includes(s.i);if(first){ST.after.push(s.i);save();}confetti();tada();applause(false);
  const ov=document.getElementById('ovl');ov.querySelector('.inner').innerHTML=`<div class="big">🏘️${s.l.ic}</div><h1>${first?'مكان جديد في القرية!':'أحسنتِ!'}</h1><p class="sub">${first?'أُضيف <b>'+VILL[s.i].n+'</b> إلى قرية القصص 🌟':'راجعتِ الدرس من جديد 🌟'}</p>
   <button class="go" onclick="document.getElementById('ovl').classList.remove('show');goBook(${s.i})">شاهدي القرية 🏘️</button><div style="height:8px"></div><button onclick="document.getElementById('ovl').classList.remove('show');goMap()">الخريطة</button>`;ov.classList.add('show');return;}
 if(s.t==='thinkDone'){const first=!ST.think.includes(s.i);if(first){ST.think.push(s.i);addStar(3);}confetti();tada();
  stage.innerHTML=`${chip('🧠 فكّري أكثر','think')}<div class="card"><div class="big">🧠✨</div><h1>لُغتكِ تكبر!</h1><p class="sub">${first?'٣ نجوم إضافية ⭐':'رائع أنكِ عدتِ!'}</p><button class="go" onclick="goMap()">الخريطة 🏡</button></div>`;return;}
 const cls=s.prep?'prep':s.think?'think':'';
 if(s.t==='mcq')return rMcq(s,cls);if(s.t==='open')return rOpen(s,cls);if(s.t==='sort2')return rSort(s,cls);if(s.t==='match')return rMatch(s,cls);if(s.t==='order')return rOrder(s,cls);if(s.t==='tf')return rTf(s,cls);if(s.t==='read')return rRead(s,cls);}

function rMcq(s,cls){
 stage.innerHTML=`${chip(s.stage,cls)}<div class="card"><div class="qbox">${s.q}</div><div class="opts">${s.o.map((o,i)=>`<button data-i="${i}">${o}</button>`).join('')}</div><div class="ans" id="fx"></div><div class="marks" id="mk"><button class="go" onclick="next()">تابعي ⬅</button></div></div>`;

  else{beepBad();b.classList.add('wrong','bad');showFix(`❌ الإجابة الصحيحة: <b>${s.o[s.c]}</b>${s.why?'<br>💡 '+s.why:''}`,true);}});}

function rSort(s,cls){let sel=null,left=s.items.length,miss=0;
 stage.innerHTML=`${chip(s.stage,cls)}<div class="card"><div class="qbox">${s.q}</div>
  <div class="pool" id="pl">${shuffle(s.items.map((it,i)=>i)).map(i=>`<button data-i="${i}">${s.items[i][0]}</button>`).join('')}</div>
  <div class="bins">${s.bins.map((b,i)=>`<div class="bin" data-b="${i}"><h3>${b}</h3><div class="got"></div></div>`).join('')}</div><div class="ans" id="fx"></div></div>`;
 const pl=stage.querySelector('#pl');
 pl.querySelectorAll('button').forEach(b=>b.onclick=()=>{pl.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;stage.querySelectorAll('.bin').forEach(x=>x.classList.remove('hintPulse'));});
 stage.querySelectorAll('.bin').forEach(bin=>bin.onclick=()=>{if(!sel){showFix('اختاري كلمة أوّلًا 👆');return;}const i=+sel.dataset.i;
  if(s.items[i][1]===+bin.dataset.b){try{tone(660,ac().currentTime,.15,'sine',.08);}catch(e){}if(miss===0&&!s.prep)addStar();miss=0;bin.classList.remove('hintPulse');bin.querySelector('.got').insertAdjacentHTML('beforeend',`<span>${s.items[i][0]}</span>`);sel.remove();sel=null;left--;document.getElementById('fx').classList.remove('show');if(left===0){cheer();setTimeout(next,1000);}}

function rMatch(s,cls){let pick=null,left=s.pairs.length,miss=0;const R=shuffle(s.pairs.map((p,i)=>i));
 stage.innerHTML=`${chip(s.stage,cls)}<div class="card"><div class="qbox">${s.q}</div><div class="mcols"><div class="mcol">${s.pairs.map((p,i)=>`<button data-l="${i}">${p[0]}</button>`).join('')}</div><div class="mcol">${R.map(i=>`<button data-r="${i}">${s.pairs[i][1]}</button>`).join('')}</div></div><div class="ans" id="fx"></div></div>`;

/* ==================== 📝 اختبار تجريبي · محرك مشترك (يُضمَّن داخل كل تطبيق) ====================
   يعتمد على: EXAM_BANK (بنك الأوراق الحقيقية) و EXAM_CFG (إعدادات المادة) و دوال التطبيق: addStar, save, goMap,
   stage, applause, tada, confetti, ST.  لا أصوات ولا نجوم أثناء الاختبار؛ احتفال واحد في النهاية.           */
const EX={sec:[],ans:[],timer:null,left:0,kind:'',on:false};
const XAR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const XLAT=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const XORD=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'];
const XLET=['أ','ب','ج','د','هـ','و'];
const xsh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const xnorm=s=>String(s||'').replace(/[ً-ْٰـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/[^؀-ۿ0-9a-zA-Z\s]/g,' ').replace(/\s+/g,' ').trim();
const xesc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const XTITLE={tf:'ضعي علامة ✓ أو ✗ أمام كل عبارة',mcq:'اختاري الإجابة الصحيحة',match:'صلي كل عبارة بما يناسبها',fill:'أكملي الفراغ من الكلمات التالية (كل كلمة تُستعمل مرة واحدة)',order:'رتّبي',label:'حدّدي على الرسم',short:'اكتبي الإجابة',num:'أكملي',word:'حلّي المسألة بالخطوات الأربع',passage:'اقرئي النص ثم أجيبي',dictation:'إملاء منظور',sort:'صنّفي'};

/* ---------- تجميع الأسئلة المتاحة ---------- */
function exMergeAttempts(x,y){const m={};[...(x||[]),...(y||[])].forEach(a=>{if(a&&a.d)m[a.d]=a;});return Object.values(m).sort((p,q)=>p.d<q.d?-1:1);}
function exPool(lessons){const pool={};const add=it=>{(pool[it.t]=pool[it.t]||[]).push(it);};
 EXAM_BANK.filter(b=>lessons.includes(b.L)).forEach(b=>{let it=Object.assign({},b);if(it.t==='label'&&!it.targets&&EXAM_CFG.label)it=Object.assign(it,EXAM_CFG.label(it.fig));add(it);});
 lessons.forEach(L=>{try{(EXAM_CFG.gen(L)||[]).forEach(it=>{it.L=L;add(it);});}catch(e){}});
 return pool;}
function exDraw(pool,t,n){const src=xsh(pool[t]||[]);const out=[];const seen=new Set();
 for(const it of src){if(out.length>=n)break;const k=xnorm(it.q||it.text||'')+(it.seq||it.pairs||it.items||'');if(seen.has(k))continue;seen.add(k);out.push(it);}
 return out;}
function exBuild(lessons,short){const plan=short?EXAM_CFG.plan10:EXAM_CFG.plan20;const pool=exPool(lessons);const secs=[];let deficit=0;
 plan.forEach(p=>{let items=exDraw(pool,p.t,p.n);
  if(p.t==='passage'){items=items.slice(0,1);if(items.length){const ps=items[0];const sub=xsh(ps.items).slice(0,p.m);secs.push({t:'passage',title:XTITLE.passage,text:ps.text,L:ps.L,items:sub.map(s=>Object.assign({},s,{L:ps.L,m:1})),marks:sub.length});deficit+=p.m-sub.length;}else deficit+=p.m;return;}
  if(items.length<p.n)deficit+=(p.n-items.length)*p.m;
  if(items.length)secs.push({t:p.t,title:p.title||XTITLE[p.t],items:items.map(it=>Object.assign({},it,{m:p.m})),marks:items.length*p.m});});
 if(deficit>0){const extra=exDraw(pool,'mcq',deficit*3).filter(it=>!secs.some(s=>s.items.some(x=>x.q===it.q))).slice(0,deficit);
  const more=deficit-extra.length;const tfx=more>0?exDraw(pool,'tf',more):[];
  if(extra.length)secs.push({t:'mcq',title:XTITLE.mcq,items:extra.map(it=>Object.assign({},it,{m:1})),marks:extra.length});
  if(tfx.length)secs.push({t:'tf',title:XTITLE.tf,items:tfx.map(it=>Object.assign({},it,{m:1})),marks:tfx.length});}
 return secs;}

    ${ok?`<button class="go" style="font-size:15px;padding:9px 22px" onclick="exStart('${K.k}',${JSON.stringify(el)},false)">ابدئي الورقة الكاملة (${XAR(20)} درجة)</button>`

      :`<div style="font-size:13.5px;color:#9A3B3B">أنهي درسًا واحدًا على الأقل (✏️ بعد الحصة) من هذه الفترة أولًا.</div>`}

  <button onclick="goMap()" style="margin-top:6px">الخريطة 🏡</button></div>`;window.scrollTo({top:0});}

/* ---------- بدء الورقة ---------- */
function exStart(kind,lessons,short){EX.kind=kind;EX.short=!!short;EX.sec=exBuild(lessons,short);EX.ans=EX.sec.map(s=>s.items.map(()=>null));EX.on=true;
 EX.left=15*60;clearInterval(EX.timer);EX.timer=setInterval(()=>{EX.left--;const t=document.getElementById('xtimer');if(t)t.textContent='⏱ '+XAR(String(Math.floor(EX.left/60)).padStart(2,'0'))+':'+XAR(String(EX.left%60).padStart(2,'0'));if(EX.left<=0){clearInterval(EX.timer);exSubmit(true);}},1000);
 exRender();}
function exKindName(k){return k==='p1'?'اختبار الفترة الأولى':k==='p2'?'اختبار الفترة الثانية':'اختبار نهاية الفصل';}
function exRender(){const total=EX.sec.reduce((a,s)=>a+s.marks,0);
 let html=`<div class="xpaper">
  <div class="xhead"><div><b>الصف:</b> الثالث الابتدائي</div><div><b>المادة:</b> ${EXAM_CFG.subject}</div><div><b>اسم الطالبة:</b> ماريا</div><div><b>الدرجة:</b> ____ / ${XAR(total)}</div></div>
  <div class="xtitle">${exKindName(EX.kind)} · الفصل الدراسي الأول <span id="xtimer" class="xtimer">⏱ ١٥:٠٠</span></div>`;
 EX.sec.forEach((s,si)=>{html+=`<div class="xsec"><div class="xsech">السؤال ${XORD[si]||XAR(si+1)}: ${s.title} <span class="xmarks">(${XAR(s.marks)} ${s.marks===1?'درجة':s.marks===2?'درجتان':s.marks<=10?'درجات':'درجة'})</span></div>`;
  if(s.t==='passage')html+=`<div class="xpass">${xesc(s.text)}</div>`;
  s.items.forEach((it,ii)=>{html+=`<div class="xitem" id="xi_${si}_${ii}">${exItemHtml(it,si,ii)}</div>`;});
  html+='</div>';});
 html+=`<div style="text-align:center;margin-top:14px"><button class="go" onclick="exSubmit(false)">سلّمي الورقة ✅</button><div style="height:8px"></div><button onclick="if(confirm('تخرجين من الاختبار دون تسليم؟')){clearInterval(EX.timer);EX.on=false;goMap();}" style="font-size:13px">خروج بدون تسليم</button></div></div>`;
 stage.innerHTML=html;window.scrollTo({top:0});
 EX.sec.forEach((s,si)=>s.items.forEach((it,ii)=>exBind(it,si,ii)));}

/* ---------- عرض كل نوع ---------- */
function exItemHtml(it,si,ii){const id=`${si}_${ii}`;const num=`<span class="xn">${XAR(ii+1)}</span>`;
 switch(it.t){
 case 'tf':return `<div class="xrow">${num}<div class="xq">${xesc(it.q)}</div><div class="xtf"><button data-v="1">✓</button><button data-v="0">✗</button></div></div>`;
 case 'mcq':return `${num}<div class="xq">${xesc(it.q)}</div><div class="xopts">${it.o.map((o,k)=>`<button data-k="${k}"><span class="xlet">${XLET[k]}</span> ${xesc(o)}</button>`).join('')}</div>`;
 case 'match':{const R=xsh(it.pairs.map((p,k)=>k));it._R=R;return `${num}<div class="xq">${xesc(it.q)}</div><div class="xmatch"><div class="xcol">${it.pairs.map((p,k)=>`<button data-l="${k}">${xesc(p[0])}</button>`).join('')}</div><div class="xcol">${R.map(k=>`<button data-r="${k}">${xesc(it.pairs[k][1])}</button>`).join('')}</div></div>`;}
 case 'fill':{const bank=xsh(it.bank||it.items.map(x=>x[1]));return `${num}<div class="xq">${xesc(it.q)}</div><div class="xbank">${bank.map((w,k)=>`<button data-w="${k}">${xesc(w)}</button>`).join('')}</div>${it.items.map((x,k)=>`<div class="xblankrow"><span class="xn">${XAR(k+1)}</span> ${xesc(x[0]).replace(/\.{3,}|◯|_{2,}/,'<span class="xblank" data-b="'+k+'"></span>')}${/\.{3,}|◯|_{2,}/.test(x[0])?'':' <span class="xblank" data-b="'+k+'"></span>'}</div>`).join('')}`;}
 case 'sort':return `${num}<div class="xq">${xesc(it.q)}</div><div class="xbank">${xsh(it.items.map((x,k)=>k)).map(k=>`<button data-w="${k}">${xesc(it.items[k][0])}</button>`).join('')}</div><div class="xbins">${it.bins.map((b,k)=>`<div class="xbin" data-bin="${k}"><h4>${xesc(b)}</h4><div class="xgot"></div></div>`).join('')}</div>`;
 case 'order':return `${num}<div class="xq">${xesc(it.q)}</div><div class="xslots">${it.seq.map((_,k)=>`<div class="xslot" data-s="${k}">${XAR(k+1)}</div>`).join('')}</div><div class="xbank">${xsh(it.seq.map((x,k)=>k)).map(k=>`<button data-w="${k}">${xesc(it.seq[k])}</button>`).join('')}</div><div style="text-align:left"><button class="xreset" style="font-size:12px;padding:4px 10px">إعادة ↺</button></div>`;
 case 'label':return `${num}<div class="xq">${xesc(it.q)}</div><div class="xbank">${it.chips.map((c,k)=>`<button data-w="${k}">${xesc(c)}</button>`).join('')}</div><div class="xfig">${it.html}</div>`;
 case 'short':return `${num}<div class="xq">${xesc(it.q)}</div><textarea class="xta" placeholder="اكتبي إجابتكِ هنا…"></textarea>`;
 case 'num':return `${num}<div class="xq">${xesc(it.q)}</div><div class="xnum"><div class="xdisp">&nbsp;</div><div class="xkb">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-d="${d}">${XAR(d)}</button>`).join('')}<button data-d="del">⌫</button><button data-d="0">٠</button><button data-d="clr">مسح</button></div></div>`;
 case 'word':return `${num}<div class="xq">${xesc(it.q)}</div><div class="xsteps">

   <div class="xstep"><b>٣ أحل:</b><div class="xnum"><div class="xdisp">&nbsp;</div><div class="xkb">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-d="${d}">${XAR(d)}</button>`).join('')}<button data-d="del">⌫</button><button data-d="0">٠</button><button data-d="clr">مسح</button></div></div></div>
   <div class="xstep"><b>٤ أتحقق:</b> هل الجواب معقول؟ <button class="xchk" style="font-size:13px;padding:5px 12px">راجعتُ جوابي ✔</button></div></div>`;

 default:return `${num}<div class="xq">${xesc(it.q||'')}</div>`;}}

/* ---------- ربط التفاعل وتخزين الإجابات ---------- */
function exBind(it,si,ii){const el=document.getElementById(`xi_${si}_${ii}`);if(!el)return;const set=v=>{EX.ans[si][ii]=v;};
 const pickOne=(sel,attr)=>{el.querySelectorAll(sel).forEach(b=>b.onclick=()=>{el.querySelectorAll(sel).forEach(x=>x.classList.remove('xsel'));b.classList.add('xsel');set(b.dataset[attr]);});};
 switch(it.t){
 case 'tf':pickOne('.xtf button','v');break;
 case 'mcq':pickOne('.xopts button','k');break;
 case 'match':{let pick=null;const map={};set(map);
  el.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{el.querySelectorAll('[data-l]').forEach(x=>x.classList.remove('xsel'));b.classList.add('xsel');pick=+b.dataset.l;});
  el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(pick===null)return;const r=+b.dataset.r;Object.keys(map).forEach(k=>{if(map[k]===r)delete map[k];});map[pick]=r;
   el.querySelectorAll('[data-l]').forEach(x=>{x.classList.remove('xsel');const m=map[x.dataset.l];x.querySelector('.xtag')?.remove();if(m!==undefined)x.insertAdjacentHTML('beforeend',`<span class="xtag">${XAR(+x.dataset.l+1)}</span>`);});
   el.querySelectorAll('[data-r]').forEach(x=>{x.querySelector('.xtag')?.remove();const l=Object.keys(map).find(k=>map[k]===+x.dataset.r);if(l!==undefined)x.insertAdjacentHTML('beforeend',`<span class="xtag">${XAR(+l+1)}</span>`);});pick=null;});break;}
 case 'fill':{let pick=null;const map={};set(map);const words=el.querySelectorAll('.xbank button');
  words.forEach(b=>b.onclick=()=>{if(b.classList.contains('xused'))return;words.forEach(x=>x.classList.remove('xsel'));b.classList.add('xsel');pick=b;});
  el.querySelectorAll('.xblank').forEach(bl=>bl.onclick=()=>{const k=bl.dataset.b;if(map[k]!==undefined){const old=[...words].find(w=>w.textContent===map[k]);if(old)old.classList.remove('xused');delete map[k];bl.textContent='';bl.classList.remove('xfilled');if(!pick)return;}
   if(!pick)return;map[k]=pick.textContent;bl.textContent=pick.textContent;bl.classList.add('xfilled');pick.classList.add('xused');pick.classList.remove('xsel');pick=null;});break;}
 case 'sort':{let pick=null;const map={};set(map);const words=el.querySelectorAll('.xbank button');
  words.forEach(b=>b.onclick=()=>{words.forEach(x=>x.classList.remove('xsel'));b.classList.add('xsel');pick=b;});

 case 'order':{const arr=[];set(arr);const words=el.querySelectorAll('.xbank button');

function exGrade(it,v){const m=it.m||1;const R=(got,c,g)=>({got:Math.round(got*2)/2,max:m,c,g,q:it.q||it.text||''});
 switch(it.t){
 case 'tf':{const g=v===null?'—':v==='1'?'✓':'✗';return R(v!==null&&(v==='1')===!!it.a?m:0,it.a?'✓':'✗',g);}

 case 'match':{const map=v||{};let ok=0;it.pairs.forEach((p,k)=>{if(map[k]===k)ok++;});return R(m*ok/it.pairs.length,it.pairs.map(p=>p[0]+' ← '+p[1]).join(' ؛ '),it.pairs.map((p,k)=>p[0]+' ← '+(map[k]!==undefined?it.pairs[map[k]][1]:'—')).join(' ؛ '));}
 case 'fill':{const map=v||{};let ok=0;it.items.forEach((x,k)=>{if(xnorm(map[k])===xnorm(x[1]))ok++;});return R(m*ok/it.items.length,it.items.map(x=>x[1]).join(' ، '),it.items.map((x,k)=>map[k]||'—').join(' ، '));}
 case 'sort':{const map=v||{};let ok=0;it.items.forEach((x,k)=>{if(map[k]===x[1])ok++;});return R(m*ok/it.items.length,it.items.map(x=>x[0]+' ← '+it.bins[x[1]]).join(' ؛ '),it.items.map((x,k)=>x[0]+' ← '+(map[k]!==undefined?it.bins[map[k]]:'—')).join(' ؛ '));}
 case 'order':{const arr=v||[];let ok=0;it.seq.forEach((s,k)=>{if(arr[k]===k)ok++;});return R(m*ok/it.seq.length,it.seq.join(' ← '),arr.length?arr.map(k=>it.seq[k]).join(' ← '):'—');}
 case 'label':{const map=v||{};let ok=0;it.targets.forEach((t,k)=>{if(map[k]===t.c)ok++;});return R(m*ok/it.targets.length,it.targets.map(t=>t.n+': '+it.chips[t.c]).join(' ؛ '),it.targets.map((t,k)=>t.n+': '+(map[k]!==undefined?it.chips[map[k]]:'—')).join(' ؛ '));}
 case 'short':{const txt=xnorm(v||'');const keys=(it.keys||[]).map(xnorm);const hit=keys.filter(k=>k&&txt.includes(k)).length;const need=Math.max(1,Math.ceil(keys.length/2));const frac=!keys.length?(txt.length>2?1:0):Math.min(1,hit/need);return R(m*frac,it.a,v||'—');}
 case 'num':case 'word':{const g=v?parseInt(v,10):NaN;return R(g===it.ans?m:0,XAR(it.ans)+(it.why?' ('+it.why+')':''),v?XAR(v):'—');}
 case 'dictation':{const want=xnorm(it.text).split(' ').filter(Boolean),got=xnorm(v||'').split(' ').filter(Boolean);let ok=0;const used=new Set();want.forEach(w=>{const i=got.findIndex((g,idx)=>!used.has(idx)&&g===w);if(i>=0){used.add(i);ok++;}});return R(m*ok/Math.max(1,want.length),it.text,v||'—');}
 default:return R(0,'',v||'—');}}

   else if(s.t==='tf')out.push({t:'tf',q:s.q.replace(/[«»"]/g,''),a:s.c});
   else if(s.t==='match')out.push({t:'match',q:s.q,pairs:s.pairs});
   else if(s.t==='order')out.push({t:'order',q:s.q,seq:s.seq});
   else if(s.t==='sort2')out.push({t:'sort',q:s.q,bins:s.bins,items:s.items});
   else if(s.t==='read')out.push({t:'dictation',text:s.q});});
  if(l.words&&l.words.length>=3){const v=xsh(l.words).slice(0,3);out.push({t:'fill',q:'أكملي بالكلمة المناسبة من كلمات الدرس:',bank:v.map(x=>x[0]),items:v.map(x=>[x[1],x[0]])});}
  (EX_WORDS[Li]||[]).forEach(w=>out.push(exLabelWords(w)));
  return out;}};

drawStars();goMap();applySound();serverLoad();
