<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>مُغامرة العالمة ماريا 🌱 العلوم · الفصل الدراسي الأول</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="عالمة العلوم">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7FAEE; --card:#FFFFFF; --ink:#2E4A30; --leaf:#4E9B57; --leafD:#3A7A44;
  --sun:#F5C544; --rose:#EF7FA8; --soil:#8A5A3B; --sky:#E3F2FC; --line:#DCE8D2; --teal:#3E8E8E;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Baloo Bhaijaan 2','Segoe UI',Tahoma,sans-serif;
  background:linear-gradient(180deg,var(--sky) 0%, var(--paper) 40%);
  color:var(--ink); min-height:100vh;}
#app{max-width:640px;margin:0 auto;padding:12px 14px 60px}
/* topbar */
#top{display:flex;justify-content:space-between;align-items:center;background:var(--card);
  border-radius:18px;padding:8px 14px;box-shadow:0 3px 0 var(--line);margin-bottom:12px;
  font-weight:800;color:var(--leafD)}
#top button{border:none;background:#F1F7EA;border-radius:12px;padding:6px 14px;font-size:15px}
/* cards & type */
.chip{display:inline-block;background:var(--leaf);color:#fff;font-weight:800;font-size:13px;
  border-radius:999px;padding:3px 14px;margin-bottom:10px}
.chip.story{background:var(--soil)}
.chip.prep{background:var(--teal)}
.card{background:var(--card);border-radius:24px;padding:22px 18px;box-shadow:0 4px 0 var(--line);text-align:center}
h1{font-size:25px;margin:6px 0 4px}
h2{font-size:20px;margin:4px 0 14px;line-height:1.5}
p.sub{margin:0 0 14px;font-size:15px;color:#5C7460;line-height:1.8}
.big{font-size:50px;margin:4px 0}
button{font-family:inherit;font-weight:800;font-size:17px;color:var(--ink);
  background:#F1F7EA;border:2px solid var(--line);border-radius:18px;
  padding:13px 16px;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.96)}
.go{background:var(--leaf);border-color:var(--leafD);color:#fff;font-size:18px;padding:13px 30px;
  box-shadow:0 4px 0 var(--leafD)}
.go:disabled{opacity:.4;box-shadow:none}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.opts button.ok{background:#DFF3DC;border-color:var(--leaf);color:var(--leafD)}
.opts button.locked{pointer-events:none}
.wrong{animation:wig .35s}
@keyframes wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.hintPulse{animation:pul 1s infinite}
@keyframes pul{50%{box-shadow:0 0 0 6px rgba(245,197,68,.45)}}
/* map */
.uhead{margin:20px 4px 8px;font-size:18px;font-weight:800;color:var(--leafD)}
.chead{margin:2px 8px 8px;font-size:13.5px;font-weight:700;color:#7B937D}
.lrow{background:var(--card);border-radius:20px;box-shadow:0 3px 0 var(--line);
  padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.lrow .lic{font-size:30px;width:44px;text-align:center;filter:grayscale(.7);opacity:.75;position:relative}
.lrow.done{background:#EEF8EA;box-shadow:0 3px 0 #BFDDB6}
.lrow .tick{position:absolute;top:-8px;right:-10px;background:var(--leaf);color:#fff;border-radius:50%;width:24px;height:24px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;filter:none;opacity:1}
.lrow .tick.gold{background:var(--sun);color:#5A4300}
.opts button.bad,.pool button.bad,.mcol button.bad{background:#FBE3E3;border-color:#E39B9B;color:#9B3B3B}
.hs.hint{animation:hsP .8s infinite}
@keyframes hsP{50%{stroke-width:7;fill:rgba(245,197,68,.6)}}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) scale(.6);background:var(--leaf);color:#fff;font-weight:800;font-size:19px;padding:10px 26px;border-radius:999px;box-shadow:0 6px 0 var(--leafD);z-index:70;opacity:0;pointer-events:none;transition:all .25s}
#toast.show{opacity:1;transform:translateX(-50%) scale(1)}
.lrow.done .lic{filter:none;opacity:1}
.lrow .lt{flex:1;text-align:right}
.lrow .lt b{font-size:16px;display:block;line-height:1.4}
.lrow .lt small{color:#7B937D;font-weight:700;font-size:12px}
.lbtns{display:flex;flex-direction:column;gap:6px}
.lbtns button{font-size:13px;padding:7px 12px;border-radius:12px;white-space:nowrap}
.lbtns .bprep{background:#E6F3F3;border-color:#BFDDDD;color:var(--teal)}
.lbtns .bprep.done{background:#D2ECEC;border-color:var(--teal)}
.lbtns .btest{background:#FFF3D6;border-color:#F0DBA0;color:#9A7A17}
.lbtns .btest.done{background:#DFF3DC;border-color:var(--leaf);color:var(--leafD)}
.lbtns .bthink{background:#F3EEFA;border-color:#D9CCEC;color:#6B4FA0}
.lbtns .bthink.done{background:#E9E0F6;border-color:#6B4FA0}
.lockrow{opacity:.65}
/* vocab flip */
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.vcard{background:#F6FBF3;border:2px solid var(--line);border-radius:16px;padding:14px 10px;
  min-height:92px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-weight:800;font-size:17px;line-height:1.5}
.vcard.open{background:#FFF9E3;border-color:var(--sun);font-weight:700;font-size:13.5px;line-height:1.7}
.vcard.seen{box-shadow:0 0 0 2px #DFF3DC inset}
/* pools, bins, match, order (engine) */
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.pool button{font-size:17px}
.bins{display:flex;gap:10px}
.bin{flex:1;background:#F1F7EA;border:2px dashed var(--leaf);border-radius:18px;min-height:110px;padding:8px}
.bin h3{margin:2px 0 6px;font-size:15px;color:var(--leafD)}
.bin .got{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bin .got span{background:#fff;border-radius:12px;padding:4px 10px;font-size:14px;font-weight:700;border:1px solid var(--line)}
.pool button.sel{background:#FFF3D6;border-color:var(--sun)}
.mcols{display:flex;gap:10px;margin-top:8px}
.mcol{flex:1;display:flex;flex-direction:column;gap:8px}
.mcol button{font-size:14px;padding:11px 8px;line-height:1.5}
.mcol button.pick{background:#FFF3D6;border-color:var(--sun)}
.mcol button.done{background:#DFF3DC;border-color:var(--leaf);color:var(--leafD);pointer-events:none}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.slot{min-width:66px;min-height:50px;border:2px dashed #C6D6BC;border-radius:14px;
  display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:800;
  color:#AFC4AC;padding:4px 8px}
.slot.fill{border-style:solid;border-color:var(--leaf);background:#DFF3DC;color:var(--leafD)}
.arrow{align-self:center;color:#AFC4AC;font-size:15px}
.qbox{background:#F6FBF3;border:2px solid var(--line);border-radius:18px;padding:16px;font-size:18px;line-height:1.8;margin-bottom:12px}
.ans{background:#FFF9E3;border:2px solid var(--sun);border-radius:18px;padding:14px;font-size:16px;line-height:1.8;margin:12px 0;display:none;text-align:right}
.ans.show{display:block}
.marks{display:none;gap:10px;justify-content:center;flex-wrap:wrap}
.marks.show{display:flex}
.hs{fill:rgba(245,197,68,.25);stroke:var(--sun);stroke-width:2.5;cursor:pointer}
.hs.done{fill:rgba(78,155,87,.35);stroke:var(--leaf);pointer-events:none}
.hlabel{font-family:inherit;font-weight:800;font-size:15px;fill:var(--leafD)}
/* overlay + confetti */
#ovl{position:fixed;inset:0;background:rgba(46,74,48,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#ovl.show{display:flex}
#ovl .inner{background:var(--card);border-radius:28px;padding:30px 24px;text-align:center;max-width:420px;animation:pop .45s}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#ovl .bicon{font-size:62px}
.conf{position:fixed;font-size:24px;z-index:60;animation:fall 1.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.2}}
.nav{margin-top:18px}
footer{text-align:center;font-size:12px;color:#93A893;margin-top:26px}
footer button{border:none;background:none;color:#B9C9B9;font-size:11px;text-decoration:underline;padding:4px}

/* ---- farm animations ---- */
.an-walk,.an-walk-s{transform-box:fill-box;transform-origin:center;animation:walk 16s ease-in-out infinite}
.an-walk-s{animation:walks 26s ease-in-out infinite}
@keyframes walk{0%{transform:translateX(0) scaleX(1)}48%{transform:translateX(110px) scaleX(1)}52%{transform:translateX(110px) scaleX(-1)}98%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
@keyframes walks{0%{transform:translateX(0) scaleX(1)}48%{transform:translateX(60px) scaleX(1)}52%{transform:translateX(60px) scaleX(-1)}98%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
.an-bob{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.an-tail{transform-box:fill-box;transform-origin:left bottom;animation:tail 1.6s ease-in-out infinite alternate}
@keyframes tail{from{transform:rotate(-12deg)}to{transform:rotate(18deg)}}
.an-fly{animation:fly 20s linear infinite}
@keyframes fly{0%{transform:translate(-40px,0)}50%{transform:translate(300px,-30px)}100%{transform:translate(700px,10px)}}
.an-flutter{animation:flutter 7s ease-in-out infinite alternate}
@keyframes flutter{0%{transform:translate(0,0)}33%{transform:translate(26px,-18px)}66%{transform:translate(-12px,-32px)}100%{transform:translate(32px,-8px)}}
.an-wing{transform-box:fill-box;transform-origin:center;animation:wing .28s ease-in-out infinite alternate}
@keyframes wing{from{transform:scaleX(1)}to{transform:scaleX(.25)}}
.an-hop{animation:hop 4.5s ease-in-out infinite}
@keyframes hop{0%,72%,100%{transform:translateY(0)}80%{transform:translateY(-24px)}88%{transform:translateY(0)}}
.an-spin{animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.an-orbit{animation:spin 24s linear infinite}
.an-sway{transform-box:fill-box;transform-origin:bottom center;animation:sway 4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.an-drift{animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(70px)}}
.an-rain{stroke-dasharray:7 11;animation:rain .55s linear infinite}
@keyframes rain{to{stroke-dashoffset:-18}}
.an-flow{stroke-dasharray:16 20;animation:flow 2.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-36}}
.an-worm{animation:worm 3s ease-in-out infinite alternate}
@keyframes worm{to{transform:translateX(16px)}}
.an-shine{animation:shine 3s ease-in-out infinite alternate}
@keyframes shine{to{opacity:.35}}
@media (prefers-reduced-motion:reduce){[class^="an-"],[class*=" an-"]{animation:none}}
.pbar{height:8px;background:#EFF4E8;border-radius:99px;margin:0 0 14px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .4s}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button id="backB" style="visibility:hidden" onclick="goMap()">🏡 الخريطة</button>
    <button id="sndB" onclick="toggleSound()" style="font-size:18px">🔊</button><span>⭐ <span id="stars">0</span></span>
  </div>
  <div id="stage"></div>
  <footer>العُلوم · الصَّفّ الثَّالث · الفصل الدِّراسيّ الأوَّل · طبعة ١٤٤٨
    <br><button onclick="exportProgress()">حفظ نسخة</button> · <button onclick="importProgress()">استرجاع نسخة</button> · <button onclick="hardReset()">بداية جديدة (يمسح التَّقدُّم)</button></footer>
<input type="file" id="impF" accept=".json,application/json" style="display:none">
</div>
<div id="ovl"><div class="inner"></div></div>
<div id="toast"></div>

<script>
/* ==================== بيانات الدروس ==================== */
const U1='الوحدة الأولى: المخلوقات الحيَّة', U2='الوحدة الثَّانية: النِّظام البيئيّ', U3='الوحدة الثَّالثة: الأرض ومواردها';

const LESSONS=[
/* ---------- 1 ---------- */
{u:U1,ch:'الفصل ١: التَّعرُّف على المخلوقات الحيَّة',name:'المخلوقات الحيَّة وحاجاتها',ic:'🐈',
 idea:'المخلوقات الحيَّة تنمو وتتغيَّر وتتكاثر وتستجيب لما حولها، وتحتاج إلى أشياء لتبقى حيَّةً.',
 eq:'ما خصائص المخلوقات الحيَّة؟ وماذا تحتاج لتعيش؟',
 vocab:[
  ['المخلوق الحيّ','شيء ينمو ويتكاثر ويستجيب ويحتاج إلى الغذاء والماء والهواء، مثل القطَّة والشَّجرة.'],
  ['التَّكاثر','أن يُنتج المخلوق الحيّ صغارًا تُشبهه.'],
  ['الاستجابة للمُؤثِّرات','أن يتصرَّف المخلوق عندما يحدث شيء حوله، مثل طائر يسمع صوتًا فيطير بعيدًا.'],
  ['الخليَّة','وحدة البناء الصَّغيرة جدًّا الَّتي تتكوَّن منها أجسام المخلوقات الحيَّة.']],
 guess:[['هل الصَّخرة مخلوق حيّ؟','لا: لا تنمو ولا تتكاثر ولا تحتاج غذاءً.'],['ممّ يتكوَّن جسمكِ؟','من خلايا صغيرة جدًّا.']],
 test:[
  {t:'sort2',q:'صنّفي كل بطاقة: اضغطي عليها ثم اختاري المكان الصحيح.',
   bins:['مخلوق حي 🌟','شيء غير حي 🪨'],
   items:[['🐈 قطة',0],['🪨 صخرة',1],['🌳 شجرة',0],['🚲 دراجة',1],['🐦 طائر',0],['🪑 كرسي',1]]},
  {t:'mcq',q:'ينمو الجرو ويصبح كلبًا كبيرًا. ما الخاصية؟',o:['النمو','التكاثر','الاستجابة للمؤثرات'],c:0},
  {t:'mcq',q:'سمع الطائر صوتًا فتحرّك بعيدًا. ما الخاصية؟',o:['النمو','الاستجابة للمؤثرات','التكاثر'],c:1},
  {t:'multi',q:'اختاري الأشياء التي يحتاج إليها المخلوق الحي، ثم اضغطي "تحقّقي".',
   items:['💧 الماء','🍎 الغذاء','🌬️ الهواء','🏠 مكان مناسب للعيش','📱 الهاتف','🧸 لعبة'],correct:[0,1,2,3]},
  {t:'open',q:'هل كل شيء يتحرك يُعدّ مخلوقًا حيًا؟ فسّري بصوتكِ.',
   a:'لا. السيارة تتحرك لكنها غير حية، لأنها لا تنمو ولا تتكاثر ولا تحتاج إلى غذاء.'}]},
/* ---------- 2 ---------- */
{u:U1,ch:'الفصل ١: التَّعرُّف على المخلوقات الحيَّة',name:'النَّباتات وأجزاؤها',ic:'🌿',
 idea:'للنَّبات أجزاء، ولكُلّ جُزء وظيفة تُساعد النَّبات على العيش والنُّمُوّ.',
 eq:'ما أجزاء النَّبات؟ وما وظيفة كلّ جُزء؟',
 vocab:[
  ['الجُذور','تُثبِّت النَّبات في التُّربة وتمتصّ الماء والأملاح المعدنيَّة.'],
  ['السَّاق','تدعم النَّبات وتنقل الماء والموادّ داخله.'],
  ['الأوراق','تصنع الغذاء للنَّبات باستخدام ضوء الشَّمس.'],
  ['الأزهار','تُساعد النَّبات على التَّكاثر وتكوين البُذور.']],
 guess:[['ماذا يحتاج النَّبات لينمو؟','ضوء وماء وهواء وتُربة.'],['أين يصنع النَّبات غذاءه؟','في الأوراق، بضوء الشَّمس.']],
 test:[
  {t:'plant',q:'أين يوجد كل جزء؟ اضغطي على مكانه في الرسم.'},
  {t:'match',q:'اضغطي على الجزء ثم على وظيفته الصحيحة.',
   pairs:[['الجذور','تثبيت النبات وامتصاص الماء والأملاح'],['الساق','دعم النبات ونقل الماء والمواد'],
          ['الأوراق','صنع الغذاء باستخدام ضوء الشمس'],['الزهرة','التكاثر وتكوين البذور']]},
  {t:'mcq',q:'أعيش تحت التربة وأمتص الماء. من أنا؟',o:['الجذور','الساق','الأوراق'],c:0},
  {t:'mcq',q:'أستخدم ضوء الشمس لصنع الغذاء. من أنا؟',o:['الأزهار','الأوراق','الجذور'],c:1},
  {t:'open',q:'وضعنا نباتًا في مكان مظلم. ماذا تتوقعين أن يحدث؟ ولماذا؟',
   a:'يضعف ويذبل، لأن الأوراق لا تستطيع صنع الغذاء بدون ضوء الشمس.'},
  {t:'open',q:'النبات لديه ضوء لكنه لا يحصل على الماء. ماذا تتوقعين؟',
   a:'يذبل ويموت، لأن الجذور لا تجد ماءً تمتصه، والنبات يحتاج إلى الماء ليعيش.'}]},
/* ---------- 3 ---------- */
{u:U1,ch:'الفصل ٢: المخلوقات الحيَّة تنمو وتتغيَّر',name:'دورات حياة النَّباتات',ic:'🌱',
 idea:'النَّباتات الزَّهريَّة تنمو من البُذور، وتمُرّ بسلسلة من التَّغيُّرات لتنمو وتنضج ثُمّ تُكوِّن بذورًا جديدةً.',
 eq:'كيف تنمو النَّباتات وتتكاثر؟',
 vocab:[
  ['الإنبات','بداية نُمُوّ البذرة: تمتصّ الماء فيخرج الجُذَير ثُمّ السَّاق الصَّغيرة.'],
  ['التَّلقيح','انتقال حُبوب اللِّقاح من الجُزء الذَّكريّ إلى الجُزء الأُنثويّ في الزَّهرة.'],
  ['الإخصاب','يحدث بعد التَّلقيح، وتتكوَّن بعده البُذور.'],
  ['دورة الحياة','مراحل حياة النَّبات من البذرة إلى نبات يصنع بذورًا جديدةً، ثُمّ تبدأ من جديد.']],
 guess:[['من أين تأتي البُذور؟','من الأزهار بعد التَّلقيح.'],['ماذا داخل البذرة؟','غلاف، وفِلقَة، وجنين.']],
 test:[
  {t:'order',q:'رتّبي قصة الإنبات بالترتيب الصحيح.',
   seq:['🌰 بذرة','⬇️ خروج الجُذير','🌿 ظهور الساق','🍃 ظهور الأوراق','🌱 نبتة صغيرة']},
  {t:'seed',q:'اضغطي على مكان كل جزء من أجزاء البذرة.'},
  {t:'mcq',q:'ما الجزء الذي سيصبح نباتًا جديدًا؟',o:['غلاف البذرة','الفلقة','الجنين'],c:2},
  {t:'mcq',q:'ما جزء النبات الذي يُنتج البذور؟',o:['الأزهار','الساق','الجذور'],c:0},
  {t:'order',q:'رتّبي رحلة حبة اللقاح.',

   <p class="sub">${first?'أحسنتِ يا ماريا! شارة جديدة تنضمّ إلى مجموعتكِ! 🌟':'راجعتِ الدَّرس من جديد، رائع! 🌟'}</p>
   ${first?`<p class="sub">🌾 أُضيفت قطعة جديدة إلى مزرعتكِ: <b>${FARM[s.i].n}</b>!</p>`:''}
   <button class="go" onclick="document.getElementById('ovl').classList.remove('show');goFarm()">شاهدي المزرعة 🌾</button>
   <div style="height:8px"></div>
   <button onclick="document.getElementById('ovl').classList.remove('show');goMap()">العودة إلى الخريطة</button>`;
  ov.classList.add('show');return;}
 if(s.t==='thinkDone'){const L=s.L;
  if(!ST.think)ST.think=[];
  const first=!ST.think.includes(s.i);
  if(first){ST.think.push(s.i);addStar(3);save();}
  confetti();tada();
  stage.innerHTML=`${chip('🧠 فكِّري أكثر','story')}<div class="card">
   <div class="big">🧠✨</div><h1>عقلكِ يكبر يا ماريا!</h1>
   <p class="sub">فكَّرتِ خارج الكتاب في درس <b>${L.name}</b> ${L.ic}${first?'، وحصلتِ على ٣ نُجوم إضافيَّة!':'. رائع أنَّكِ عُدتِ إليه!'}</p>
   <button class="go" onclick="goMap()">العودة إلى الخريطة 🏡</button></div>`;return;}
 if(s.t==='trophy'){
  if(!ST.finalDone){ST.finalDone=true;addStar(10);save();}
  applause(true);tada();confetti();setTimeout(confetti,600);
  stage.innerHTML=`<div class="card"><div class="big">🏆👑</div>
   <h1>مبروك يا ماريا، عالمة الفصل الأوَّل!</h1>
   <p class="sub">أنهيتِ الدُّروس الاثني عشر كلَّها وجمعتِ <b>${ST.stars} ⭐</b>.<br>مزرعتكِ اكتملت: عرضكِ الكبير هُو أن تحكي قصَّة كلّ قطعة فيها للعائلة! 💚</p>
   <button class="go" onclick="goFarm()">إلى مزرعتي 🌾</button>
   <div style="height:8px"></div>
   <button onclick="goMap()">العودة إلى الخريطة 🏡</button></div>`;return;}
 if(s.t==='mcq')return rMcq(s);
 if(s.t==='open')return rOpen(s);
 if(s.t==='sort2')return rSort(s);
 if(s.t==='multi')return rMulti(s);
 if(s.t==='match')return rMatch(s);
 if(s.t==='order')return rOrder(s);
 if(s.t==='tf')return rTf(s);
 if(s.t==='plant')return rPlant(s);
 if(s.t==='seed')return rSeed(s);
 if(s.t==='deck')return rDeck(s);
 if(s.t==='create')return rCreate(s);
}

/* ---- اختيار من متعدد ---- */
function rMcq(s){
 stage.innerHTML=`${chip(s.stage)}<div class="card"><div class="qbox">${s.q}</div>
  <div class="opts">${s.o.map((o,i)=>`<button data-i="${i}">${o}</button>`).join('')}</div>
  <div class="ans" id="fx"></div><div class="marks" id="mk"><button class="go" onclick="next()">تابعي ⬅</button></div></div>`;
 stage.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{
  stage.querySelectorAll('.opts button').forEach(x=>x.classList.add('locked'));
  const cb=stage.querySelector(`[data-i="${s.c}"]`);
  if(+b.dataset.i===s.c){cheer();b.classList.add('ok');addStar();
   if(s.why)showFix('💡 '+s.why,true);else setTimeout(next,900);}
  else{beep(false);b.classList.add('wrong','bad');setTimeout(()=>b.classList.remove('wrong'),400);cb.classList.add('ok');
   showFix('❌ ليس هذا. الإجابة الصَّحيحة: <b>'+s.o[s.c]+'</b>'+(s.why?'<br>💡 '+s.why:''),true);}});
}
/* ---- سؤال مفتوح ---- */
function rOpen(s){
 stage.innerHTML=`${chip(s.prep?'📖 خمِّني قبل الحصَّة!':s.kind==='whatif'?'🤔 ماذا لو؟ · '+(s.stage||''):(s.stage||''),s.prep?'prep':s.kind==='whatif'?'story':'')}<div class="card">
  <div class="qbox">${s.q}</div>
  <p class="sub">أجيبي بصوتكِ 🎤 ثُمّ اكشفي.</p>
  <button class="go" id="rev">اكشفي الإجابة 👀</button>
  <div class="ans" id="ansB">💡 ${s.a}</div>
  <div class="marks" id="mk">
   ${s.prep?'<button class="go" onclick="next()">تابعي ⬅</button>'
    :'<button class="go" onclick="cheer();addStar();next()">عرفتها! ⭐</button><button onclick="next()">سأُراجعها 🌱</button>'}
  </div></div>`;
 document.getElementById('rev').onclick=e=>{e.target.style.display='none';
  document.getElementById('ansB').classList.add('show');
  document.getElementById('mk').classList.add('show');};
}
/* ---- تصنيف ---- */
function rSort(s){let sel=null,left=s.items.length,miss=0;
 stage.innerHTML=`${chip(s.stage)}<div class="card">
  <div class="qbox">${s.q}</div>
  <div class="pool" id="pl">${shuffle(s.items.map((it,i)=>i)).map(i=>`<button data-i="${i}">${s.items[i][0]}</button>`).join('')}</div>
  <div class="bins">${s.bins.map((b,i)=>`<div class="bin" data-b="${i}"><h3>${b}</h3><div class="got"></div></div>`).join('')}</div>
  <div class="ans" id="fx"></div></div>`;
 const pl=stage.querySelector('#pl');
 pl.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  pl.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;
  stage.querySelectorAll('.bin').forEach(x=>x.classList.remove('hintPulse'));});
 stage.querySelectorAll('.bin').forEach(bin=>bin.onclick=()=>{
  if(!sel){showFix('اختاري بطاقةً أوَّلًا 👆');return;}const i=+sel.dataset.i;
  if(s.items[i][1]===+bin.dataset.b){beep(true);if(miss===0)addStar();miss=0;bin.classList.remove('hintPulse');
   bin.querySelector('.got').insertAdjacentHTML('beforeend',`<span>${s.items[i][0]}</span>`);
   sel.remove();sel=null;left--;document.getElementById('fx').classList.remove('show');
   if(left===0){cheer();setTimeout(next,1000);}}
  else{beep(false);miss++;sel.classList.add('wrong');setTimeout(()=>sel&&sel.classList.remove('wrong'),400);
   stage.querySelector(`.bin[data-b="${s.items[i][1]}"]`).classList.add('hintPulse');
   showFix('❌ ليس هُنا. <b>'+s.items[i][0]+'</b> مكانه في: <b>'+s.bins[s.items[i][1]]+'</b> (اضغطي عليه)');}});
}
/* ---- اختيار متعدد ---- */
function rMulti(s){
 stage.innerHTML=`${chip(s.stage)}<div class="card"><div class="qbox">${s.q}</div>
  <div class="pool">${s.items.map((it,i)=>`<button data-i="${i}">${it}</button>`).join('')}</div>
  <button class="go" id="chk">تحقَّقي ✅</button>
  <div class="ans" id="fx"></div><div class="marks" id="mk"><button class="go" onclick="next()">تابعي ⬅</button></div></div>`;
 stage.querySelectorAll('.pool button').forEach(b=>b.onclick=()=>b.classList.toggle('sel'));
 document.getElementById('chk').onclick=e=>{
  const sel=[...stage.querySelectorAll('.pool button.sel')].map(b=>+b.dataset.i).sort((a,b)=>a-b).join(',');
  e.target.style.display='none';
  stage.querySelectorAll('.pool button').forEach(b=>{b.classList.add('locked');const i=+b.dataset.i;
   if(s.correct.includes(i))b.classList.add('ok');else if(b.classList.contains('sel'))b.classList.add('bad');});
  if(sel===s.correct.join(',')){cheer();addStar(2);setTimeout(next,1000);}
  else{beep(false);showFix('❌ ليس تمامًا. الإجابة الصَّحيحة (بالأخضر): <b>'+s.correct.map(i=>s.items[i]).join('، ')+'</b>',true);}};
}
/* ---- مطابقة ---- */
function rMatch(s){let pick=null,left=s.pairs.length,miss=0;
 const R=shuffle(s.pairs.map((p,i)=>i));
 stage.innerHTML=`${chip(s.stage)}<div class="card"><div class="qbox">${s.q}</div>
  <div class="mcols">
   <div class="mcol">${s.pairs.map((p,i)=>`<button data-l="${i}">${p[0]}</button>`).join('')}</div>
   <div class="mcol">${R.map(i=>`<button data-r="${i}">${s.pairs[i][1]}</button>`).join('')}</div>
  </div><div class="ans" id="fx"></div></div>`;
 stage.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{
  stage.querySelectorAll('[data-l]').forEach(x=>x.classList.remove('pick'));
  stage.querySelectorAll('[data-r]').forEach(x=>x.classList.remove('hintPulse'));
  b.classList.add('pick');pick=+b.dataset.l;});
 stage.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
  if(pick===null){showFix('اختاري أوَّلًا الكلمة من العمود الأيمن 👉');return;}
  if(+b.dataset.r===pick){beep(true);if(miss===0)addStar();miss=0;b.classList.add('done');b.classList.remove('hintPulse');
   const lb=stage.querySelector(`[data-l="${pick}"]`);lb.classList.remove('pick');lb.classList.add('done');
   pick=null;left--;document.getElementById('fx').classList.remove('show');
   if(left===0){cheer();setTimeout(next,1000);}}
  else{beep(false);miss++;b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),400);
   stage.querySelector(`[data-r="${pick}"]`).classList.add('hintPulse');
   showFix('❌ ليس هذا. <b>'+s.pairs[pick][0]+'</b> يُطابق: <b>'+s.pairs[pick][1]+'</b> (اضغطي عليها)');}});
}
/* ---- ترتيب ---- */
function rOrder(s){let pos=0,miss=0;
 stage.innerHTML=`${chip(s.stage)}<div class="card"><div class="qbox">${s.q}</div>
  <div class="slots">${s.seq.map((_,i)=>`<div class="slot" data-s="${i}">${i+1}</div>${i<s.seq.length-1?'<div class="arrow">←</div>':''}`).join('')}</div>
  <div class="pool">${shuffle(s.seq.map((c,i)=>i)).map(i=>`<button data-i="${i}" style="font-size:15px">${s.seq[i]}</button>`).join('')}</div>
  <div class="ans" id="fx"></div></div>`;
 stage.querySelectorAll('.pool button').forEach(b=>b.onclick=()=>{
  if(+b.dataset.i===pos){beep(true);if(miss===0)addStar();
   const sl=stage.querySelector(`[data-s="${pos}"]`);sl.classList.add('fill');sl.textContent=s.seq[pos];
   b.remove();pos++;miss=0;document.getElementById('fx').classList.remove('show');
   if(pos===s.seq.length){cheer();setTimeout(next,1000);}}
  else{beep(false);miss++;b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),400);
   const c=stage.querySelector(`.pool [data-i="${pos}"]`);if(c)c.classList.add('hintPulse');
   showFix('❌ ليس هذا. الخُطوة التَّالية الصَّحيحة هي: <b>'+s.seq[pos]+'</b> (اضغطي عليها)');}});
}
/* ---- صح / خطأ ---- */
function rTf(s){
 stage.innerHTML=`${chip(s.stage)}<div class="card"><div class="qbox">${s.q}</div>
  <div class="pool"><button data-v="1">صحيح ✅</button><button data-v="0">خطأ ❌</button></div>
  <div class="ans" id="fx"></div>
  <div class="marks" id="mk"><button class="go" onclick="next()">تابعي ⬅</button></div></div>`;
 stage.querySelectorAll('.pool button').forEach(b=>b.onclick=()=>{
  const v=b.dataset.v==='1';
  stage.querySelectorAll('.pool button').forEach(x=>x.classList.add('locked'));
  const cb=stage.querySelector(`[data-v="${s.c?'1':'0'}"]`);cb.classList.add('ok');
  if(v===s.c){cheer();addStar();showFix('✅ '+s.fix,true);}
  else{beep(false);b.classList.add('wrong','bad');setTimeout(()=>b.classList.remove('wrong'),400);
   showFix('❌ ليس هذا. العبارة <b>'+(s.c?'صحيحة':'خاطئة')+'</b>.<br>'+s.fix,true);}});
}
/* ---- نقاط ساخنة: النبات ---- */
function rPlant(s){
 const parts=[{n:'الأوراق',x:98,y:172},{n:'الجذور',x:150,y:300},{n:'الزهرة',x:150,y:92},{n:'الساق',x:150,y:225}];
 hotspotScreen(s,parts,`
  <svg viewBox="0 0 300 340" width="100%" style="max-width:340px">
   <rect x="0" y="258" width="300" height="82" rx="10" fill="#C9A27E"/>
   <path d="M150 260 q-25 20 -45 45 M150 260 q25 20 45 45 M150 260 q0 30 0 60 M150 268 q-14 18 -22 48 M150 268 q14 18 22 48"
     stroke="#8A5A3B" stroke-width="5" fill="none" stroke-linecap="round"/>
   <rect x="146" y="118" width="8" height="142" rx="4" fill="#4E9B57"/>
   <ellipse cx="112" cy="178" rx="34" ry="15" fill="#5FB368" transform="rotate(-18 112 178)"/>
   <ellipse cx="188" cy="205" rx="34" ry="15" fill="#5FB368" transform="rotate(18 188 205)"/>
   ${[0,72,144,216,288].map(a=>`<circle cx="${150+22*Math.cos(a*Math.PI/180)}" cy="${92+22*Math.sin(a*Math.PI/180)}" r="14" fill="#F49BBB"/>`).join('')}
   <circle cx="150" cy="92" r="12" fill="#F5C544"/>
  </svg>`);
}
/* ---- نقاط ساخنة: البذرة ---- */
function rSeed(s){
 const parts=[{n:'غلاف البذرة',x:150,y:32},{n:'الفلقة',x:185,y:118},{n:'الجنين',x:88,y:112}];
 hotspotScreen(s,parts,`
  <svg viewBox="0 0 300 210" width="100%" style="max-width:340px">
   <ellipse cx="150" cy="110" rx="120" ry="85" fill="#E8C98F" stroke="#8A5A3B" stroke-width="10"/>
   <ellipse cx="172" cy="112" rx="78" ry="60" fill="#F3DDB2"/>
   <path d="M95 140 q-12 -30 8 -52 q14 -16 28 -10 q-4 16 -12 30 q-8 16 -24 32z" fill="#5FB368" stroke="#3A7A44" stroke-width="3"/>
  </svg>`);
}
function hotspotScreen(s,parts,svgBody){
 let cur=0,miss=0;
 stage.innerHTML=`${chip(s.stage)}<div class="card"><div class="qbox">${s.q}</div>
  <h2 id="ask">أين <b style="color:var(--leafD)">${parts[0].n}</b>؟</h2>
  <div>${svgBody}</div><div class="ans" id="fx"></div></div>`;
 const svg=stage.querySelector('svg');const circles=[];
 parts.forEach((p,i)=>{
  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',17);
  c.setAttribute('class','hs');c.dataset.i=i;svg.appendChild(c);circles.push(c);
  c.addEventListener('click',()=>{
   if(+c.dataset.i===cur){beep(true);if(miss===0)addStar();miss=0;
    c.classList.add('done');c.classList.remove('hint');document.getElementById('fx').classList.remove('show');
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',p.x);t.setAttribute('y',p.y-24);t.setAttribute('text-anchor','middle');
    t.setAttribute('class','hlabel');t.textContent=p.n;svg.appendChild(t);
    cur++;
    if(cur<parts.length)document.getElementById('ask').innerHTML=`أين <b style="color:var(--leafD)">${parts[cur].n}</b>؟`;
    else{document.getElementById('ask').textContent='أحسنتِ! 🌟';cheer();setTimeout(next,1000);}}
   else{beep(false);miss++;circles[cur].classList.add('hint');
    document.getElementById('ask').classList.add('wrong');
    setTimeout(()=>document.getElementById('ask').classList.remove('wrong'),400);
    showFix('❌ ليس هذا الجُزء. <b>'+parts[cur].n+'</b> في الدَّائرة الَّتي تومض 👆');}});
 });
}
/* ---- صمّمي واخترعي ---- */
function rCreate(s){
 stage.innerHTML=`${chip('🎨 صمِّمي وجرِّبي · '+(s.stage||''),'story')}<div class="card"><div class="qbox">${s.q}</div>
  <p class="sub">على ورقة أو بصوتكِ مع ماما.</p>
  <button id="hint">أفكار مُساعدة 💡</button><div class="ans" id="hb">💡 ${s.hints}</div>
  <div class="nav"><button class="go" onclick="addStar(2);next()">أنجزتها! ⭐⭐</button></div></div>`;
 document.getElementById('hint').onclick=e=>{e.target.style.display='none';document.getElementById('hb').classList.add('show');};
}
/* ---- بطاقات التحدي ---- */
function rDeck(s){let marked=0;
 stage.innerHTML=`${chip(s.stage,'story')}<div class="card"><div class="qbox">${s.q}</div>
  <div class="deck" style="display:flex;flex-direction:column;gap:12px;text-align:right">
  ${s.cards.map((c,i)=>`
   <div class="dcard" data-i="${i}" style="background:#F6FBF3;border:2px solid var(--line);border-radius:18px;padding:14px">
    <span class="tag" style="float:left;font-size:20px"></span>
    <div style="font-size:16px;font-weight:800;line-height:1.7">🎯 ${i+1}. ${c[0]}</div>
    <div class="da" style="display:none;background:#FFF9E3;border-radius:12px;padding:10px;margin-top:8px;font-size:14.5px;line-height:1.7">💡 ${c[1]}</div>
    <div style="display:flex;gap:8px;margin-top:10px">
     <button class="rv" style="font-size:13px;padding:8px 14px">اكشفي 👀</button>
     <button class="y go" style="display:none;font-size:13px;padding:8px 14px">عرفتها ⭐</button>
     <button class="n" style="display:none;font-size:13px;padding:8px 14px">سأُراجعها 🌱</button>
    </div></div>`).join('')}</div>
  <div class="nav"><button class="go" id="dn" disabled>أكملت التَّحدِّي! (0/${s.cards.length})</button></div></div>`;
 const dn=document.getElementById('dn');
 stage.querySelectorAll('.dcard').forEach(dc=>{
  const rv=dc.querySelector('.rv'),y=dc.querySelector('.y'),n=dc.querySelector('.n'),da=dc.querySelector('.da');
  rv.onclick=()=>{da.style.display='block';rv.style.display='none';y.style.display='';n.style.display='';};
  function mark(star){if(dc.dataset.m)return;dc.dataset.m='1';
   dc.style.borderColor='var(--leaf)';dc.querySelector('.tag').textContent=star?'⭐':'🌱';
   if(star){addStar();cheer();}
   y.style.display='none';n.style.display='none';marked++;
   dn.textContent=`أكملت التَّحدِّي! (${marked}/${s.cards.length})`;
   if(marked===s.cards.length)dn.disabled=false;}
  y.onclick=()=>mark(true);n.onclick=()=>mark(false);});
 dn.onclick=next;
}

drawStars();goMap();applySound();serverLoad();
</script>
</body>
</html>
